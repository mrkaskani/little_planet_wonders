  forbidden_behavior:
    - episode_redefines_canonical_location
    - scene_recreates_existing_asset
    - unregistered_location_id
    - unregistered_zone_id
    - unregistered_asset_id
    - unsupported_asset_state
    - unsupported_interaction
    - unsafe_child_interaction
    - fixed_asset_moved
    - unique_asset_duplicated
    - unexplained_state_reset
    - unexplained_asset_teleportation
    - unapproved_environment_variant
    - asset_visual_identity_drift
