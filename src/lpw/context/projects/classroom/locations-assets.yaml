locations_assets:
  metadata:
    id: reusable_preschool_location_asset_library
    version: 2
    status: production
    scope: reusable_location_environment_prop_and_interaction_vocabulary
    audience_age:
      minimum: 3
      maximum: 6
    philosophy: define_what_the_world_contains_and_what_those_things_can_do_once_then_let_episodes_select_and_modify_reusable_pieces
    rules:
      episodes_select_registered_ids: true
      scenes_must_not_redefine_canonical_assets: true
      approved_visual_designs_remain_in_referenced_files: true
      this_file_does_not_duplicate_full_visual_descriptions: true

  reference_policy:
    canonical_sources:
      - approved_location_yaml
      - approved_environment_reference_images
      - approved_asset_reference_files
    rules:
      registry_entries_reference_existing_designs: true
      missing_reference_must_be_marked_unavailable: true
      never_recreate_or_infer_visual_design_from_state_name: true
      state_changes_must_not_redesign_asset_or_location: true

  location_schema:
    required_fields:
      - location_id
      - name
      - category
      - reference
      - zones
      - landmarks
      - entrances
      - exits
      - interaction_points
      - assets
      - environment_states
      - approved_variants
    rules:
      location_id_is_unique: true
      location_reference_is_authoritative: true
      location_instance_state_belongs_in_scene_or_continuity_state: true

  location_categories:
    - home
    - living_room
    - bedroom
    - bathroom
    - kitchen
    - classroom
    - activity_room
    - playground
    - garden
    - park
    - street
    - shop
    - library
    - play_center
    - nature
    - beach
    - forest
    - farm
    - vehicle
    - fantasy
    - other

  zone_schema:
    required_fields:
      - zone_id
      - reference
      - connected_zones
      - landmarks
      - assets
      - interaction_points
      - entry_points
      - exit_points
    rules:
      zones_are_used_for_scene_blocking: true
      connected_zone_required_for_continuous_character_travel: true
      disconnected_transition_requires_registered_transport_or_explicit_cut: true

  landmark_schema:
    required_fields:
      - landmark_id
      - location_id
      - zone_id
      - reference
      - fixed
      - interaction_allowed
    rules:
      permanent_landmark_never_moves_without_approved_location_revision: true
      landmark_id_is_stable_across_camera_angles: true

  asset_schema:
    required_fields:
      - asset_id
      - name
      - category
      - reference
      - default_location
      - default_zone
      - default_storage
      - mobility
      - ownership
      - unique
      - state_dimensions
      - allowed_interactions
    rules:
      asset_id_is_unique: true
      reference_controls_visual_identity: true
      current_state_and_position_belong_in_scene_continuity: true
      unique_asset_must_not_duplicate: true

  asset_categories:
    - structural
    - furniture
    - toy
    - educational_object
    - story_prop
    - container
    - clothing_item
    - wearable
    - food
    - drink
    - tool_child_safe
    - art_supply
    - musical_instrument
    - sports_object
    - playground_equipment
    - vegetation
    - vehicle
    - book
    - decoration
    - background_object
    - interactive_environment_asset

  mobility_schema:
    required_flags:
      - fixed
      - movable
      - carryable
      - wearable
      - rollable
      - pushable
      - pullable
      - environment_animated
    rules:
      fixed_and_movable_must_not_both_be_true: true
      carryable_requires_movable: true
      wearable_requires_movable: true
      movement_not_supported_by_true_flag_is_forbidden: true

  asset_state_vocabulary:
    generic_condition:
      states:
        - pristine
        - clean
        - slightly_dusty
        - dusty
        - dirty
        - muddy
        - wet
        - damp
        - dry
        - messy
        - damaged_mild
        - repaired
      transitions:
        pristine: [clean, slightly_dusty, dirty, wet]
        clean: [pristine, slightly_dusty, dusty, dirty, muddy, wet, messy]
        slightly_dusty: [dusty, dirty, clean]
        dusty: [dirty, clean]
        dirty: [muddy, wet, clean]
        muddy: [wet, clean]
        wet: [damp, dry]
        damp: [dry, wet]
        dry: [wet, damp]
        messy: [clean]
        damaged_mild: [repaired]
        repaired: [clean, pristine]
      trigger_requirements:
        return_to_clean: [wash, clean]
        return_to_dry: [dry, elapsed_drying_time]
        return_to_repaired: [child_safe_repair_action]
      safety:
        dangerous_or_disturbing_damage_forbidden: true

    container_state:
      states:
        - closed
        - slightly_open
        - half_open
        - open
        - empty
        - partially_full
        - full
      independent_dimensions:
        openness: [closed, slightly_open, half_open, open]
        fill: [empty, partially_full, full]
      transitions:
        closed: [slightly_open, half_open, open]
        slightly_open: [closed, half_open, open]
        half_open: [closed, slightly_open, open]
        open: [half_open, slightly_open, closed]
        empty: [partially_full, full]
        partially_full: [empty, full]
        full: [partially_full, empty]

    door_window_state:
      states:
        - closed
        - slightly_open
        - half_open
        - open
        - locked_if_story_safe
        - unlocked
      independent_dimensions:
        openness: [closed, slightly_open, half_open, open]
        lock: [locked_if_story_safe, unlocked]
      rules:
        locked_state_requires_child_safe_story_reason: true
        locked_state_must_not_create_frightening_entrapment: true

    switchable_state:
      states: [off, on]
      transitions:
        off: [on]
        on: [off]

    movement_state:
      states:
        - stationary
        - moving_slowly
        - moving
        - swinging
        - spinning
        - rolling
        - bouncing
        - floating
      rules:
        movement_requires_supported_mobility_flag: true
        state_change_requires_interaction_or_environment_trigger: true

    visibility_state:
      states:
        - visible
        - partially_hidden
        - hidden
        - covered
        - revealed
      rules:
        unique_story_asset_location_remains_tracked_while_hidden: true
        reveal_requires_prior_hidden_or_covered_state: true

    organization_state:
      states:
        - organized
        - slightly_messy
        - messy
        - scattered
        - sorted
      rules:
        return_to_organized_or_sorted_requires_sort_or_cleanup_action: true

    toy_state:
      states:
        - idle
        - being_used
        - moving
        - stored
        - assembled
        - disassembled_child_safe
      rules:
        disassembly_must_be_age_appropriate_and_safe: true

    book_state:
      states:
        - closed
        - open
        - page_turning
        - being_read
        - stored
      rules:
        page_turning_is_momentary: true

    food_state:
      states:
        - whole
        - partially_eaten
        - eaten
        - served
        - spilled
        - being_carried
      rules:
        consumption_state_does_not_reset: true

    drink_state:
      states:
        - full
        - partially_full
        - empty
        - spilled
      rules:
        consumed_or_spilled_amount_does_not_refill_without_pour_or_refill_action: true

    light_state:
      states:
        - off
        - on
        - dim
        - bright
      rules:
        light_intensity_change_requires_switch_or_environment_trigger: true

    water_state:
      states:
        - still
        - rippling
        - flowing
        - splashing
        - bubbling
      rules:
        state_must_match_physical_or_environment_trigger: true

  interaction_vocabulary:
    allowed_ids:
      - look_at
      - approach
      - touch
      - point_at
      - pick_up
      - hold
      - carry
      - give
      - receive
      - share
      - place
      - store
      - retrieve
      - open
      - close
      - push
      - pull
      - roll
      - bounce
      - gently_throw
      - catch
      - stack
      - sort
      - count
      - pour
      - stir
      - eat
      - drink
      - wear
      - remove
      - sit_on
      - climb
      - slide
      - swing
      - press
      - turn
      - wash
      - clean
      - dry
      - decorate
      - draw_on_if_allowed
      - build_with
      - play_with
      - stand_on
      - walk_on
      - enter
      - exit
    interaction_record:
      required_fields:
        - interaction_id
        - character_id
        - asset_id
        - interaction_point_id
        - start_state
        - end_state
        - persistence
    rules:
      asset_must_explicitly_allow_interaction: true
      interaction_must_match_mobility: true
      interaction_must_use_registered_point_when_required: true
      interaction_updates_character_and_asset_state_together: true

  interaction_safety:
    forbidden_encouragement:
      - unsafe_electricity_interaction
      - fire_interaction
      - sharp_object_interaction
      - dangerous_height_access
      - traffic_play
      - hazardous_chemical_interaction
      - unsafe_machinery_operation
    rules:
      every_interaction_must_be_suitable_for_ages_3_to_6: true
      restricted_environment_asset_allows_observe_only: true
      story_required_hazard_must_have_safe_distance_and_clear_guidance: true
      climbing_requires_explicit_child_safe_asset_approval: true

  environment_state_vocabulary:
    weather:
      states:
        - clear
        - sunny
        - partly_cloudy
        - cloudy
        - light_rain
        - medium_rain_story_approved
        - after_rain
        - light_snow_if_location_allows
        - breezy
      rules:
        severe_weather_requires_explicit_story_and_safety_approval: true
        state_must_be_approved_by_location: true
    ground_condition:
      states:
        - dry
        - slightly_wet
        - wet
        - muddy
        - sandy
        - snowy
    room_condition:
      states:
        - tidy
        - slightly_messy
        - messy
        - decorated
        - activity_in_progress
        - cleaned
    time_of_day:
      states:
        - early_morning
        - morning
        - midday
        - afternoon
        - late_afternoon
        - evening
        - night
    event_variant:
      states:
        - normal
        - birthday
        - celebration
        - learning_activity
        - arts_and_crafts
        - music_activity
        - cleanup_time
        - meal_time
        - bedtime
    rules:
      environment_state_is_temporary_scene_state: true
      environment_state_must_not_redesign_canonical_location: true
      state_persists_until_explicit_transition: true

  ownership_vocabulary:
    - character_owned
    - shared
    - location_owned
    - borrowed
    - temporarily_assigned
    - unowned

  uniqueness_policy:
    field: unique
    allowed_values: [true, false]
    rules:
      unique_true_allows_exactly_one_canonical_instance: true
      unique_false_requires_instance_ids_when_multiple_present: true
      unique_story_asset_must_never_duplicate_accidentally: true

  default_location_schema:
    fields:
      - default_location
      - default_zone
      - default_storage
    rules:
      movable_asset_may_leave_default_position: true
      changed_position_persists_until_explicit_move: true
      asset_must_not_teleport_back_to_default: true

  storage_relationships:
    allowed:
      - stored_in
      - stored_on
      - stored_under
      - stored_beside
    required_fields:
      - asset_id
      - relationship
      - storage_asset_id
    rules:
      storage_asset_must_exist: true
      stored_asset_must_not_remain_at_previous_position: true
      retrieve_clears_storage_relationship: true

  spatial_relationships:
    allowed:
      - inside
      - on_top_of
      - underneath
      - beside
      - behind
      - in_front_of
      - near
      - attached_to
      - hanging_from
    required_fields:
      - subject_id
      - relationship
      - reference_id
    rules:
      relationship_must_match_world_geometry: true
      fixed_relationship_persists_across_camera_angles: true

  interaction_point_types:
    - sit_point
    - pickup_point
    - dropoff_point
    - door_handle
    - button
    - shelf_reach
    - slide_top
    - slide_bottom
    - swing_seat
    - table_position
    - entry_threshold
    - exit_threshold
    - stand_point

  location_registry:
    rooftop:
      location_id: rooftop
      name: Tower 17 Rooftop
      category: other
      reference: locations/rooftop/location.yaml
      zones:
        - rooftop_center
        - south_entrance_approach
        - east_ventilation_approach
        - west_antenna_approach
        - north_skyline_boundary
      landmarks:
        - maintenance_entrance
        - ventilation_structure
        - communication_antenna
        - dense_city_skyline
      entrances:
        - maintenance_entrance
      exits:
        - maintenance_entrance
      interaction_points:
        - maintenance_door_handle
        - maintenance_door_entry
        - maintenance_door_exit
        - rooftop_center_stand
      assets:
        - rooftop_floor
        - maintenance_door
        - ventilation_structure
        - communication_antenna
        - dense_city_skyline
        - warning_light
      environment_states:
        weather: [light_rain, medium_rain_story_approved]
        ground_condition: [wet]
        room_condition: []
        time_of_day: [night]
        event_variant: [normal]
      approved_variants:
        - rooftop_night_light_rain
        - rooftop_night_medium_rain_story_approved

  zone_registry:
    rooftop_center:
      zone_id: rooftop_center
      reference: locations/rooftop/location.yaml#architecture.floor
      connected_zones: [south_entrance_approach, east_ventilation_approach, west_antenna_approach]
      landmarks: [maintenance_entrance, ventilation_structure, communication_antenna]
      assets: [rooftop_floor]
      interaction_points: [rooftop_center_stand]
      entry_points: []
      exit_points: []
    south_entrance_approach:
      zone_id: south_entrance_approach
      reference: locations/rooftop/location.yaml#architecture.south
      connected_zones: [rooftop_center]
      landmarks: [maintenance_entrance]
      assets: [maintenance_door]
      interaction_points: [maintenance_door_handle, maintenance_door_entry, maintenance_door_exit]
      entry_points: [maintenance_entrance]
      exit_points: [maintenance_entrance]
    east_ventilation_approach:
      zone_id: east_ventilation_approach
      reference: locations/rooftop/location.yaml#architecture.east
      connected_zones: [rooftop_center]
      landmarks: [ventilation_structure]
      assets: [ventilation_structure]
      interaction_points: []
      entry_points: []
      exit_points: []
    west_antenna_approach:
      zone_id: west_antenna_approach
      reference: locations/rooftop/location.yaml#architecture.west
      connected_zones: [rooftop_center]
      landmarks: [communication_antenna]
      assets: [communication_antenna]
      interaction_points: []
      entry_points: []
      exit_points: []
    north_skyline_boundary:
      zone_id: north_skyline_boundary
      reference: locations/rooftop/location.yaml#architecture.north
      connected_zones: []
      landmarks: [dense_city_skyline]
      assets: [dense_city_skyline]
      interaction_points: []
      entry_points: []
      exit_points: []
      restricted: true

  landmark_registry:
    maintenance_entrance:
      landmark_id: maintenance_entrance
      location_id: rooftop
      zone_id: south_entrance_approach
      reference: locations/rooftop/location.yaml#architecture.south
      fixed: true
      interaction_allowed: true
    ventilation_structure:
      landmark_id: ventilation_structure
      location_id: rooftop
      zone_id: east_ventilation_approach
      reference: locations/rooftop/location.yaml#architecture.east
      fixed: true
      interaction_allowed: false
    communication_antenna:
      landmark_id: communication_antenna
      location_id: rooftop
      zone_id: west_antenna_approach
      reference: locations/rooftop/location.yaml#architecture.west
      fixed: true
      interaction_allowed: false
    dense_city_skyline:
      landmark_id: dense_city_skyline
      location_id: rooftop
      zone_id: north_skyline_boundary
      reference: locations/rooftop/location.yaml#architecture.north
      fixed: true
      interaction_allowed: false

  entrance_exit_registry:
    maintenance_entrance:
      point_id: maintenance_entrance
      location_id: rooftop
      zone_id: south_entrance_approach
      reference: locations/rooftop/location.yaml#architecture.south
      entrance: true
      exit: true
      parent_asset_id: maintenance_door
      interaction_points: [maintenance_door_entry, maintenance_door_exit]

  interaction_point_registry:
    maintenance_door_handle:
      interaction_point_id: maintenance_door_handle
      type: door_handle
      location_id: rooftop
      zone_id: south_entrance_approach
      parent_asset_id: maintenance_door
      reference: locations/rooftop/location.yaml#architecture.south
      allowed_interactions: [touch, open, close]
      child_safety: approved_with_character_reach_calibration
    maintenance_door_entry:
      interaction_point_id: maintenance_door_entry
      type: entry_threshold
      location_id: rooftop
      zone_id: south_entrance_approach
      parent_asset_id: maintenance_door
      reference: locations/rooftop/location.yaml#architecture.south
      allowed_interactions: [approach, enter]
      child_safety: approved
    maintenance_door_exit:
      interaction_point_id: maintenance_door_exit
      type: exit_threshold
      location_id: rooftop
      zone_id: south_entrance_approach
      parent_asset_id: maintenance_door
      reference: locations/rooftop/location.yaml#architecture.south
      allowed_interactions: [approach, exit]
      child_safety: approved
    rooftop_center_stand:
      interaction_point_id: rooftop_center_stand
      type: stand_point
      location_id: rooftop
      zone_id: rooftop_center
      parent_asset_id: rooftop_floor
      reference: locations/rooftop/location.yaml#architecture.floor
      allowed_interactions: [stand_on, walk_on, place]
      child_safety: conditional_on_wet_surface_readability

  asset_registry:
    rooftop_floor:
      asset_id: rooftop_floor
      name: Rooftop Floor
      category: structural
      reference: locations/rooftop/location.yaml#architecture.floor
      default_location: rooftop
      default_zone: rooftop_center
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: location_owned
      unique: true
      state_dimensions:
        generic_condition: [wet]
      allowed_interactions: [stand_on, walk_on, place]
    maintenance_door:
      asset_id: maintenance_door
      name: Maintenance Door
      category: structural
      reference: locations/rooftop/location.yaml#architecture.south
      default_location: rooftop
      default_zone: south_entrance_approach
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: location_owned
      unique: true
      state_dimensions:
        door_window_state: [closed, open]
      allowed_interactions: [look_at, approach, touch, open, close, enter, exit]
    ventilation_structure:
      asset_id: ventilation_structure
      name: Ventilation Structure
      category: structural
      reference: locations/rooftop/location.yaml#architecture.east
      default_location: rooftop
      default_zone: east_ventilation_approach
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: location_owned
      unique: true
      state_dimensions: {}
      allowed_interactions: [look_at, point_at]
    communication_antenna:
      asset_id: communication_antenna
      name: Communication Antenna
      category: structural
      reference: locations/rooftop/location.yaml#architecture.west
      default_location: rooftop
      default_zone: west_antenna_approach
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: location_owned
      unique: true
      state_dimensions: {}
      allowed_interactions: [look_at, point_at]
      safety_restriction: observation_only
    dense_city_skyline:
      asset_id: dense_city_skyline
      name: Dense City Skyline
      category: background_object
      reference: locations/rooftop/location.yaml#architecture.north
      default_location: rooftop
      default_zone: north_skyline_boundary
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: location_owned
      unique: true
      state_dimensions:
        visibility_state: [visible, partially_hidden]
      allowed_interactions: [look_at, point_at]
      safety_restriction: observe_from_safe_zone_only
    warning_light:
      asset_id: warning_light
      name: Rooftop Warning Light
      category: interactive_environment_asset
      reference: locations/rooftop/location.yaml#lighting.practical
      default_location: rooftop
      default_zone: null
      default_storage: null
      mobility: {fixed: true, movable: false, carryable: false, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: true}
      ownership: location_owned
      unique: true
      state_dimensions:
        light_state: [off, on, dim, bright]
      allowed_interactions: [look_at, point_at]
      safety_restriction: no_character_electrical_interaction
    black_data_device:
      asset_id: black_data_device
      name: Black Data Device
      category: story_prop
      reference: scenes/rooftop-confrontation/continuity-start.yaml#characters.roxana.held_objects.black_data_device
      default_location: null
      default_zone: null
      default_storage: null
      mobility: {fixed: false, movable: true, carryable: true, wearable: false, rollable: false, pushable: false, pullable: false, environment_animated: false}
      ownership: temporarily_assigned
      unique: true
      state_dimensions:
        generic_condition: [clean, dirty, wet, damp, dry]
        visibility_state: [visible, partially_hidden, hidden, revealed]
      allowed_interactions: [look_at, approach, point_at, pick_up, hold, carry, give, receive, share, place, store, retrieve]

  scene_selection_schema:
    required_fields:
      - location_id
      - zone_id
      - required_assets
      - asset_states
      - environment_states
    optional_fields:
      - landmarks
      - interaction_points
      - entrances
      - exits
      - spatial_relationships
    validation_sequence:
      - validate_location_id
      - validate_zone_id
      - validate_asset_ids
      - validate_asset_states
      - validate_environment_states
      - validate_interactions
      - validate_safety
      - lock_for_continuity
    rules:
      use_ids_instead_of_redefining_assets: true
      selected_asset_must_belong_to_or_be_allowed_in_location: true

  custom_extension:
    allow_new_asset: true
    allow_new_state: true
    requirements:
      - explicit_definition
      - unique_id
      - story_reason
      - reuse_existing_category_when_possible
      - child_safety_review
    rules:
      do_not_duplicate_existing_asset: true
      do_not_recreate_existing_visual_design: true
      new_state_requires_transition_and_compatibility_definition: true

  continuity_rules:
    state_change_persists_until_valid_transition: true
    position_change_persists_until_valid_movement: true
    examples:
      muddy_asset:
        transition: clean_to_muddy
        persists_until: [wash, clean]
      open_door:
        transition: closed_to_open
        persists_until: [close]
    rules:
      no_unexplained_state_reset: true
      no_unexplained_asset_teleportation: true
      storage_change_updates_previous_location: true
      ownership_change_requires_give_receive_or_assignment: true
      unique_asset_count_remains_one: true

  ai_continuity_rules:
    lock_for_each_asset:
      - asset_id
      - reference
      - state_dimensions
      - current_location
      - current_zone
      - storage_relationship
      - spatial_relationships
      - ownership
      - instance_count
    errors:
      - unregistered_location
      - unregistered_zone
      - unregistered_asset
      - unsupported_asset_state
      - unsupported_interaction
      - duplicated_unique_asset
      - missing_fixed_landmark
      - moved_fixed_asset
      - unexplained_asset_reset
      - unexplained_asset_teleportation
