      - canonical_reference_is_missing
      - asset_state_or_interaction_is_not_allowed
      - interaction_is_not_child_safe
      - mobility_or_ownership_is_violated
      - unique_asset_is_duplicated
      - state_position_or_storage_changes_without_valid_transition
