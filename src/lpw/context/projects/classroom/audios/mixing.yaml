metadata:
  id: classroom-english-learning-mix
  type: audio-mixing-context
  version: 1
  status: approved
  project_id: classroom
  purpose: clear, comfortable English-learning audio for children ages 3 to 6
  approval_required: true

audience:
  minimum_age: 3
  maximum_age: 6
  target_language: English
  learner_level: beginner
  listening_contexts:
    - television
    - tablet
    - phone
    - classroom-speakers
    - child-safe-headphones
  priorities:
    - spoken-word-intelligibility
    - listening-comfort
    - vocabulary-recognition
    - emotional-safety
    - character-consistency

technical:
  sample_rate: 48000
  delivery_channels: stereo
  maximum_true_peak_db: -1
  internal_processing_format: pcm_s24le
  dialogue_source_format: mono-lossless
  preserve_clean_dialogue_stems: true
  render_mono_compatibility_check: true
  prevent_inter_sample_clipping: true

loudness:
  web_target_lufs: -16
  cinematic_preview_lufs: -18
  dialogue_short_term_target_lufs:
    minimum: -18
    maximum: -14
  maximum_adjacent_dialogue_difference_lu: 2
  maximum_sudden_program_change_lu: 4
  normalize_only_after_layer_balance: true
  preserve_sentence_dynamics: true
  avoid_constant_maximum_loudness: true

priority:
  - dialogue
  - important narrative sound effects
  - ambience
  - music
  - decorative sound effects

dialogue:
  center_pan: true
  compression: subtle
  noise_reduction: light
  de_esser: light
  priority: critical
  target_lufs: -16
  maximum_true_peak_db: -1
  source: locked-clean-dialogue
  identity_source: characters/{character_id}/voice-profile.yaml
  preserve_exact_words: true
  preserve_word_endings: true
  preserve_consonant_clarity: true
  preserve_natural_breaths: true
  preserve_approved_pauses: true
  preserve_lip_sync_timing: true
  allow_destructive_retiming: false
  center_image_stability: fixed
  minimum_headroom_above_background_db: 8
  preferred_headroom_above_background_db: 12
  compression_settings:
    ratio: 2.0
    threshold_policy: source-dependent
    attack_ms: 20
    release_ms: 160
    maximum_gain_reduction_db: 4
    preserve_transients: true
    preserve_quiet_word_endings: true
  equalization:
    policy: corrective-and-gentle
    high_pass_filter_hz: 70
    maximum_presence_boost_db: 2
    intelligibility_band_hz:
      minimum: 1500
      maximum: 4500
    avoid_thinning_child_voices: true
    avoid_harsh_presence: true
  de_essing:
    policy: light-and-speaker-specific
    preserve_english_sibilants: true
    avoid_lisping_artifacts: true
  cleanup:
    remove_clicks_and_pops: true
    reduce_plosives_when_detected: true
    remove_only_distracting_breaths: true
    preserve_natural_vocal_texture: true
    avoid_aggressive_noise_reduction: true
    avoid_gate_chatter: true

english_learning:
  target_language: en
  preserve_exact_scripted_english: true
  automatic_translation: false
  prioritize_target_vocabulary: true
  pronunciation_source: audios/pronunciation.yaml
  require_clear_initial_and_final_consonants: true
  preserve_vowel_length_and_shape: true
  preserve_contractions_when_scripted: true
  preserve_function_words: true
  preserve_plural_and_tense_endings: true
  vocabulary_emphasis:
    enabled: true
    maximum_gain_db: 2
    maximum_duration_extension_percent: 5
    use_pitch_exaggeration: false
    use_repetition_only_when_scripted: true
  sentence_presentation:
    one_learning_idea_at_a_time: true
    preserve_natural_phrase_groups: true
    avoid_rushed_delivery: true
    avoid_over_articulation: true
    avoid_audiobook_delivery: true
  comprehension_spacing:
    minimum_pause_after_new_word_ms: 300
    minimum_pause_after_question_ms: 500
    audience_response_pause_seconds:
      minimum: 3
      maximum: 5
  repetition:
    repeated_word_must_match_pronunciation: true
    repeated_phrase_must_preserve_speaker_identity: true
    allow_small_natural_prosody_variation: true
    forbid_copy_paste_mechanical_rhythm: true
  feedback_cues:
    correct_answer: soft-positive-and-brief
    try_again: warm-nonjudgmental-and-brief
    incorrect_answer_buzzer_allowed: false
    cue_must_not_mask_spoken_feedback: true

character_dialogue:
  profiles:
    riri:
      voice_profile: characters/riri/voice-profile.yaml
      track: dialogue_riri
      pan: 0
      preserve_soft_warm_identity: true
    yoyo:
      voice_profile: characters/yoyo/voice-profile.yaml
      track: dialogue_yoyo
      pan: 0
      preserve_bright_bubbly_identity: true
  keep_characters_clearly_distinct: true
  match_levels_without_erasing_identity: true
  use_profile_specific_eq_only_when_required: true
  prevent_voice_swapping: true

multi_speaker:
  maximum_simultaneous_speakers: 2
  one_primary_instructional_speaker_at_a_time: true
  overlap_allowed_when_scripted: true
  overlap_forbidden_during_target_vocabulary: true
  overlap_forbidden_during_audience_questions: true
  preserve_each_speaker_on_separate_stem: true
  preserve_independent_word_timing: true
  maintain_centered_dialogue: true
  use_level_and_timing_for_separation: true
  avoid_extreme_stereo_separation: true

music:
  duck_under_dialogue: true
  ducking_db: -6
  attack_ms: 100
  release_ms: 500
  maximum_true_peak_db: -3
  simplify_under_target_vocabulary: true
  remove_percussion_during_response_pauses: true
  avoid_new_melody_during_new_words: true
  avoid_answer_revealing_cues: true
  preserve_low_frequency_space_for_dialogue: true
  maximum_energy: moderate
  fade_changes_must_be_gradual: true
  child_safe_instrumentation_required: true

ambience:
  crossfade_between_scenes_ms: 600
  maintain_room_tone_during_dialogue: true
  duck_under_target_vocabulary: true
  maximum_prominence_during_dialogue: background
  preserve_location_identity: true
  avoid_sudden_environment_changes: true
  avoid_frequency_masking_of_speech: true
  reduce_competing_midrange_when_required: true
  remain_stable_during_response_pauses: true

sound_effects:
  maximum_simultaneous_prominent_effects: 3
  dialogue_has_priority: true
  target_vocabulary_has_priority: true
  use_only_for_visible_or_narratively_required_sources: true
  avoid_masking_word_onsets_and_endings: true
  avoid_prominent_effects_during_response_pauses: true
  place_learning_cues_after_spoken_word_completion: true
  maximum_volume: moderate
  soft_attack_and_release: true
  forbidden_qualities:
    - explosive
    - gun-like
    - horror
    - scream
    - harsh-alarm
    - heavy-bass-impact
    - aggressive-transient

stereo:
  dialogue_width: 0
  music_width: 80
  ambience_width: 100
  preserve_center_for_speech: true
  mono_compatible: true
  avoid_phase_cancellation: true
  avoid_fast_panning: true
  maximum_character_pan_percent: 15
  spatial_motion_must_follow_visible_action: true

participation_pauses:
  minimum_seconds: 3
  maximum_seconds: 5
  preserve_room_tone: true
  preserve_soft_stable_music_tone: true
  remove_percussion: true
  remove_prominent_sound_effects: true
  do_not_reveal_answer: true
  do_not_fill_with_unnecessary_dialogue: true
  avoid_distracting_stereo_motion: true

child_safety:
  audience_age: 3-6
  listening_comfort_required: true
  dialogue_must_never_shout_at_audience: true
  avoid_sudden_loudness: true
  avoid_frightening_whispers: true
  avoid_harsh_sibilance: true
  avoid_heavy_low_frequency_energy: true
  avoid_prolonged_high_energy_mix: true
  distress_must_remain_brief_and_reassuring: true
  maximum_emotional_intensity: moderate
  headphone_playback_must_remain_comfortable: true

automation:
  dialogue_activity_detection: true
  music_ducking_key: dialogue-bus
  ambience_ducking_key: target-vocabulary-events
  sound_effect_placement_uses_word_timestamps: true
  preserve_locked_dialogue_files: true
  preserve_dialogue_audio_hash: true
  mix_change_must_not_change_lip_sync_timing: true
  material_dialogue_change_invalidates_video: true
  render_separate_stems:
    - dialogue
    - music
    - ambience
    - sound-effects

continuity:
  maintain_dialogue_level_across_adjacent_shots: true
  maintain_character_timbre_across_scenes: true
  maintain_character_specific_processing: true
  maintain_music_ducking_behavior: true
  maintain_ambience_bed_across_connected_cuts: true
  preserve_target_word_emphasis: true
  preserve_pronunciation_across_repetitions: true
  preserve_response_pause_duration: true
  maximum_adjacent_dialogue_difference_lu: 2
  processing_change_requires_review: true

validation:
  technical:
    required_sample_rate: 48000
    required_delivery_channels: stereo
    maximum_true_peak_db: -1
    clipping_samples_allowed: 0
    require_mono_compatibility: true
    reject_corrupt_or_missing_stems: true
  dialogue:
    target_lufs: -16
    maximum_target_deviation_lu: 2
    require_exact_transcript_match: true
    require_full_word_audibility: true
    require_target_vocabulary_intelligibility: true
    require_pronunciation_review: true
    require_character_identity_review: true
    reject_masked_word_onsets: true
    reject_masked_word_endings: true
    reject_harsh_sibilance: true
    reject_overcompression: true
  educational:
    require_age_appropriate_pacing: true
    require_response_pause_range_seconds:
      minimum: 3
      maximum: 5
    require_clear_question_and_answer_separation: true
    require_consistent_repeated_word_pronunciation: true
    reject_answer_revealing_audio_cues: true
    reject_negative_buzzer_feedback: true
  safety:
    require_listening_comfort_review: true
    reject_sudden_loudness_changes: true
    reject_frightening_or_aggressive_effects: true
    reject_shouting_at_audience: true

forbidden_changes:
  - changing_approved_dialogue_words
  - changing_locked_dialogue_timing
  - swapping_character_voices
  - masking_target_vocabulary
  - removing_word_endings
  - overcompressing_child_voices
  - excessive_noise_reduction
  - excessive_de_essing
  - artificial_pitch_exaggeration
  - speeding_dialogue_to_fit_an_undersized_shot
  - adding_unscripted_repetition
  - adding_answer_revealing_music_or_effects
  - filling_participation_pauses_with_distracting_audio
  - using_harsh_negative_feedback_sounds
  - sudden_music_or_ambience_level_changes
  - destructive_processing_of_the_only_clean_dialogue_source
