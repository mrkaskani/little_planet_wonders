locations:
  rooftop:
    base_layer:
      asset: audio-assets/ambience/rooftop-night-rain.wav
      loop: true
      gain_db: -24

    layers:
      - id: city-hum
        asset: audio-assets/ambience/distant-city-hum.wav
        gain_db: -30
        loop: true

      - id: wind
        asset: audio-assets/ambience/rooftop-wind.wav
        gain_db: -27
        loop: true

      - id: warning-light
        asset: audio-assets/sound-effects/warning-light-hum.wav
        gain_db: -32
        position: west

    continuity:
      preserve_across_cuts: true
      crossfade_ms: 400
      restart_on_every_shot: false

  laboratory:
    base_layer:
      asset: audio-assets/ambience/laboratory-room-tone.wav
      gain_db: -26
      loop: true