timeline:
  sample_rate: 48000
  channels: 2

dialogue:
  target_lufs: -16
  maximum_true_peak_db: -1
  noise_reduction: "light"
  compression: "subtle"
  preserve_breathing: true
  preserve_natural_pauses: true

music:
  dialogue_ducking_db: -6
  fade_in_ms: 400
  fade_out_ms: 600

ambience:
  continuous_room_tone: true
  crossfade_ms: 300
  avoid_sudden_environment_changes: true

sound_effects:
  realistic_distance: true
  match_room_acoustics: true
  avoid_exaggerated_impacts: true

speaker_profiles:
  roxana:
    dialogue_track: "dialogue_roxana"
    pan: 0
    eq_profile: "roxana_dialogue_eq"

  shakiba:
    dialogue_track: "dialogue_shakiba"
    pan: 0
    eq_profile: "shakiba_dialogue_eq"