id: kindergarten-sound
type: location-sound-context
version: 1.1
name: Sunny Kindergarten Sound Profile

identity:
  location: kindergarten
  area: exterior-garden
  category: location

  sonic_identity:
    primary:
      - gentle-birds
      - soft-leaf-rustle
      - light-garden-breeze

    secondary:
      - distant-child-activity
      - subtle-insects
      - occasional-flower-garden-buzz
      - soft-neighborhood-ambience

  character:
    - cheerful
    - warm
    - peaceful
    - playful
    - welcoming
    - safe
    - natural
    - child-friendly

  intensity: low-medium

base_ambience:

  id: sunny-kindergarten-garden

  layers:

    birds:
      type: gentle-garden-birds
      intensity: low
      variation: natural
      persistence: continuous

    breeze:
      type: soft-garden-breeze
      intensity: light
      variation: subtle
      persistence: continuous

    foliage:
      type: gentle-leaf-rustle
      intensity: low
      persistence: continuous

    insects:
      type: subtle-garden-insects
      intensity: very-low
      variation: natural
      persistence: intermittent

    neighborhood:
      type: distant-quiet-neighborhood
      intensity: very-low
      distance: far
      persistence: continuous

recurring_details:

  birdsong:
    enabled: true
    intensity: low
    frequency: regular
    variation: natural
    spatial_width: wide

  leaf_rustle:
    enabled: true
    intensity: low
    variation: subtle

  garden_insects:
    enabled: true
    intensity: very-low
    frequency: occasional

  bee_buzz:
    enabled: conditional
    intensity: very-low

    condition:
      near_flowers: true

  distant_children:
    enabled: conditional
    intensity: low
    distance: medium-far

    condition:
      kindergarten_active: true

    characteristics:
      - gentle-laughter
      - soft-play
      - indistinct-child-chatter

weather:

  state: sunny
  precipitation: none

  temperature_character:
    - warm
    - pleasant
    - mild

  sonic_effect:
    openness: high
    air_character: clear
    ambience_brightness: warm

  rules:
    - no rain ambience
    - no thunder
    - no storm sounds
    - no harsh wind
    - preserve warm daytime atmosphere

wind:

  default:
    intensity: light
    character: soft-warm-garden-breeze

  behavior:
    variation: gradual
    gusts: rare
    spatial_movement: subtle

  interactions:

    large_trees:
      enabled: true
      sound: gentle-leaf-rustle
      intensity: low

    shrubs:
      enabled: true
      sound: soft-foliage-movement
      intensity: very-low

    flowers:
      enabled: true
      sound: very-subtle-plant-movement
      intensity: minimal

    clothing:
      enabled: conditional
      intensity: subtle

  rules:
    - wind remains gentle
    - no aggressive gusts
    - no frightening wind
    - no sudden wind transitions
    - foliage movement must match visible wind intensity

garden:

  character:
    - colorful
    - lively
    - peaceful
    - maintained

  ambience:

    birds:
      intensity: low

    insects:
      intensity: very-low

    bees:
      intensity: very-low
      behavior: occasional

    foliage:
      intensity: low

  flower_beds:

    interaction:
      nearby_insects:
        enabled: true
        sound:
          - subtle-bee-buzz
          - tiny-insect-movement

    rules:
      - insect sounds remain gentle
      - avoid dense insect swarms
      - avoid aggressive buzzing
      - keep garden ambience soft

trees:

  sound:
    primary:
      - gentle-leaf-rustle
      - soft-branch-movement

  intensity: low

  bird_activity:
    enabled: true
    frequency: occasional

  rules:
    - trees should create soft natural texture
    - avoid heavy branch creaking
    - avoid storm-like movement

birds:

  presence: moderate

  types:
    - small-garden-birds
    - distant-songbirds

  behavior:
    chirps:
      frequency: regular
      intensity: low

    calls:
      frequency: occasional
      intensity: low

    wing_flutters:
      enabled: conditional
      intensity: very-low

  spatial_behavior:
    distribution:
      - trees
      - garden
      - distant-background

  rules:
    - bird calls remain soft
    - avoid loud repetitive calls
    - avoid predatory bird sounds
    - avoid tropical-jungle density
    - preserve calm kindergarten atmosphere

kindergarten_activity:

  enabled: conditional

  default_state: calm-active

  children:

    distant_play:
      enabled: true
      intensity: low
      distance: medium-far

      sounds:
        - gentle-laughter
        - soft-running
        - indistinct-chatter
        - playful-reactions

    close_activity:
      enabled: scene-dependent

      sounds:
        - footsteps
        - quiet-laughter
        - soft-speaking
        - simple-play-actions

  adults:

    presence:
      enabled: scene-dependent

    background_voice:
      intensity: very-low
      clarity: indistinct

  rules:
    - background children must never overpower dialogue
    - avoid constant screaming
    - avoid chaotic crowd noise
    - avoid distressed crying unless explicitly required
    - maintain positive preschool atmosphere
    - offscreen activity remains spatially believable

fixed_sources:

  kindergarten_building:

    id: kindergarten-building
    position: center

    sound:
      type: quiet-building-presence
      intensity: minimal

    optional_sources:
      - distant-indoor-child-activity
      - subtle-door-movement

  entrance_door:

    id: kindergarten-front-door
    position: center

    open:
      sound:
        - soft-handle-click
        - gentle-wood-door-open

      intensity: low

    close:
      sound:
        - gentle-wood-door-close

      intensity: low

    rules:
      - no loud slam
      - preserve soft wooden character
      - use consistent door sound across scenes

  garden_trees:

    id: kindergarten-garden-trees

    sound:
      type: gentle-foliage
      intensity: low

    continuity:
      continuous: true

  mailbox:

    id: kindergarten-mailbox
    position: front-left

    sound:
      primary: none

    interaction:
      open:
        sound: soft-metal-lid-open
        intensity: low

      close:
        sound: soft-metal-lid-close
        intensity: low

      letter_insert:
        sound: soft-paper-slide
        intensity: very-low

  picket_fence:

    id: kindergarten-picket-fence
    position: foreground

    sound:
      primary: none

    interaction:
      touch:
        sound: subtle-painted-wood-contact
        intensity: very-low

      gate:
        enabled: conditional

        open:
          sound: gentle-wood-gate-open

        close:
          sound: gentle-wood-gate-close

location_interaction_sounds:

  footsteps:

    surfaces:

      stone_path:

        characteristics:
          - soft
          - dry
          - light-stone-contact
          - natural

        intensity: low-medium

        variation_by_movement:

          walk:
            intensity: low

          run:
            intensity: medium

          skip:
            intensity: low-medium

      grass:

        characteristics:
          - soft
          - muted
          - gentle-grass-contact

        intensity: low

        variation_by_movement:

          walk:
            intensity: very-low

          run:
            intensity: low-medium

      porch:

        characteristics:
          - soft-wood-contact
          - slightly-hollow

        intensity: low

  flowers:

    interaction:
      touch:
        sound: subtle-plant-rustle

      brushing_past:
        sound: soft-flower-and-leaf-movement

    intensity: very-low

  bushes:

    interaction:
      contact:
        sound: soft-foliage-rustle

    intensity: low

  mailbox:

    interaction:
      open:
        sound: soft-metal-click

      close:
        sound: gentle-metal-close

      insert_mail:
        sound: light-paper-rustle

  fence_gate:

    interaction:
      open:
        sound: gentle-painted-wood-movement

      close:
        sound: soft-wood-contact

    rules:
      - no heavy slam
      - no frightening squeak

spatial_audio:

  enabled: true

  listener_reference: camera

  sources:

    building:
      position: center
      sound:
        - subtle-building-activity

    large_tree:
      position: right
      sound:
        - leaf-rustle
        - occasional-bird

    garden_left:
      position: left
      sound:
        - birds
        - subtle-insects

    garden_right:
      position: right
      sound:
        - subtle-bee-buzz
        - foliage

    entrance:
      position: center
      sound:
        - door
        - footsteps

    neighborhood:
      position: distant
      sound:
        - quiet-neighborhood-ambience

  rules:
    - preserve source direction between shots
    - rotate spatial perspective with camera
    - physical sources remain spatially anchored
    - birds may move naturally between trees
    - distant ambience must remain distant
    - do not move fixed environmental sources independently of geometry

camera_audio_behavior:

  establishing_wide:

    ambience_width: wide

    emphasis:
      birds: normal
      breeze: normal
      foliage: normal
      distant_activity: slightly-increased

    detail_sfx: reduced

  exterior_medium:

    ambience_width: medium-wide

    emphasis:
      nearby_foliage: normal
      birds: normal
      environmental_detail: normal

  character_medium:

    ambience_width: medium

    environmental_detail: slightly-reduced

  close_up:

    ambience_width: reduced

    nearby_details: slightly-increased

    distant_activity: reduced

    birds: slightly-reduced

  entrance_close_up:

    ambience_width: medium

    emphasis:
      door: increased
      footsteps: increased
      ambience: reduced

  rules:
    - change perspective gradually
    - preserve underlying ambience
    - never restart ambience after shot changes
    - close shots remain connected to the same outdoor environment

dialogue:

  priority: highest

  ambience_behavior:

    during_dialogue:

      volume: low-beneath-dialogue

      reduction:
        birds: slight
        breeze: slight
        foliage: slight
        insects: moderate
        distant_children: moderate
        neighborhood: moderate

    between_dialogue:

      volume: normal-low

  rules:
    - preserve kindergarten environmental identity beneath dialogue
    - never completely mute natural ambience
    - keep speech highly intelligible
    - reduce repetitive bird calls near important dialogue
    - background children must remain indistinct
    - restore ambience smoothly after dialogue

music_relationship:

  music_profile: kindergarten-music

  priority:
    - dialogue
    - important-story-sfx
    - character-action
    - location-ambience
    - music

  rules:
    - natural garden ambience remains perceptible
    - music must not mask dialogue
    - music must not mask important interaction sounds
    - birds and music should not compete in similar high-frequency ranges
    - preserve warm playful environmental tone
    - ambience continues beneath musical transitions

states:

  default:

    id: kindergarten-default

    layers:
      birds: low
      breeze: light
      foliage: low
      insects: very-low
      neighborhood: very-low

  active_day:

    id: kindergarten-active-day

    layers:
      birds: low
      breeze: light
      foliage: low
      insects: very-low
      distant_children: low

    detail:
      playful_activity: moderate

  dialogue:

    id: kindergarten-dialogue

    layers:
      birds: very-low
      breeze: very-low
      foliage: very-low
      insects: minimal
      distant_children: very-low

    rules:
      - dialogue remains dominant
      - natural ambience remains perceptible

  exploration:

    id: kindergarten-exploration

    layers:
      birds: low
      breeze: light
      foliage: low
      insects: very-low

    detail:
      environmental_interactions: increased
      garden_detail: increased

  quiet:

    id: kindergarten-quiet

    layers:
      birds: low
      breeze: subtle
      foliage: subtle
      insects: very-low
      distant_children: none

    purpose:
      - calm-moment
      - observation
      - gentle-reflection
      - environmental-emphasis

  playful:

    id: kindergarten-playful

    layers:
      birds: low
      breeze: light
      foliage: low
      distant_children: low

    activity:
      footsteps: increased
      laughter: low
      play_sfx: scene-dependent

  arrival:

    id: kindergarten-arrival

    layers:
      garden_ambience: normal
      distant_activity: low

    temporary_sources:
      - footsteps
      - gate
      - entrance-door

  departure:

    id: kindergarten-departure

    layers:
      garden_ambience: normal

    temporary_sources:
      - entrance-door
      - footsteps
      - gate

transitions:

  entering_kindergarten:

    behavior:
      - establish-birds-and-garden-before-arrival
      - gradually-introduce-kindergarten-activity
      - preserve-wide-outdoor-space
      - introduce-nearby-foliage-as-character-approaches

  entering_building:

    behavior:
      - gradually-reduce-outdoor-width
      - reduce-birds
      - reduce-wind
      - preserve-outdoor-ambience-through-open-door
      - transition-to-interior-profile-after-door-closes

  exiting_building:

    behavior:
      - introduce-birds-through-door-opening
      - gradually-expand-spatial-width
      - introduce-breeze-and-foliage
      - restore-full-garden-ambience

  leaving_kindergarten:

    behavior:
      - gradually-reduce-kindergarten-activity
      - preserve-birds-and-neighborhood-ambience
      - maintain-natural-outdoor-continuity

  shot_cut:

    behavior:
      ambience: continuous
      environment_state: preserved

    rules:
      - preserve ambience across visual cuts
      - do not restart birds
      - do not restart wind
      - maintain environmental timing

continuity:

  preserve_across_visual_cuts: true

  do_not_restart_on_each_shot: true

  continuous_layers:
    - garden-birds
    - breeze
    - foliage
    - quiet-neighborhood

  preserve_state:
    - weather-state
    - wind-intensity
    - bird-activity-level
    - kindergarten-activity-level
    - active-fixed-sources
    - environmental-perspective

  rules:
    - continuous ambience belongs to scene timeline
    - visual cuts must not reset environmental audio
    - fixed sound sources remain spatially anchored
    - bird patterns should evolve naturally
    - environmental changes require explicit scene events
    - preserve sunny daytime sonic character

event_memory:

  track:
    - entrance-door-state
    - gate-state
    - mailbox-state
    - kindergarten-activity-state
    - bird-activity-state
    - wind-state
    - temporary-sound-events

  examples:

    entrance_door:
      states:
        - closed
        - opening
        - open
        - closing

    fence_gate:
      states:
        - closed
        - opening
        - open
        - closing

    mailbox:
      states:
        - closed
        - opening
        - open
        - closing

priority_system:

  level_1:
    category: dialogue

  level_2:
    category: narrative-action

    examples:
      - footsteps
      - door
      - gate
      - mailbox
      - object-interaction

  level_3:
    category: character-action

    examples:
      - running
      - jumping
      - playful-movement

  level_4:
    category: environmental-identity

    examples:
      - birds
      - breeze
      - foliage

  level_5:
    category: background-activity

    examples:
      - distant-children
      - insects
      - neighborhood

  level_6:
    category: music

volume:

  overall: low-beneath-dialogue

  relative_levels:

    dialogue:
      level: foreground

    narrative_sfx:
      level: foreground-support

    character_movement:
      level: foreground-support

    birds:
      level: background

    breeze:
      level: background

    foliage:
      level: background

    distant_children:
      level: distant-background

    insects:
      level: very-distant-background

    neighborhood:
      level: very-distant-background

forbidden:

  weather:
    - thunder
    - explosive-thunder
    - violent-wind
    - storm-rumble
    - hurricane-gusts
    - heavy-rain

  nature:
    - aggressive-animal-calls
    - threatening-dogs
    - predatory-bird-calls
    - loud-insect-swarms
    - frightening-night-insects

  kindergarten:
    - chaotic-screaming
    - prolonged-distressed-crying
    - aggressive-shouting
    - bullying-sounds
    - panic
    - frightening-crowd-reactions

  mechanical:
    - harsh-alarms
    - emergency-sirens
    - aggressive-machinery
    - construction-noise

  emotional:
    - horror-drones
    - ominous-rumbles
    - jump-scare-effects
    - threatening-low-frequency-effects
    - suspense-stingers

  neighborhood:
    - gunshots
    - explosions
    - aggressive-horns
    - chaotic-traffic
    - loud-motorcycles

negative_constraints:

  - no harsh alarms
  - no frightening environmental sounds
  - no storm ambience
  - no heavy traffic
  - no aggressive animal sounds
  - no chaotic child screaming
  - no horror ambience
  - no ominous drones
  - no sudden ambience resets
  - no exaggerated cartoon sound effects
  - no unnecessary cinematic impacts
  - no environmental sound contradicting sunny visual conditions
  - no excessive background activity competing with dialogue

generation:

  essential_prompt_tokens:
    - sunny kindergarten garden ambience
    - cheerful daytime atmosphere
    - gentle garden birds
    - soft warm breeze
    - subtle leaves rustling
    - peaceful flower garden
    - quiet child-friendly environment
    - warm welcoming ambience
    - soft natural outdoor soundscape
    - dialogue-friendly
    - continuous ambience

  negative_prompt_tokens:
    - rain
    - thunder
    - storm
    - frightening wind
    - harsh alarms
    - screaming
    - chaotic crowd
    - aggressive traffic
    - horror ambience
    - ominous drone
    - explosions
    - dramatic impacts

  preserve_between_generations:
    - sunny-day-character
    - bird-character
    - breeze-character
    - garden-character
    - kindergarten-activity-level
    - environmental-volume
    - spatial-source-layout

  variation_allowed:
    - individual-bird-chirps
    - subtle-breeze-fluctuation
    - occasional-bee-movement
    - subtle-leaf-patterns
    - distant-child-activity-details
    - small-garden-textures

stems:

  preferred: true

  tracks:
    - birds
    - breeze
    - foliage
    - insects
    - distant-kindergarten-activity
    - neighborhood
    - fixed-location-sfx
    - interaction-sfx
    - full-ambience-mix

  purpose:
    - dialogue-mixing
    - adaptive-level-control
    - spatial-repositioning
    - shot-continuity
    - scene-extension
    - activity-state-control

validation:

  environment_checks:
    - ambience matches sunny daytime conditions
    - breeze matches visible foliage movement
    - birds remain natural and gentle
    - garden remains peaceful
    - no rain or storm sounds are present

  continuity_checks:
    - ambience does not restart after cuts
    - bird activity evolves naturally
    - fixed sound sources preserve location
    - environmental volume remains consistent
    - kindergarten activity remains consistent with scene state

  dialogue_checks:
    - speech remains intelligible
    - ambience remains below dialogue
    - distant children do not compete with speech
    - repetitive bird calls are reduced during important dialogue

  emotional_checks:
    - environment remains cheerful
    - environment remains safe
    - environment remains warm and welcoming
    - no sound introduces unintended fear
    - no sound introduces unintended suspense

  preschool_checks:
    - soundscape remains appropriate for ages 3-6
    - sudden loud sounds are avoided
    - background activity remains understandable but unobtrusive
    - environmental sounds encourage a calm playful atmosphere

context_dependencies:

  location:
    source: kindergarten.yaml

  music:
    source: kindergarten-music.yaml

  characters:
    source: ../../02-characters/

  scenes:
    source: ../../03-scenes/

  editing:
    source: ../../editing/

authority:

  location_ambience: this-file
  environmental_sfx: this-file
  fixed_source_audio: this-file
  spatial_audio_layout: this-file
  ambience_continuity: this-file

  physical_geometry: location-context
  weather_visual_state: location-context
  music_identity: location-music-context
  character_voice: character-context
  dialogue_content: scene-context
  narrative_sound_events: scene-context
  final_mix: editing-context