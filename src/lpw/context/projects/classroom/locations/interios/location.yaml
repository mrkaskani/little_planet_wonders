id: kindergarten-interior-sound
type: location-sound-context
version: 1.1
name: Kindergarten Interior Sound Profile

identity:
  location: kindergarten
  area: interior-classroom
  category: location

  sonic_identity:
    primary:
      - warm-classroom-room-tone
      - gentle-child-activity
      - soft-wooden-interior-acoustics
      - filtered-garden-ambience

    secondary:
      - quiet-ceiling-fan
      - paper-and-drawing-sounds
      - wooden-chair-movement
      - book-page-turns
      - gentle-toy-interactions
      - soft-footsteps

  character:
    - warm
    - cheerful
    - cozy
    - playful
    - educational
    - peaceful
    - welcoming
    - safe
    - child-friendly

  intensity: low-medium

base_ambience:
  id: kindergarten-classroom-day

  layers:
    room_tone:
      type: warm-classroom-room-tone
      intensity: low
      persistence: continuous
      importance: high

    ceiling_fan:
      type: soft-ceiling-fan
      intensity: very-low
      position: overhead-center
      persistence: continuous

    exterior_garden:
      type: filtered-sunny-garden
      intensity: very-low
      position: windows-left
      persistence: continuous

    classroom_activity:
      type: gentle-preschool-activity
      intensity: low
      persistence: conditional

    material_detail:
      type: subtle-classroom-materials
      intensity: very-low
      persistence: intermittent

recurring_details:
  room_tone:
    enabled: true
    intensity: low
    spatial_width: medium

  ceiling_fan:
    enabled: true
    intensity: very-low
    variation: minimal
    position: overhead-center

  exterior_birds:
    enabled: true
    intensity: very-low
    position: windows-left
    filtering: strong

  exterior_foliage:
    enabled: true
    intensity: minimal
    position: windows-left

  paper_activity:
    enabled: conditional
    intensity: very-low

  chair_movement:
    enabled: conditional
    intensity: low

  toy_activity:
    enabled: conditional
    intensity: low

  background_children:
    enabled: conditional
    intensity: low

    characteristics:
      - soft-chatter
      - gentle-laughter
      - quiet-learning
      - calm-play
      - occasional-positive-reaction

room_acoustics:
  room_size: medium

  character:
    - warm
    - lightly-reflective
    - soft
    - intimate
    - clear

  reverberation:
    amount: low
    decay: short
    speech_clarity: high

  absorption:
    rug: medium-high
    wooden-furniture: medium
    books: medium
    toys: medium
    plants: low
    wall-decor: low

  reflective_surfaces:
    windows: moderate
    wooden-floor: moderate
    walls: low-moderate

  rules:
    - preserve warm classroom acoustics
    - dialogue remains clear
    - no large-room echo
    - no sterile silence
    - room should feel gently occupied

windows:
  position: left
  default_state: closed

  exterior_transmission:
    birds:
      intensity: very-low

    foliage:
      intensity: minimal

    breeze:
      intensity: minimal

    distant_children:
      enabled: conditional
      intensity: very-low

  open_state:
    exterior_change:
      birds: slightly-increased
      foliage: slightly-increased
      breeze: slightly-increased
      spatial_openness: increased

  closed_state:
    exterior_filtering: strong

  interaction:
    open:
      sound:
        - soft-window-latch
        - gentle-window-movement
      intensity: low

    close:
      sound:
        - gentle-window-movement
        - soft-latch-click
      intensity: low

  rules:
    - exterior ambience remains filtered when closed
    - exterior sound remains anchored to windows
    - opening transition occurs gradually
    - no sudden ambience jump

ceiling_fan:
  id: kindergarten-classroom-fan
  position: overhead-center

  default_state: active

  sound:
    type: smooth-low-fan-hum
    intensity: very-low

  movement:
    speed: slow-medium

  characteristics:
    - smooth
    - stable
    - quiet
    - unobtrusive

  rules:
    - no rattling
    - no grinding
    - no unstable motor noise
    - sound matches visible rotation
    - remain below dialogue

classroom_activity:
  default_state: calm-active

  quiet_learning:
    sounds:
      - pencil-on-paper
      - crayon-on-paper
      - page-turn
      - paper-rustle
      - soft-chair-adjustment
      - quiet-child-chatter
    intensity: low

  drawing:
    sounds:
      - crayon-on-paper
      - pencil-on-paper
      - marker-on-paper
      - paper-movement
      - small-container-contact
    intensity: low

  table_activity:
    sounds:
      - wooden-object-placement
      - paper-handling
      - book-handling
      - soft-chair-movement
    intensity: low

  free_play:
    sounds:
      - wooden-block-clicks
      - small-toy-placement
      - quiet-laughter
      - soft-footsteps
      - gentle-child-chatter
    intensity: low-medium

  group_learning:
    sounds:
      - gentle-group-response
      - soft-clapping
      - quiet-laughter
      - small-body-movement
    intensity: medium-low

  story_time:
    sounds:
      - page-turns
      - subtle-body-movement
      - quiet-child-reactions
    intensity: low

  rules:
    - preserve positive preschool atmosphere
    - avoid constant overlapping voices
    - avoid chaotic activity
    - background speech remains indistinct
    - activity level follows visible occupancy

children:
  age_range:
    - 3
    - 4
    - 5
    - 6

  movement_character:
    - light
    - small
    - energetic
    - gentle

  voice_character:
    - soft
    - cheerful
    - expressive
    - child-sized

  background_behavior:
    intensity: low
    intelligibility: indistinct

  allowed:
    - gentle-laughter
    - curious-reactions
    - soft-group-response
    - quiet-play-chatter
    - excited-but-controlled-reactions

  rules:
    - no constant screaming
    - no overwhelming crowd wall
    - individual children may become foreground only when scene-relevant

floor:
  primary_material: wooden-floor

  wooden_floor:
    children:
      walk:
        sound: light-child-wood-footstep
        intensity: low

      run:
        sound: quick-light-wood-footsteps
        intensity: medium-low

      skip:
        sound: light-irregular-footsteps
        intensity: low-medium

      jump:
        sound: small-soft-wood-landing
        intensity: low-medium

    adults:
      walk:
        sound: controlled-adult-wood-footstep
        intensity: low-medium

  rug:
    sound_character:
      - soft
      - muted
      - damped

    children:
      walk:
        intensity: minimal

      run:
        intensity: low

      jump:
        intensity: low

  rules:
    - footsteps match visible surface
    - children sound lighter than adults
    - avoid cinematic footstep weight
    - rug significantly reduces impact sounds

furniture:
  primary_material: wood

  tables:
    interaction:
      touch:
        sound: subtle-wood-contact

      object_place:
        sound: gentle-object-on-wood

      object_slide:
        sound: soft-object-slide

    intensity: low

  chairs:
    interaction:
      pull:
        sound: gentle-child-chair-slide

      push:
        sound: gentle-child-chair-slide

      sit:
        sound: subtle-seat-contact

      adjust:
        sound: soft-chair-shift

    intensity: low

    rules:
      - no harsh scraping
      - preserve lightweight child-sized furniture

  shelves:
    interaction:
      book_remove:
        sound: soft-book-slide

      book_replace:
        sound: gentle-book-contact

      toy_remove:
        sound: small-object-movement

      toy_replace:
        sound: gentle-object-placement

    intensity: low

books_and_paper:
  books:
    open:
      sound: soft-book-open

    close:
      sound: gentle-book-close

    page_turn:
      sound: delicate-page-turn

    place:
      sound: soft-book-on-wood

  paper:
    handle:
      sound: gentle-paper-rustle

    draw:
      sound:
        - pencil-on-paper
        - crayon-on-paper

    fold:
      sound: soft-paper-fold

  intensity: low

  rules:
    - paper sounds remain delicate
    - close shots may emphasize page and drawing detail
    - reduce detail during important dialogue

art_materials:
  crayons:
    sound: soft-waxy-crayon-on-paper

  pencils:
    sound: light-pencil-on-paper

  markers:
    sound: subtle-marker-on-paper

  cups:
    move:
      sound: gentle-container-contact

  craft_materials:
    sounds:
      - soft-paper-contact
      - small-object-placement
      - subtle-plastic-click

  intensity: low

toys:
  general:
    materials:
      - wood
      - soft-plastic
      - fabric
      - paper

    intensity: low

  wooden_blocks:
    pick_up:
      sound: soft-wood-contact

    place:
      sound: gentle-wood-tap

    stack:
      sound: light-wood-click

    fall:
      sound: small-light-block-tumble

  educational_toys:
    sounds:
      - gentle-piece-placement
      - subtle-object-click
      - soft-object-slide

  storage_bins:
    search:
      sound: soft-toy-rummage

    move:
      sound: gentle-container-shift

    close:
      sound: soft-container-close

  rules:
    - toy sounds remain child-sized
    - avoid exaggerated cartoon impacts
    - toy Foley occurs only with physical interaction

plants:
  sound:
    primary: none

  interaction:
    touch:
      sound: very-soft-leaf-contact

    move:
      sound: subtle-plant-rustle

  intensity: minimal

classroom_door:
  id: kindergarten-classroom-door
  default_state: closed

  open:
    sound:
      - soft-handle-click
      - gentle-wood-door-movement
    intensity: low

  close:
    sound:
      - gentle-wood-door-close
      - soft-latch-click
    intensity: low

  open_state:
    adjacent_space:
      enabled: conditional
      intensity: very-low

  rules:
    - no door slam
    - no harsh latch
    - neighboring ambience appears gradually
    - preserve consistent door material

fixed_sources:
  ceiling_fan:
    id: classroom-fan
    position: overhead-center

    sound:
      type: smooth-low-fan-hum
      intensity: very-low

    continuity:
      continuous: true

  windows:
    id: classroom-windows
    position: left

    sound:
      type: filtered-garden-ambience
      intensity: very-low

    continuity:
      continuous: true

  work_tables:
    id: classroom-work-tables
    position:
      - left-center
      - center

    sound:
      primary: none

    interactions:
      - drawing
      - books
      - paper
      - chairs
      - educational-toys

  play_area:
    id: classroom-play-area
    position: right-foreground

    sound:
      primary: none

    interactions:
      - wooden-blocks
      - rug-footsteps
      - toys

  storage:
    id: classroom-storage
    position:
      - back
      - left
      - right

    sound:
      primary: none

    interactions:
      - books
      - storage-bins
      - toys

interaction_sounds:
  footsteps:
    wood:
      walk:
        sound: light-child-footstep
      run:
        sound: quick-light-child-footsteps

    rug:
      walk:
        sound: soft-muted-step
      run:
        sound: quick-muted-step

  chair:
    pull:
      sound: gentle-chair-slide

    push:
      sound: gentle-chair-slide

    sit:
      sound: subtle-seat-contact

  table:
    object_place:
      sound: soft-object-on-wood

    object_slide:
      sound: subtle-object-slide

  drawing:
    crayon:
      sound: soft-crayon-on-paper

    pencil:
      sound: light-pencil-on-paper

    marker:
      sound: subtle-marker-on-paper

  book:
    open:
      sound: soft-book-open

    page_turn:
      sound: delicate-page-turn

    close:
      sound: gentle-book-close

  toy:
    pick_up:
      sound: small-object-contact

    place:
      sound: gentle-object-placement

    fall:
      sound: lightweight-toy-impact

  rules:
    - activate only when physically motivated
    - preserve material consistency
    - scale sound to child-sized objects
    - foreground detail follows camera distance
    - avoid unnecessary Foley

spatial_audio:
  enabled: true
  listener_reference: camera

  sources:
    windows:
      position: left
      sound:
        - filtered-birds
        - filtered-foliage
        - subtle-breeze

    ceiling_fan:
      position: overhead-center
      sound:
        - fan-hum

    work_tables:
      position:
        - center
        - left-center
      sound:
        - pencils
        - crayons
        - paper
        - chair-movement

    play_area:
      position: right-foreground
      sound:
        - toy-interactions
        - muted-footsteps

    shelves:
      position:
        - back
        - left
        - right
      sound:
        - book-interaction
        - toy-storage-interaction

  rules:
    - preserve physical source positions
    - camera movement rotates listener perspective
    - exterior ambience remains anchored to windows
    - ceiling fan remains overhead
    - moving characters carry their sound sources
    - fixed environmental sources do not shift between cuts

camera_audio_behavior:
  establishing_wide:
    ambience_width: wide

    emphasis:
      room_tone: normal
      classroom_activity: normal
      exterior_garden: subtle
      ceiling_fan: very-subtle

    individual_f Foley: reduced

  medium:
    ambience_width: medium

    nearby_activity: normal
    environmental_detail: normal

  activity_medium:
    ambience_width: medium

    emphasis:
      toys: slightly-increased
      paper: slightly-increased
      footsteps: slightly-increased

  close_up:
    ambience_width: reduced

    emphasis:
      nearby_hand_actions: increased
      drawing_detail: increased
      toy_detail: increased

    background_activity: reduced

  emotional_close_up:
    ambience_width: reduced

    room_tone: preserved
    child_activity: reduced
    exterior_garden: minimal

  window_shot:
    ambience_width: medium-wide

    exterior_presence: slightly-increased

    emphasis:
      birds: increased
      foliage: slightly-increased

  rules:
    - preserve continuous room tone
    - perspective changes gradually
    - shot cuts never restart ambience
    - nearby Foley increases naturally with proximity

dialogue:
  priority: highest

  ambience_behavior:
    during_dialogue:
      volume: low-beneath-dialogue

      reduction:
        background_children: moderate
        toys: moderate
        chairs: moderate
        paper: slight
        exterior_birds: slight
        fan: slight

    between_dialogue:
      volume: normal-low

  background_voice:
    intensity: very-low-low
    intelligibility: indistinct

  rules:
    - foreground speech remains fully intelligible
    - background speech must not compete
    - classroom identity remains audible
    - room tone is never completely removed
    - repetitive sounds reduce around important dialogue

music_relationship:
  music_profile: kindergarten-music

  priority:
    - dialogue
    - important-story-sfx
    - character-action
    - classroom-interaction
    - location-ambience
    - music

  rules:
    - music supports rather than replaces classroom ambience
    - dialogue remains dominant
    - important learning actions remain audible
    - avoid competition with child voices
    - preserve warm playful identity

states:
  empty:
    id: kindergarten-interior-empty

    layers:
      room_tone: low
      ceiling_fan: very-low
      exterior_garden: very-low

  default:
    id: kindergarten-interior-default

    layers:
      room_tone: low
      ceiling_fan: very-low
      exterior_garden: very-low
      child_activity: low
      classroom_materials: very-low

  quiet_learning:
    id: kindergarten-interior-quiet-learning

    layers:
      room_tone: low
      child_activity: very-low

    details:
      pencils: low
      crayons: low
      paper: low
      page_turns: very-low
      chair_movements: very-low

  art_activity:
    id: kindergarten-interior-art

    layers:
      room_tone: low
      child_activity: low

    details:
      pencils: low
      crayons: low
      markers: low
      paper: low
      containers: very-low

  free_play:
    id: kindergarten-interior-free-play

    layers:
      room_tone: low
      child_activity: low-medium

    details:
      toys: low
      footsteps: low
      laughter: low
      furniture: very-low

  story_time:
    id: kindergarten-interior-story-time

    layers:
      room_tone: low
      child_activity: minimal

    details:
      page_turns: low
      child_reactions: very-low

  dialogue:
    id: kindergarten-interior-dialogue

    layers:
      room_tone: low
      ceiling_fan: minimal
      exterior_garden: minimal
      child_activity: very-low

  quiet:
    id: kindergarten-interior-quiet

    layers:
      room_tone: low
      ceiling_fan: very-low
      exterior_birds: very-low

    purpose:
      - calm-observation
      - reflection
      - emotional-focus

  arrival:
    id: kindergarten-interior-arrival

    temporary_sources:
      - door
      - footsteps
      - chair-movement

  departure:
    id: kindergarten-interior-departure

    temporary_sources:
      - footsteps
      - door

transitions:
  entering_classroom:
    behavior:
      - reduce-exterior-spatial-width
      - filter-birds-and-foliage
      - introduce-warm-room-tone
      - introduce-ceiling-fan
      - introduce-classroom-activity-if-occupied
      - preserve-exterior-through-open-door
      - close-exterior-perspective-after-door-closes

  leaving_classroom:
    behavior:
      - introduce-exterior-before-full-exit
      - increase-birds
      - increase-foliage
      - expand-spatial-width
      - gradually-reduce-room-tone

  approaching_windows:
    behavior:
      - slightly-increase-birds
      - slightly-increase-foliage
      - increase-exterior-detail

  moving_away_from_windows:
    behavior:
      - gradually-filter-exterior
      - restore-interior-dominance

  shot_cut:
    behavior:
      ambience: continuous
      environment_state: preserved

    rules:
      - preserve room tone
      - preserve fan state
      - preserve classroom activity
      - preserve exterior timing
      - do not restart ambience

continuity:
  preserve_across_visual_cuts: true
  do_not_restart_on_each_shot: true

  continuous_layers:
    - room-tone
    - ceiling-fan
    - filtered-exterior

  conditional_continuous_layers:
    - child-activity
    - learning-activity

  preserve_state:
    - classroom-occupancy
    - activity-mode
    - ceiling-fan-state
    - window-state
    - door-state
    - exterior-weather-state
    - character-positions
    - toy-positions
    - chair-positions
    - active-object-interactions

  rules:
    - ambience belongs to scene timeline
    - cuts do not reset classroom activity
    - fan remains continuous while active
    - exterior remains consistent with sunny kindergarten exterior
    - object states remain consistent
    - activity changes require narrative motivation

event_memory:
  track:
    - classroom-occupancy
    - current-activity
    - ceiling-fan-state
    - door-state
    - window-state
    - chair-positions
    - active-toys
    - active-books
    - drawing-materials
    - temporary-sound-events

  examples:
    classroom_activity:
      states:
        - empty
        - quiet-learning
        - art
        - free-play
        - story-time
        - dialogue

    ceiling_fan:
      states:
        - off
        - starting
        - active
        - stopping

    door:
      states:
        - closed
        - opening
        - open
        - closing

priority_system:
  level_1:
    category: dialogue

  level_2:
    category: narrative-action

    examples:
      - important-object-interaction
      - door
      - story-action

  level_3:
    category: character-action

    examples:
      - footsteps
      - chair-movement
      - drawing
      - toy-use
      - book-use

  level_4:
    category: classroom-identity

    examples:
      - child-activity
      - learning-activity
      - room-tone

  level_5:
    category: environmental-background

    examples:
      - ceiling-fan
      - filtered-birds
      - filtered-foliage

  level_6:
    category: music

volume:
  overall: low-beneath-dialogue

  relative_levels:
    dialogue:
      level: foreground

    narrative_sfx:
      level: foreground-support

    character_interactions:
      level: foreground-support

    nearby_classroom_activity:
      level: background-support

    background_children:
      level: background

    room_tone:
      level: background

    ceiling_fan:
      level: very-subtle-background

    exterior_birds:
      level: distant-background

    exterior_foliage:
      level: very-distant-background

forbidden:
  children:
    - prolonged-screaming
    - chaotic-yelling
    - aggressive-shouting
    - panic
    - bullying
    - frightening-crying

  classroom:
    - harsh-chair-scraping
    - heavy-object-impacts
    - breaking-glass
    - violent-door-slams
    - aggressive-toy-impacts
    - excessive-room-echo

  mechanical:
    - fan-rattling
    - electrical-buzzing
    - harsh-fluorescent-hum
    - loud-air-conditioning
    - construction-noise
    - harsh-alarms

  exterior:
    - heavy-traffic
    - aggressive-horns
    - sirens
    - thunder
    - storms
    - violent-wind

  emotional:
    - horror-drones
    - ominous-rumbles
    - jump-scare-effects
    - suspense-stingers
    - threatening-low-frequency-effects

negative_constraints:
  - no harsh alarms
  - no frightening sounds
  - no chaotic child screaming
  - no aggressive shouting
  - no excessive room echo
  - no harsh chair scraping
  - no heavy cinematic footsteps
  - no exaggerated toy impacts
  - no excessive Foley
  - no mechanical fan rattling
  - no storm ambience
  - no heavy traffic
  - no horror ambience
  - no ominous drones
  - no unnecessary cinematic impacts
  - no sudden ambience resets
  - no background sound competing with dialogue
  - no environmental sound contradicting sunny daytime conditions

generation:
  essential_prompt_tokens:
    - sunny kindergarten classroom
    - warm preschool interior ambience
    - gentle classroom room tone
    - soft child learning activity
    - quiet child play
    - subtle pencils and crayons on paper
    - soft book page turns
    - gentle wooden furniture movement
    - quiet wooden toy interactions
    - smooth quiet ceiling fan
    - filtered garden birds through windows
    - warm natural interior acoustics
    - calm cheerful educational atmosphere
    - preschool ages 3 to 6
    - dialogue-friendly
    - continuous ambience

  negative_prompt_tokens:
    - screaming children
    - chaotic classroom
    - harsh chair scraping
    - heavy footsteps
    - loud toy impacts
    - alarm
    - electrical buzz
    - fan rattling
    - thunder
    - storm
    - traffic
    - horror ambience
    - ominous drone
    - exaggerated cartoon effects
    - cinematic impacts

  preserve_between_generations:
    - room-tone-character
    - room-acoustic-character
    - ceiling-fan-character
    - filtered-exterior-character
    - child-activity-level
    - classroom-material-character
    - wooden-furniture-character
    - overall-volume
    - spatial-source-layout

  variation_allowed:
    - individual-pencil-strokes
    - crayon-movements
    - individual-page-turns
    - subtle-child-movement
    - small-chair-adjustments
    - gentle-toy-interactions
    - individual-bird-chirps
    - small-classroom-textures

stems:
  preferred: true

  tracks:
    - room-tone
    - ceiling-fan
    - filtered-exterior
    - background-children
    - footsteps
    - furniture
    - books-and-paper
    - drawing-materials
    - toys
    - doors-and-windows
    - interaction-sfx
    - full-ambience-mix

  purpose:
    - dialogue-mixing
    - activity-state-control
    - adaptive-level-control
    - spatial-repositioning
    - shot-continuity
    - scene-extension
    - interior-exterior-transition

validation:
  environment_checks:
    - room sounds warm and child-friendly
    - classroom acoustics remain soft
    - exterior ambience remains filtered through windows
    - fan matches visible state
    - furniture retains consistent wooden material character
    - classroom sounds match visible activity

  continuity_checks:
    - room tone does not restart after cuts
    - ceiling fan remains continuous
    - activity state remains consistent
    - door and window states remain consistent
    - toy and furniture positions remain logically continuous
    - exterior remains consistent with kindergarten exterior

  dialogue_checks:
    - speech remains fully intelligible
    - background child voices remain indistinct
    - toys do not mask dialogue
    - chairs do not mask dialogue
    - fan remains unobtrusive
    - repetitive details reduce around important lines

  interaction_checks:
    - footsteps match wood or rug surface
    - chair sounds require physical movement
    - drawing sounds require visible drawing
    - toy sounds require interaction
    - books produce appropriate paper and cover sounds
    - interaction sounds match character scale

  emotional_checks:
    - classroom remains warm
    - classroom remains cheerful
    - classroom remains safe
    - classroom remains welcoming
    - no unintended fear is introduced
    - no unintended suspense is introduced

  preschool_checks:
    - soundscape remains appropriate for ages 3-6
    - sudden loud sounds are minimized
    - child activity remains lively without becoming chaotic
    - individual sounds remain clear but gentle
    - environment avoids overstimulation
    - sound supports calm playful learning

context_dependencies:
  location:
    source: kindergarten-interior.yaml

  exterior_location:
    source: kindergarten.yaml

  exterior_sound:
    source: kindergarten-sound.yaml

  play_space:
    source: kindergarten-play-space.yaml

  play_space_sound:
    source: kindergarten-play-space-sound.yaml

  music:
    source: kindergarten-music.yaml

  characters:
    source: ../../02-characters/

  scenes:
    source: ../../03-scenes/

  editing:
    source: ../../editing/

authority:
  location_ambience: this-file
  interior_room_tone: this-file
  classroom_activity_audio: this-file
  classroom_material_audio: this-file
  classroom_interaction_sfx: this-file
  fixed_source_audio: this-file
  spatial_audio_layout: this-file
  ambience_continuity: this-file
  interior_exterior_audio_transition: this-file

  physical_geometry: location-context
  exterior_environment: exterior-location-context
  weather_visual_state: exterior-location-context
  music_identity: location-music-context
  character_voice: character-context
  dialogue_content: scene-context
  narrative_sound_events: scene-context
  final_mix: editing-context


reference_images:
  primary:
    path: "<primary-reference-image>"
    purpose: primary-visual-identity
    view: "<view-description>"

  geometry:
    - path: "<geometry-reference-image>"
      view: "<view-description>"
      purpose: geometry-reference

  details:
    - path: "<detail-reference-image>"
      subject: "<landmark-or-material>"
      purpose: material-and-detail-reference

  lighting_variants:
    - path: "<lighting-reference-image>"
      state: "<lighting-state>"
      purpose: lighting-variant-reference

  weather_variants:
    - path: "<weather-reference-image>"
      state: "<weather-state>"
      purpose: weather-variant-reference

reference_priority:
  geometry:
    - primary
    - geometry

  materials:
    - details
    - primary

  lighting:
    - lighting_variants

  weather:
    - weather_variants

reference_usage_rules:
  multiple_images:
    - treat references as complementary views of one canonical location
    - use the primary image for overall visual identity
    - use geometry images for layout dimensions orientation and spatial relationships
    - use detail images only for their named landmark material or permanent prop
    - use lighting variants only for the matching declared lighting state
    - use weather variants only for the matching declared weather state
    - resolve conflicts using reference_priority
    - preserve features confirmed across multiple views
    - do not blend incompatible viewpoints into new architecture
    - do not mirror crop or distort a reference to create new geography

  authoritative_for:
    - architecture
    - geometry
    - entrances and exits
    - doors and windows
    - fixed landmarks
    - permanent props
    - materials
    - permanent colors
    - spatial relationships
    - environment scale
    - camera-accessible areas

  unknown_paths:
    - keep placeholder paths until an approved reference is supplied
    - do not infer or invent a real file path
    - require path validation before reference-driven generation

geometry_reference_handling:
  primary_sources:
    - primary
    - geometry
  extract:
    - overall dimensions and proportions
    - floor wall path and terrain layout
    - entrance exit door and window positions
    - fixed landmark positions and scale
    - permanent prop placement
    - spatial relationships
    - world orientation cues
    - environment scale
    - camera-accessible areas
  rules:
    - require cross-view agreement before locking ambiguous geometry
    - preserve occluded geometry from the approved canonical layout
    - do not infer unseen structural elements

material_detail_reference_handling:
  primary_sources:
    - details
    - primary
  extract:
    - permanent materials
    - permanent colors
    - stable surface patterns
    - landmark construction details
    - permanent prop details
  rules:
    - detail references override primary only for their declared subject
    - temporary dirt wetness shadows and reflections do not redefine materials
    - generation artifacts do not become canonical texture

variant_reference_handling:
  lighting:
    source: lighting_variants
    match_by: state
    rules:
      - preserve physical lighting-source positions
      - vary illumination without changing architecture materials or permanent colors
      - do not treat temporary shadows or reflections as permanent features

  weather:
    source: weather_variants
    match_by: state
    rules:
      - preserve geometry landmarks materials and scale across weather states
      - temporary precipitation wetness or atmospheric effects remain state-specific
      - weather references do not create or remove permanent assets

stable_landmark_extraction:
  enabled: true
  include:
    - fixed architectural landmarks
    - permanent furniture or environment props
    - entrances exits doors and windows
    - persistent navigation features
    - fixed physical light sources
  exclude:
    - characters
    - temporary props
    - shadows and reflections
    - text and watermarks
    - generation artifacts
  rules:
    - assign stable landmark IDs in the canonical location registry
    - preserve landmark identity position orientation and scale across views
    - ambiguous objects remain unclassified until approved

orientation_consistency:
  preserve:
    - world orientation
    - left right front back relationships
    - entrance and exit directions
    - landmark-to-landmark relationships
    - established screen direction
  rules:
    - never mirror the environment
    - reverse views must preserve canonical geography
    - conflicting orientation cues require review rather than reinterpretation

camera_geography_consistency:
  derive_from:
    - primary
    - geometry
  preserve:
    - camera-accessible areas
    - restricted camera areas
    - valid sightlines
    - landmark visibility by view
    - established camera side
  rules:
    - camera placement must respect physical geometry
    - lens choice must not alter world dimensions
    - camera transitions must not cross geography without clear reorientation
    - generated reverse angles must preserve entrance exit and landmark positions

non_permanent_reference_content:
  - characters
  - temporary props
  - temporary lighting
  - temporary weather
  - shadows
  - reflections
  - motion blur
  - camera distortion
  - text
  - watermarks
  - generation artifacts

continuity_constraints:
  - preserve overall geometry
  - preserve landmark positions
  - preserve entrance and exit positions
  - preserve door and window positions
  - preserve world orientation
  - preserve permanent material colors
  - preserve fixed props
  - preserve environment scale
  - preserve physical lighting-source positions
  - preserve camera geography

reference_driven_generation_rules:
  - validate every non-placeholder reference path before generation
  - load the primary reference whenever visual identity is required
  - load only relevant detail lighting and weather references for the requested state
  - keep architecture geometry and stable landmarks locked across generated shots
  - maintain consistent orientation across establishing reverse and detail views
  - ignore non-permanent reference content unless selected by current scene state
  - reject reference conflicts that cannot be resolved through reference_priority
  - record extracted landmarks and camera geography for continuity review

forbidden_changes:
  - mirroring the environment
  - moving doors or windows
  - changing room or environment dimensions
  - moving fixed landmarks
  - adding or removing permanent architecture
  - changing permanent materials
  - changing permanent colors
  - reversing physical light direction
  - changing landmark scale
  - adding random structural elements
