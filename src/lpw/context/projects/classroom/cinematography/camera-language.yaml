camera_language:
  global:
    style: cinematic_preschool_animation
    audience_age:
      minimum: 3
      maximum: 6
    priorities:
      - character_readability
      - emotional_clarity
      - story_comprehension
      - visual_continuity
      - child_friendly_energy
    camera_behavior:
      default_stability: stable
      movement_style: smooth_and_motivated
      movement_energy: low_to_medium
      allow_high_energy_for_action: true
      avoid_unmotivated_camera_motion: true
      avoid_excessive_camera_changes: true
      avoid_disorienting_perspective: true
      avoid_extreme_lens_distortion: true
    framing:
      preserve_character_silhouette: true
      preserve_face_readability: true
      preserve_important_actions_in_frame: true
      avoid_accidental_limb_cropping: true
      maintain_clear_screen_direction: true
      maintain_character_eye_lines: true
      favor_clean_background_separation: true
    continuity:
      respect_180_degree_rule: true
      maintain_screen_direction: true
      maintain_relative_character_positions: true
      maintain_consistent_eye_lines: true
      avoid_unmotivated_axis_crossing: true
      require_clear_reestablishing_shot_after_major_location_change: true

  establishing:
    lens: 24mm
    framing: wide
    height: eye_level_or_slightly_elevated
    movement:
      preferred:
        - slow_crane
        - gentle_dolly
        - locked_wide
    duration: medium
    purpose:
      - establish_location
      - establish_character_positions
      - communicate_environment
    rules:
      keep_main_characters_readable: true
      avoid_excessively_distant_characters: true
      avoid_fast_environment_sweeps: true

  character_wide:
    lens: 35mm
    framing: full_body
    height: character_eye_level
    movement:
      preferred:
        - locked
        - gentle_tracking
        - smooth_dolly
    purpose:
      - physical_action
      - character_interaction
      - body_language
      - simple_comedy
    rules:
      preserve_full_action: true
      maintain_clear_silhouette: true
      allow_environment_context: true

  character_medium:
    lens: 50mm
    framing: medium
    height: eye_level
    movement:
      preferred:
        - restrained_tracking
        - locked
        - very_slow_push
    purpose:
      - dialogue
      - character_interaction
      - normal_storytelling
    rules:
      prioritize_face_and_gesture_readability: true
      avoid_constant_push_ins: true
      maintain_comfortable_headroom: true

  dialogue:
    lens:
      preferred: 50mm
      alternate: 65mm
    framing:
      preferred:
        - medium
        - medium_closeup
    height: eye_level
    movement:
      preferred:
        - locked
        - extremely_slow_push
    rules:
      dialogue_is_visual_priority: true
      maintain_clear_mouth_visibility: true
      maintain_clear_eye_direction: true
      avoid_camera_motion_that_competes_with_dialogue: true
      avoid_fast_cutting_during_important_lines: true
      hold_shot_through_key_words_when_possible: true
      preserve_lip_sync_visibility: true

  emotional_closeup:
    lens: 85mm
    framing: closeup
    height: eye_level
    movement:
      preferred:
        - locked
        - very_slow_push_in
    emotional_intensity:
      maximum: 0.6
    purpose:
      - emotional_reaction
      - important_realization
      - reassurance
      - connection_with_audience
    rules:
      keep_both_eyes_readable_when_possible: true
      avoid_extreme_face_distortion: true
      avoid_overly_long_intense_closeups: true
      avoid_aggressive_push_ins: true

  reaction:
    lens:
      preferred: 65mm
      alternate: 85mm
    framing:
      preferred:
        - medium_closeup
        - closeup
    movement:
      preferred:
        - locked
        - subtle_push
    duration: short_to_medium
    rules:
      capture_clear_emotional_change: true
      allow_visual_comedy: true
      avoid_exaggerated_camera_shock: true

  curiosity:
    lens: 50mm
    framing:
      preferred:
        - medium
        - medium_closeup
    height: eye_level
    movement:
      preferred:
        - gentle_push_in
        - slow_side_track
    purpose:
      - investigation
      - observation
      - anticipation
    rules:
      reveal_information_gradually: true
      maintain_subject_visibility: true
      avoid_suspense_that_feels_frightening: true

  discovery:
    lens:
      preferred: 35mm
      alternate: 50mm
    framing:
      preferred:
        - medium_wide
        - medium
    movement:
      preferred:
        - gentle_push_in
        - smooth_reveal
        - small_crane
    energy: medium
    rules:
      clearly_show_discovered_object: true
      clearly_show_character_reaction: true
      allow_cut_from_object_to_reaction: true
      avoid_overly_dramatic_reveal: true

  learning:
    lens:
      preferred: 50mm
      alternate: 35mm
    framing:
      preferred:
        - medium
        - medium_wide
    movement:
      preferred:
        - locked
        - subtle_tracking
    rules:
      prioritize_object_and_character_readability: true
      avoid_visual_distraction: true
      avoid_fast_camera_motion: true
      keep_educational_object_in_clear_view: true
      hold_long_enough_for_comprehension: true

  participation:
    lens: 50mm
    framing:
      preferred:
        - medium
        - medium_closeup
    height: eye_level
    movement: locked
    rules:
      character_should_face_audience_when_appropriate: true
      maintain_clear_eye_contact: true
      minimize_background_motion: true
      avoid_distracting_camera_motion: true
      avoid_cutting_during_response_pause: true
      hold_frame_during_response_pause: true
      minimum_hold_seconds: 3
      maximum_hold_seconds: 5
      preferred_hold_seconds: 4

  comedy:
    lens:
      preferred: 35mm
      alternate: 50mm
    movement:
      preferred:
        - locked
        - quick_gentle_pan
        - restrained_follow
    energy: medium_to_high
    rules:
      favor_visual_setup_and_payoff: true
      keep_action_readable: true
      allow_short_reaction_closeups: true
      avoid_excessive_shaky_camera: true
      avoid_extreme_snap_zooms: true
      avoid_disorienting_dutch_angles: true

  action:
    lens:
      preferred: 35mm
      alternate: 24mm
    framing:
      preferred:
        - wide
        - medium_wide
    movement:
      preferred:
        - smooth_tracking
        - follow_camera
        - gentle_crane
        - controlled_pan
    energy: medium_to_high
    rules:
      keep_character_action_visible: true
      prioritize_direction_of_motion: true
      give_character_lead_room: true
      maintain_clear_environment_relationship: true
      avoid_excessive_cut_frequency: true
      avoid_aggressive_camera_shake: true
      avoid_motion_blur_that_hides_character_identity: true

  running:
    lens: 35mm
    framing:
      preferred:
        - full_body
        - medium_wide
    movement:
      preferred:
        - lateral_tracking
        - front_tracking
        - rear_follow
    energy: medium_to_high
    rules:
      preserve_character_proportions: true
      preserve_direction_of_travel: true
      maintain_lead_room: true
      avoid_rapid_camera_rotation: true

  celebration:
    lens:
      preferred: 35mm
      alternate: 50mm
    framing:
      preferred:
        - medium_wide
        - medium
    movement:
      preferred:
        - gentle_crane_up
        - smooth_push_in
        - restrained_orbit
    energy: high
    rules:
      keep_faces_readable: true
      show_group_relationship_when_applicable: true
      allow_broader_camera_motion: true
      avoid_chaotic_rotation: true

  musical:
    lens:
      preferred: 35mm
      alternate: 50mm
    movement:
      preferred:
        - smooth_tracking
        - gentle_crane
        - restrained_orbit
        - controlled_push_pull
    energy: medium_to_high
    rules:
      movement_may_follow_music_rhythm: true
      prioritize_character_performance: true
      avoid_cutting_on_every_beat: true
      allow_wider_visual_energy_than_dialogue_scenes: true
      preserve_clear_choreography: true

  danger:
    lens: 35mm
    framing:
      preferred:
        - medium
        - medium_wide
    height: slightly_low
    movement:
      preferred:
        - subtle_handheld
        - controlled_tracking
    emotional_intensity:
      maximum: 0.6
    rules:
      danger_should_remain_child_safe: true
      camera_shake_intensity: very_low
      avoid_aggressive_push_ins: true
      avoid_extreme_low_angles: true
      avoid_extreme_closeups: true
      avoid_horror_framing: true
      avoid_dutch_angles: true
      avoid_frantic_camera_motion: true
      avoid_pov_threat_camera: true
      require_visual_path_to_safety: true
      transition_to_stable_camera_after_resolution: true

  worry:
    lens:
      preferred: 65mm
      alternate: 50mm
    framing: medium_closeup
    height: eye_level
    movement:
      preferred:
        - locked
        - very_slow_push
    emotional_intensity:
      maximum: 0.45
    rules:
      keep_environment_non_threatening: true
      avoid_isolating_character_with_extreme_framing: true
      return_to_neutral_camera_after_reassurance: true

  reassurance:
    lens:
      preferred: 50mm
      alternate: 65mm
    framing:
      preferred:
        - medium
        - medium_closeup
    height: eye_level
    movement:
      preferred:
        - locked
        - gentle_push_in
    rules:
      camera_should_feel_stable: true
      maintain_warm_character_connection: true
      allow_two_shot_when_character_support_is_important: true

  object_insert:
    lens: 85mm
    framing: insert
    movement:
      preferred:
        - locked
        - subtle_push
    rules:
      show_only_story_relevant_details: true
      keep_object_orientation_clear: true
      avoid_extreme_macro_distortion: true
      limit_duration_to_story_need: true

  point_of_view:
    lens: 35mm
    movement:
      preferred:
        - locked
        - smooth_controlled_motion
    rules:
      use_sparingly: true
      require_clear_story_reason: true
      avoid_fast_head_like_motion: true
      avoid_disorientation: true
      avoid_threatening_pov: true

  two_shot:
    lens: 50mm
    framing: medium_two_shot
    height: shared_eye_level
    movement:
      preferred:
        - locked
        - gentle_tracking
    rules:
      preserve_both_character_faces: true
      preserve_relationship_and_eye_line: true
      use_for_connection_and_conversation: true

  group:
    lens:
      preferred: 35mm
      alternate: 24mm
    framing: medium_wide_to_wide
    movement:
      preferred:
        - locked
        - gentle_crane
        - controlled_tracking
    rules:
      maintain_clear_character_separation: true
      avoid_visual_overlap_of_faces: true
      prioritize_speaking_character_without_losing_group_context: true

  transition:
    movement:
      preferred:
        - gentle_pan
        - object_wipe
        - character_motion_wipe
        - smooth_dissolve
        - motivated_match_cut
    rules:
      transitions_should_support_story_flow: true
      avoid_excessive_flash_transitions: true
      avoid_aggressive_whip_pans: true
      avoid_disorienting_spins: true

  camera_motion_limits:
    handheld:
      default_allowed: false
      allowed_for:
        - mild_danger
        - playful_action
      maximum_intensity: very_low
    orbit:
      default_allowed: true
      maximum_arc_degrees: 45
      preferred_speed: slow
      avoid_during:
        - important_dialogue
        - participation_pause
        - emotional_distress
    push_in:
      preferred_speed: slow
      use_for:
        - emotion
        - discovery
        - curiosity
        - important_story_information
    pull_out:
      preferred_speed: slow
      use_for:
        - reveal_environment
        - end_scene
        - show_group_context
    zoom:
      optical_zoom_preferred: false
      use_sparingly: true
      avoid_fast_zoom: true
    pan:
      preferred_speed: slow_to_moderate
      require_motivated_subject: true
      avoid_rapid_back_and_forth_pan: true
    tilt:
      preferred_speed: slow_to_moderate
      require_story_motivation: true

  editing_language:
    default_cutting_style: calm_and_readable
    action_cutting_style: energetic_but_clear
    rules:
      cut_on_story_motivation: true
      cut_on_character_action_when_helpful: true
      prioritize_comprehension_over_visual_speed: true
      avoid_unnecessary_angle_changes: true
      avoid_rapid_alternating_closeups: true
      allow_longer_holds_for_preschool_comprehension: true
      preserve_reaction_time: true
    shot_duration:
      dialogue: medium
      emotional: medium_to_long
      action: short_to_medium
      learning: medium_to_long
      participation: long
      establishing: medium

  lens_rules:
    24mm:
      use_for:
        - establishing
        - environment
        - large_group
        - broad_action
      avoid_for:
        - emotional_closeup
        - face_dominant_dialogue
    35mm:
      use_for:
        - full_body
        - action
        - discovery
        - comedy
        - group_interaction
    50mm:
      use_for:
        - standard_dialogue
        - character_medium
        - participation
        - learning
        - two_shot
    65mm:
      use_for:
        - reaction
        - gentle_emotion
        - dialogue_closeup
    85mm:
      use_for:
        - emotional_closeup
        - object_insert
        - important_reaction

  forbidden_camera_language:
    - extreme_fisheye_distortion
    - aggressive_handheld
    - violent_camera_shake
    - horror_style_push_in
    - frightening_pov
    - extreme_dutch_angles
    - rapid_spinning_camera
    - repeated_whip_pans
    - strobing_camera_transitions
    - excessive_snap_zoom
    - disorienting_rapid_cuts
    - extreme_low_angle_intimidation
    - extreme_face_distortion
    - camera_motion_during_participation_pause
    - unnecessary_camera_motion_during_important_dialogue

  quality_control:
    check_character_readability: true
    check_face_visibility: true
    check_action_readability: true
    check_screen_direction: true
    check_eye_lines: true
    check_180_degree_rule: true
    check_lens_consistency: true
    check_camera_height_consistency: true
    check_motion_intensity: true
    check_dialogue_camera_stability: true
    check_lip_sync_visibility: true
    check_participation_hold_duration: true
    check_preschool_visual_safety: true
    check_danger_intensity: true
    check_reassuring_resolution_camera: true
