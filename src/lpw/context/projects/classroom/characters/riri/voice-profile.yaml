      "I'm right here with you" should feel especially warm and supportive.

      Gradually introduce a little cheerful confidence toward
      "There we go!" while remaining soft and restrained.

      The performance should communicate safety,
      kindness, companionship, patience, and reassurance.

      Do not sound adult-parental, patronizing, sleepy,
      whispery, overly emotional, or theatrical.

forbidden_voice_traits:
  - harsh
  - aggressive
  - robotic
  - sarcastic
  - mature-sultry
  - shrill
  - frightening
  - lower-mid-pitch
  - chest-forward-resonance
  - nasal-reedy-timbre
  - crisp-staccato-consonants
  - dry-direct-tone
  - quick-stop-start-rhythm

consistency_constraints:
  - preserve Riri's four-year-old impression, clearly feminine identity, higher pitch, light-head resonance, smooth round non-nasal airy timbre, and slower flowing rhythm
  - require unmistakable blind-listening separation from Yoyo; never treat the pair as one speaker performing two styles
  - keep her delivery sweet, emotionally open, and distinct from Yoyo
  - keep emotional performance readable but gentle and restrained
  - never shout directly at the audience
  - never use a reference as final dialogue unless its words match exactly
  - all five references must sound like the exact same speaker
  - emotional state may change performance but must not change voice identity
  - preserve the same apparent age across every reference
  - preserve the same accent and pronunciation style across every reference
  - keep Riri softer, calmer, and more affectionate than Yoyo
  - never drift toward Yoyo's older, lower-mid, dry, chest-forward, nasal/reedy, crisp staccato, quick stop-start identity
  - avoid making Riri's curious reference as energetic as Yoyo's curious reference
  - avoid making Riri's happy reference as bubbly as Yoyo's happy reference
  - maintain consistent microphone distance and recording character

reference_audio_requirements:
  format: wav
  channels: mono
  background: silent
  music: false
  sound_effects: false
  reverb: minimal
  clipping: forbidden
  normalization: consistent-across-all-references
  purpose: voice-conditioning-and-identity-reference-only
