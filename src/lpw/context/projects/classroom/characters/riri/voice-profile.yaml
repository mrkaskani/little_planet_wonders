      soft connected consonants, and recognizable slower flowing rhythm.

      Reduce her normal cheerful energy slightly.

      Deliver the lines with tenderness, gentle concern,
      attentiveness, and emotional warmth.

      "Are you okay?" should sound caring and sincere.

      Use slightly slower pacing than the neutral reference,
      with a short natural pause after the caring question.

      Keep volume moderate-to-soft and articulation clear.

      Emotional intensity must remain mild and reassuring.

      Do not introduce panic, trembling, crying, fear,
      shouting, breathless urgency, or dramatic distress.

  reassuring:
    path: audio-assets/voice-references/riri/reassuring.wav
    target_duration_seconds: 6-10
    artifact:
