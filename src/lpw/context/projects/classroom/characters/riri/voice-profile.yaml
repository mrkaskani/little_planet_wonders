id: riri

voice_identity:
  voice_type: very-young-soft-feminine
  gender_presentation: clearly-feminine
  apparent_age: approximately three-to-four years old; distinctly younger than Yoyo
  pitch: very high natural little-girl pitch, well above Yoyo's range
  timbre: smooth, round, non-nasal, gentle, and lightly airy
  speaking_speed: unhurried; approximately 15 percent slower than Yoyo
  articulation: soft-edged, connected, flowing, lightly elongated, and clear
  emotional_baseline: sweet, cheerful, affectionate, and reassuring
  emotional_range: expressive but soft
  maximum_emotional_intensity: moderate

performance:
  pause_style: slower flowing rhythm with soft connected phrasing
  vocal_energy: light, gentle, airy, and engaged
  default_volume: moderate and comfortable
  laugh_style: tiny sweet giggle
  pronunciation_style: simple and clear

generation:
  provider: qwen3-tts-base-local-clone
  voice_id: riri-v1
  identity_reference: audio-assets/voice-references/riri/neutral-friendly.wav

references:
  neutral-friendly:
    path: audio-assets/voice-references/riri/neutral-friendly.wav
    target_duration_seconds: 6-10
    artifact:
      status: approved
      method: selected-voice-design-identity
      seed: 314164

    text: >
      Hello! I'm happy to see you.
      It's a lovely day.
      Shall we look around together?

    prompt: >
      Generate a clean neutral-friendly voice-reference recording for Riri.

      HARD IDENTITY ANCHOR: Riri must sound like a tiny three-to-four-year-old
      girl and must be instantly distinguishable from Yoyo in a blind A/B
      test. Do not reuse an older child's vocal identity. Keep her perceived
      pitch and vocal size clearly above and smaller than Yoyo's on every word.

      Riri has a clearly four-year-old, clearly feminine voice with a higher
      child pitch. Use light head resonance and a smooth, round, non-nasal,
      gentle airy timbre. Use soft-edged connected consonants and a slower,
      flowing speaking rhythm. Let vowels bloom slightly; avoid clipped word
      endings. Use noticeable melodic movement and light upward phrase endings.

      Deliver the lines with a sweet, friendly, affectionate,
      and naturally welcoming tone.

      Keep the speaking speed slow-medium, articulation soft and connected,
      vocal energy light and engaged, and volume moderate and comfortable.

      Use short natural pauses between thoughts.

      The performance should feel warm and emotionally open without
      sounding overly excited.

      Preserve a clearly four-year-old identity and the same high, light-head,
      smooth, round, non-nasal, gentle airy resonance. Never drift toward a
      lower-mid, dry, direct, chest-forward, nasal/reedy, staccato voice.
      Do not sound like an adult imitating a child.
      Avoid exaggerated cartoon delivery, excessive breathiness,
      or overly theatrical emotion.

  happy-gentle:
    path: audio-assets/voice-references/riri/happy-gentle.wav
    target_duration_seconds: 6-10
    artifact:
      status: approved
      method: base-cloned-from-neutral-friendly
      seed: 314260

    text: >
      Oh, look at that!
      That's wonderful!
      You did it!
      That makes me really happy.

    prompt: >
      Generate a happy-gentle voice-reference recording for Riri.

      HARD IDENTITY ANCHOR: this is the tiny, high-voiced three-to-four-year-old
      girl, not the older low-voiced boy. The two characters must never sound
      like one actor changing delivery. Keep Riri's vocal size small, pitch
      very high and natural, and cadence unhurried even when she is happy.

      Preserve Riri's four-year-old, clearly feminine identity, higher child
      pitch, light head resonance, smooth round non-nasal gentle airy timbre,
      soft connected consonants, and slower flowing rhythm.

      Deliver the lines with gentle childlike happiness,
      affectionate encouragement, and a small sense of delight.

      Increase the vocal energy slightly compared with the neutral reference,
      while keeping the performance soft, controlled, and emotionally safe.

      "You did it!" should sound warmly encouraging rather than loud.

      Keep articulation clear and volume moderate.

      Avoid hyperactive excitement, shouting, shrillness,
      exaggerated cartoon energy, or dramatic celebration.

  curious:
    path: audio-assets/voice-references/riri/curious.wav
    target_duration_seconds: 6-10
    artifact:
      status: approved
      method: base-cloned-from-neutral-friendly
      seed: 314361

    text: >
      Hmm... what's that?
      I wonder where it came from.
      Maybe we can take a closer look?

    prompt: >
      Generate a curious voice-reference recording for Riri.

      HARD IDENTITY ANCHOR: preserve the tiny, very-high-voiced
      three-to-four-year-old girl. She must remain unmistakably younger,
      smaller-sounding, softer, and more melodic than Yoyo; never render this
      as the same base speaker with gentler acting.

      Maintain the exact same four-year-old, clearly feminine identity,
      higher child pitch, light head resonance, smooth round non-nasal gentle
      airy timbre, soft connected consonants, and slower flowing rhythm.

      Perform with sweet, thoughtful curiosity rather than energetic
      investigation.

      Give questions a natural light upward intonation.

      Use a brief thoughtful pause after "Hmm..." and short natural
      pauses after caring or inviting questions.

      Keep the speaking speed around medium,
      with a slight slowdown while wondering or observing.

      The curiosity should feel gentle, interested, affectionate,
      and safe.

      Do not make Riri sound suspicious, nervous, frightened,
      overly excited, or dramatic.

  mild-concern:
    path: audio-assets/voice-references/riri/mild-concern.wav
    target_duration_seconds: 6-10
    artifact:
