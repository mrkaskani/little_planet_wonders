      There we go!

    prompt: >
      Generate a reassuring voice-reference recording for Riri.

      HARD IDENTITY ANCHOR: keep the tiny, very-high-voiced
      three-to-four-year-old girl identity. Even in a calm performance, retain
      her small vocal size, light head resonance, gentle melodic contour, and
      clear separation from Yoyo's older, lower, grounded boy voice.

      Preserve the exact same four-year-old, clearly feminine identity,
      higher child pitch, light head resonance, smooth round non-nasal gentle
      airy timbre, soft connected consonants, and slower flowing rhythm.

      Deliver the lines with gentle affection,
      calm encouragement, emotional openness,
      and quiet confidence.

      Slow the speaking speed slightly compared with Riri's normal delivery.

      Use short natural pauses after reassurance
