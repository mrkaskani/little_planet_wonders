    hex: '#93B7F2'
    usage:
    - shadowed-blue-fur-accent
    - cool-detail-depth
  iris_outer:
    name: cornflower-blue
    hex: '#5E84D8'
  iris_middle:
    name: sky-blue
    hex: '#7FC6FF'
  iris_inner:
    name: ice-blue
    hex: '#D7EEFF'
  pupil:
    name: near-black
    hex: '#1A1A22'
  sclera:
    name: soft-white
    hex: '#FFFDFE'
  nose:
    name: petal-pink
    hex: '#F2A6BC'
  mouth_interior:
    name: warm-rose
    hex: '#C8788E'
  paw_pads:
    name: candy-rose
    hex: '#EFA1BB'
  eye_highlight:
    name: bright-white
    hex: '#FFFFFF'
markings:
