music_profile:
  id: riri-music-profile
  type: character-music-profile
  version: 1
  status: draft
  character:
    id: riri
    name: Riri
    role: protagonist
    target_audience: preschool-ages-3-to-6
  musical_identity:
    summary: 'Riri sounds like a soft musical hug: a warm felt-piano theme with gentle harp plucks, rounded
      clarinet phrases, light pizzicato strings, and tiny tail-wag percussion. The music should feel cuddly,
      reassuring, pastel, affectionate, and quietly playful.

      '
    core_attributes:
    - sweet
    - cuddly
    - cheerful
    - gentle
    - affectionate
    - reassuring
    - softly-playful
    - preschool-readable
    emotional_center: affectionate-reassurance
    energy_level: medium-high
    perceived_weight: light
    musical_age_impression: young-child
    complexity: simple
  leitmotif:
    id: riri-main-motif
    description: 'A six-note welcoming motif that begins with a soft upward major-third gesture for Riri''s
      name, rocks gently around the middle register, rises to one warm high note, and returns home with
      a rounded downward leap. It should feel like a happy tail wag followed by a comforting nuzzle.

      '
    note_count: 6
    approximate_duration_seconds: 2.6
    melodic_contour:
      start: middle
      movement:
      - upward-leap
      - downward-step
      - upward-step
      - upward-leap
      - downward-leap
      ending: resolved-warm
    interval_language:
      preferred:
      - major-second
      - major-third
      - perfect-fourth
      - perfect-fifth
      avoid:
      - minor-second-clusters
      - tritone
      - wide-dissonant-leaps
      - chromatic-falls
    rhythm:
      pattern_description: 'Two light opening notes, two gently rocking middle notes, one warm longer
        high note, and one softly sustained home note. The opening should resemble two small tail wags
        rather than a sharp accent.

        '
      syllabic_pattern: ri-ri, come-close, home
      syncopation: light
      bounce: medium
    register:
      primary: mid-high
      range: approximately G4 to D5, with octave relocation allowed for arrangement
    optional_note_example:
      key: g-major
      notes:
      - G4
      - B4
      - A4
      - B4
      - D5
      - G4
    identity_rules:
    - preserve-the-core-rhythmic-shape
    - preserve-the-main-melodic-contour
    - keep-the-motif-recognizable-in-all-variations
    - retain-the-two-note-opening-name-gesture
    - retain-the-gentle-middle-rocking-motion
    - preserve-the-warm-return-to-the-home-note
  tempo:
    default_bpm: 104
    minimum_bpm: 58
    maximum_bpm: 136
    usage:
      calm: 68
      normal: 104
      excited: 124
      action: 132
      sad: 62
  meter:
    primary: 6-8
    alternatives:
    - 3-4
    - 4-4
    avoid:
    - irregular-meters
    - rapidly-changing-meter
    - heavy-2-4-march-meter
  tonality:
    primary_mode: major
    preferred_keys:
    - g-major
    - c-major
    - f-major
    modal_color: 'Warm major harmony with major-pentatonic melody, added-sixth color, gentle suspended
      seconds, and occasional soft subdominant warmth.

      '
    dissonance:
      level: low
      allowed_usage: 'Brief soft suspensions, neighboring seconds, and gentle incomplete cadences may
        support curiosity or worry, but they must resolve quickly into warm consonance.

        '
  harmony:
    complexity: simple
    preferred_progressions:
    - I-vi-IV-V
    - I-IV-I-V-I
    - I-iii-IV-I
    - I-add6-ii7-V-I
    - tonic-pedal-with-gentle-subdominant-color
    chord_character:
    - warm-rounded
    - tender-open
    - pastel-soft
    - reassuring
    - affectionate
    avoid:
    - harsh-chromatic-harmony
    - horror-suspensions
    - prolonged-diminished-chords
    - aggressive-minor-ostinatos
    - dense-jazz-extensions
    - unresolved-tritone-motion
  instrumentation:
    signature_instrument:
