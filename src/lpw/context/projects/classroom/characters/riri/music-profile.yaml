generation_guidance:
  positive_prompt: 'Riri, a sweet cheerful little puppy designed for a preschool animated series, tiny
    plush rounded body, oversized rounded head, short legs, tiny floppy ears, fluffy curved tail, warm
    friendly smile, oversized expressive bright blue eyes, long curved upper eyelashes, tiny petal-pink
    nose, soft cotton-candy-pink fur, slightly lighter strawberry-milk muzzle and highlight areas, pastel
    periwinkle accent fur on chest, front paws, and tail, rosy pink paw pads, ultra-soft plush fur texture,
    child-friendly proportions, cuddly seated posture, gentle playful personality, clean readable silhouette,
    simple colorful high-quality animation character design.

    '
  reference_image_prompt_addition: 'Reproduce the same character identity, face, proportions, markings,
    expression warmth, and distinctive features visible in the supplied Riri reference image. Ignore the
    original image background, lighting color cast, pose-specific deformation, and generation artifacts.
    Keep the same pink-and-blue concept while using the refined production palette defined in this YAML.

    '
  negative_prompt: 'realistic dog, photorealistic fur, sharp teeth, visible claws, aggressive expression,
    frightening expression, thin body, long legs, large upright ears, black nose, changed eye color, dull
    muddy colors, random accessories, collar, bow, clothing, changed fur pattern, asymmetrical eyes, distorted
