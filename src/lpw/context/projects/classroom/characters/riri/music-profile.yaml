      accent: pastel-periwinkle
    position: tail
    style: soft-gradient-like-blend
  distinctive_features:
  - oversized-blue-expressive-eyes
  - long-curved-upper-eyelashes
  - tiny-petal-pink-nose
  - warm-smiling-mouth
  - plush-cotton-candy-pink-fur
  - soft-blue-fur-accents-on-chest-paws-and-tail
  - tiny-floppy-ears
  - fluffy-curved-tail
  - visible-rosy-paw-pads
hair_or_fur_details:
  type: plush-puppy-fur
  overall_length: short-medium
  density: high
  softness: extremely-soft
  chest_detail: slightly-longer-fluff
  tail_detail: fluffiest-and-most-airy
  ear_detail: short-velvety-fur
  paw_detail: plush-rounded-fur
  movement: 'Fur should react subtly to movement with soft bounce and volume, but must remain neat, simplified,
    and easy to reproduce.

    '
wardrobe:
  default:
    enabled: false
    outfit_id: none
    description: Riri normally appears without clothing.
  optional_signature_accessory:
    enabled: false
