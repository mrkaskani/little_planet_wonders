id: riri-yoyo-wan22-preproduction
type: wan-generation-policy-context
version: 1
status: approved

metadata:
  project_id: riri-yoyo
  scope: reusable-preproduction-foundation
  purpose: >-
    Define the supported Wan 2.2 task modes, conditioning requirements, prompt
    contracts, technical boundaries, and validation gates without creating
    episode, scene, shot, dialogue, or render content.

source_authority:
  local_runtime_contract: ../../../../../docs/wan22-setup.md
  official_model_catalog: https://github.com/Wan-Video/Wan2.2
  project: project.yaml
  visual_style: visual_style/visual_style.yaml
  art_direction: visual_style/art-direction.yaml
  lighting: visual_style/lighting.yaml
  materials: visual_style/materials.yaml
  camera_language: cinematography/camera-language.yaml
  composition: cinematography/composition-rules.yaml
  lens_package: cinematography/lens-package.yaml
  movement: cinematography/movement-rules.yaml
  prop_catalog: assets/props.yaml
  costume_catalog: assets/costumes.yaml
  vehicle_catalog: assets/vehicles.yaml
  background_character_catalog: assets/background-characters.yaml
  animation_style: characters/animation-style.yaml
  acting_style: characters/acting-style.yaml
  relationships: characters/relationships.yaml
  brand: brand.yaml
  references: references.yaml
  reference_views: reference-views.yaml
  asset_conventions: asset-conventions.yaml
  safety: safety.yaml
  educational_direction: educational-direction.yaml
  preproduction_checklist: preproduction-checklist.yaml
  review_cards: wan22-review-cards.yaml
  reference_sequence_prompt: >-
    generation-records/prompts/twelve-second-reference-sequence--s2v--prompt-v002.yaml
  single_start_reference_prompt: >-
    generation-records/prompts/single-start-reference--wan22-s2v--prompt-v003.yaml
  s2v_dialogue_audio_prompt: >-
    generation-records/prompts/s2v-dialogue-audio-preparation--prompt-v001.yaml
  prior_five_second_reference_sequence_prompt: >-
    generation-records/prompts/five-second-reference-sequence--s2v--prompt-v001.yaml
  audio_style: audios/audio_style.yaml
  voice_production: audios/voice-production.yaml
  s2v_input_spec: audios/s2v-input-spec.yaml
  s2v_runtime_profiles: wan22-s2v-runtime-profiles.yaml
  voice_reference_audit: audios/voice-reference-audit.yaml
  authority_rules:
    - local runtime support determines which official model families may be used
    - project YAML controls identity audience safety and delivery requirements
    - specialized domain files supply only their own prompt fragments and invariants
    - approved conditioning inputs never redefine canonical identity by themselves

phase_boundary:
  phase: preproduction
  allowed:
    - reusable-mode-selection-rules
    - reusable-prompt-schemas
    - reference-input-specifications
    - audio-input-specifications
    - continuity-invariants
    - validation-and-rejection-criteria
    - neutral-dry-run-manifests
  forbidden:
    - episode-story
    - script
    - scene-plan
    - shot-specific-prompt
    - final-dialogue
    - queued-generation
    - render
    - edit
    - export

supported_tasks:
  t2v:
    model: wan2.2-t2v-a14b
    workflow_id: wan-t2v
    input_types:
      - text
    role: final-text-driven-candidate-when-invention-is-acceptable
    best_for:
      - exploratory-environments
      - non-recurring-backgrounds
      - distant-or-simple-subjects
      - compositions-without-exact-reference-dependence
    not_for:
      - exact-recurring-character-identity
      - exact-recurring-location-layout
      - readable-generated-text
      - complex-multi-step-action
    prompt_schema:
      - subject-and-count
      - appearance-or-stable-medium-sized-features
      - one-observable-action
      - critical-object-relationship
      - environment
      - framing-and-one-camera-behavior
      - lighting
      - visual-style
      - short-motion-and-continuity-constraints
    approval_rule: >-
      A T2V candidate may be approved only when the requested identity and layout
      do not require an exact source image and all continuity checks pass.

  i2v:
    model: wan2.2-i2v-a14b
    workflow_id: wan-i2v
    input_types:
      - text
      - approved-single-frame-image
    role: final-reference-driven-candidate
    required_when:
      - recurring-character-identity-is-visible
      - exact-location-layout-is-visible
      - wardrobe-or-prop-placement-is-continuity-critical
      - starting-composition-must-be-preserved
    source_image_authority:
      controls:
        - visible-starting-pose
        - visible-composition
        - visible-object-relationships
        - visible-lighting-state
      does_not_control:
        - permanent-identity-changes
        - hidden-geometry
        - unapproved-artifacts
    motion_prompt_schema:
      - brief-current-state
      - one-observable-movement
      - direction
      - speed
      - range-or-repetition
      - endpoint
      - one-emotional-change-if-needed
      - one-camera-behavior
      - essential-invariants
    approval_rule: approved-source-image-and-temporal-identity-review-required

  ti2v:
    model: wan2.2-ti2v-5b
    workflow_id: wan-ti2v
    input_types:
      - text
      - optional-approved-single-frame-image
    role: efficient-draft-and-screening
    use_for:
      - prompt-clarity-tests
      - composition-tests
      - motion-direction-tests
      - reference-compatibility-tests
      - seed-comparisons
    never_final_evidence_for:
      - exact-face-detail
      - fine-fur-or-feather-detail
      - small-patterns
      - readable-text
      - final-material-quality
    escalation:
      text-draft: t2v
      image-draft: i2v
      dialogue-draft: s2v
    documented_native_path:
      resolution_class: 720P
      landscape_dimensions: "1280x704"
      portrait_dimensions: "704x1280"
      frame_rate: 24

  s2v:
    model: wan2.2-s2v-14b
    workflow_id: wan-s2v
    input_types:
      - text-direction
      - exactly-one-approved-single-frame-character-image
      - locked-clean-speech-audio
      - optional-pose-guidance-video
    role: final-locked-dialogue-or-vocal-performance-candidate
    precision_policy:
      production: bf16
      local: gguf-q4
      local_profile: local-m4-16gb-preview-and-mcp-testing-only
      final-production-must-rerender-in-bf16: true
    native_creation_profile:
      resolution_class: 480P
      landscape_size: "832*480"
      width: 832
      height: 480
      frame_rate: 16
      frame_count_rule: four-n-plus-one-covering-complete-audio
      five_second_frame_count: 81
      five_second_temporal_intervals: 80
      native_aspect_ratio: "26:15"
      direct_youtube_delivery: forbidden
      valid_dimension_rule: width-and-height-must-each-be-divisible-by-16
      preferred_landscape_dimensions: "832x480"
      true_vertical_dimensions: "480x832"
      square_vram_fallbacks:
        - "640x640"
        - "480x480"
      resize_node: Wan-Video-Image-Resize-to-closest
      aspect_ratio_policy: >-
        Match the generation canvas to the approved reference-image aspect ratio.
        Never place a 16:9 reference into a square generation canvas.
    sampling_profiles:
      standard:
        steps: 20
        cfg: 6.0
        sampler: unipc
        scheduler_default: simple
        scheduler_allowed: [simple, euler]
      lightning:
        requires_lightning_lora: true
        steps_allowed: [4, 5]
        steps_default: 5
        cfg: 1.0
        sampler: unipc
        scheduler_default: simple
        scheduler_allowed: [simple, euler]
    required_inputs:
      approved_character_frame_count: 1
      multiple_reference_images: forbidden
      locked_clean_speech: true
      verified_transcript: true
      audio_hash: true
    performance_scope:
      - half-body
      - full-body
      - facial-expression
      - speech-synchronized-gesture
      - optional-pose-guided-broad-body-performance
    pose_guidance:
      required_by_default: false
      use_when: exact-broad-body-gesture-is-required-and-audio-alone-is-insufficient
      must_agree_with_audio_emphasis_and_source_pose: true
      more_conditioning_is_not_automatically_better: true
    timing_authority: locked-speech-audio
    timing_events:
      - leading-silence
      - speech-onset
      - phrase-boundaries
      - pauses
      - emphasized-words
      - speech-end
      - final-settle
    short_audio_onset_buffer:
      required_leading_silence_seconds: {minimum: 0.2, maximum: 0.5, default: 0.25}
      one_second_voice_with_buffer_frame_options_at_16fps: [21, 25]
      select_frame_count_from_final_padded_wav_duration: true
    reject_if:
      - mouth-moves-during-unmotivated-silence
      - lip-onset-or-ending-is-misaligned
      - face-or-identity-drifts
      - gesture-conflicts-with-audio-emphasis
      - music-ambience-or-effects-are-baked-into-conditioning-audio
      - more-than-one-reference-image-is-bound
      - reference-width-or-height-is-not-divisible-by-16-after-resize
      - reference-and-generation-canvas-aspect-ratios-do-not-match
      - talking-head-touches-frame-edge
      - mouth-jawline-or-eyes-are-obscured

unsupported_tasks:
  animate:
    official_model: wan2.2-animate-14b
    enabled: false
    policy: reject
    reason: deliberately-excluded-by-local-runtime-contract
    forbidden_inputs:
      - performer-video-for-character-replacement-or-animation
      - replacement-mask
      - relighting-lora
    clarification: optional-s2v-pose-guidance-remains-supported-and-does-not-enable-animate

reference_input_contract:
  applies_to:
    - i2v
    - ti2v-image
    - s2v
  required:
    - one-coherent-image
    - exactly-one-direct-conditioning-image
    - one-unambiguous-primary-subject
    - correct-anatomy
    - clear-silhouette
    - visible-action-contact-points
    - movement-space-in-action-direction
    - framing-compatible-with-action
    - output-compatible-aspect-ratio
    - stable-large-scale-background-geometry
    - approved-version-and-source-path
    - width-and-height-divisible-by-16-after-approved-resize
    - reference-aspect-ratio-matches-generation-canvas
    - dead-space-buffer-around-head-chin-and-action-extents
    - unobscured-mouth-jawline-and-eyes-for-s2v-speaking-shots
  forbidden:
    - collage
    - split-screen
    - multi-view-character-sheet-as-generation-input
    - watermark
    - caption
    - label
    - interface-element
    - accidental-face
    - duplicate-subject
    - anatomy-error
    - severe-background-clutter
    - source-pose-that-conflicts-with-requested-motion
    - multiple-direct-reference-images
    - front-and-side-profile-images-bound-together
    - forced-reference-stretch
    - unapproved-aspect-ratio-crop
    - hair-head-chin-or-mouth-touching-frame-edge
    - heavy-shadow-mask-or-extreme-angle-obscuring-mouth-jaw-or-eyes
  identity_sheet_rule: >-
    Turnarounds, expression boards, and pose sheets support human identity review
    but are never passed directly as the single conditioning frame.
  single_image_architecture_rule: >-
    Bind exactly one image to the native Wan 2.2 S2V image input. Character and
    location sheets may inform reference-image creation and human review, but
    must not be connected as additional S2V conditioning images.

comfyui_s2v_image_preparation:
  required_resize_node: Wan-Video-Image-Resize-to-closest
  divisible_by: 16
  preserve_aspect_ratio: true
  stretching: forbidden
  preferred_canvas:
    orientation: landscape
    dimensions: "832x480"
  optional_square_canvases:
    - {dimensions: "640x640", use_when: square-composition-and-vram-require-it}
    - {dimensions: "480x480", use_when: square-composition-and-lower-vram-require-it}
  vertical_canvas:
    dimensions: "480x832"
    clarification: 832x480-is-landscape-not-vertical
  reject_if:
    - width-or-height-not-divisible-by-16
    - canvas-ratio-does-not-match-reference-ratio
    - subject-is-stretched
    - identity-critical-details-are-cropped

comfyui_s2v_vae_burn_mitigation:
  issue: first-generated-frame-may-be-oversaturated-hyper-contrasted-or-glitched
  latent_workflow:
    duplicate_reference_latent_as_sacrificial-index-zero: true
    node_role: Latent-Cut-or-equivalent-batch-latent-operation
  output_workflow:
    discard_sacrificial_first_frame: true
    node_role: Image-from-Batch-or-equivalent
    first_kept_frame_index: 1
  validation:
    - exported-duration-still-matches-locked-audio
    - first-kept-frame-is-clean
    - no-one-frame-audio-picture-offset
    - qwen-vl-checks-first-eight-kept-frames-for-burn-or-flash

motion_contract:
  primary_action_count: 1
  camera_behavior_count: 1
  default_speed: slow-controlled
  required_fields:
    - moving-entity-or-body-part
    - direction
    - speed
    - scope
    - endpoint
    - locked-regions
  complexity_rule: >-
    If subject action, camera motion, material motion, and background motion compete,
    simplify the action or lock the camera before changing seeds or resolution.
  source_pose_rule: requested-motion-must-begin-plausibly-from-source-pose

prompt_budget:
  rule: use-only-information-that-changes-or-protects-the-visible-result
  place_first:
    - subject-and-count
    - primary-action
    - identity-critical-invariants
    - critical-object-relationship
  omit:
    - invisible-details
    - repeated-synonyms
    - full-YAML-dumps
    - audio-mix-rules-in-visual-prompts
    - visual-rules-in-clean-speech-audio
    - long-negative-lists-unrelated-to-known-failures
  positive_over_negative: true

technical_contract:
  delivery:
    aspect_ratio: "16:9"
    resolution: "1920x1080"
    frame_rate: 24
    five_second_display_frames: 120
    platform: youtube-landscape-phone-tablet-tv
  generation:
    resolution_is_task_specific: true
    frame_rate_is_workflow_specific: true
    supported_resolution_classes:
      t2v:
        - 480P
        - 720P
      i2v:
        - 480P
        - 720P
      ti2v:
        - 720P
      s2v:
        - 480P
        - 720P
    frame_count_rules:
      t2v_i2v_ti2v: 4n-plus-1-when-required-by-selected-workflow
      s2v: four-n-plus-one-with-81-frames-for-five-seconds-at-16-fps
    never_assume_native_delivery_resolution: true
  conform:
    preserve_aspect_ratio: true
    stretching: forbidden
    crop_or_pad_requires_approval: true
    upscale_requires_quality-control: true
    frame_rate_conversion_requires-quality-control: true
    s2v_480p_to_youtube_1080p:
      source_dimensions: "832x480"
      source_frame_rate: 16
      source_five_second_frames: 81
      aspect_conform:
        method: center-crop-vertical-then-upscale
        crop_dimensions: "832x468"
        crop_pixels: {top: 6, bottom: 6, left: 0, right: 0}
        stretching: forbidden
      upscale_dimensions: "1920x1080"
      delivery_frame_rate: 24
      delivery_five_second_frames: 120
      interpolation_review: qwen-vl-face-mouth-paw-feather-fur-and-background-check

reproducibility:
  required_record_fields:
    - project_id
    - model
    - task
    - prompt_version
    - negative_prompt_version
    - reference_id
    - reference_version
    - audio_hash
    - seed
    - dimensions
    - frame_rate
    - frame_count
    - workflow_version
    - context_hash
    - candidate_number
    - approval_status
  null_when_not_applicable:
    - reference_id
    - reference_version
    - audio_hash

review_order:
  - global-structure
  - composition-and-subject-count
  - identity-and-anatomy
  - primary-action
  - camera-motion
  - temporal-stability
  - materials-and-lighting
  - fine-detail
  - audio-alignment-when-applicable

failure_actions:
  regenerate:
    when: isolated-seed-variation
  adjust_one_variable:
    when: prompt-or-parameter-effect-is-uncertain
  simplify:
    when: action-camera-or-background-complexity-competes
  replace_reference:
    when: source-anatomy-framing-or-starting-pose-is-weak
  replace_audio:
    when: speech-is-noisy-unlocked-clipped-or-misaligned
  switch_supported_task:
    when: current-conditioning-mode-cannot-protect-the-required-identity-or-layout
  redesign_later_production_work:
    when: requested-action-cannot-fit-one-clear-generation-segment

preproduction_validation:
  require_supported_task: true
  require_approved_reference_for:
    - i2v
    - s2v
  require_locked_audio_for:
    - s2v
  reject_placeholder_reference_paths: true
  reject_missing_reference_files: true
  reject_animate: true
  allow_no-generation-dry-run: true
