palette_relationships:
  dominant_family: warm_cream_gold_apricot
  secondary_family: natural_green
  cool_counterbalance: clear_sky_blue_mint_lavender
  primary_playful_accent: warm_salmon
  darkest_daytime_anchor: soft_charcoal
  darkest_night_color: night_navy
  lightest_surface_color: storybook_cream
  highest_daytime_contrast_pair:
  - storybook_cream
  - soft_charcoal
  highest_night_contrast_pair:
  - night_navy
  - warm_window_glow
rendering_guidance:
  surface_color_rule: Use canonical palette colors as material midtones, not literal final pixels.
  highlights: Warm, clean, luminous; avoid clipping large areas to pure white.
  shadows: Colored and readable; avoid crushed black.
  day_saturation: Moderate to rich while remaining child-friendly.
  nature_saturation: Fresh and lively, with layered green values rather than a single flat green.
  interior_temperature: Warm golden neutral base with controlled colorful accents.
  night_temperature: Deep blue environment with localized amber warmth.
  golden_hour_behavior: Allow orange/coral lighting to dominate atmosphere without permanently recoloring surfaces.
quality_control:
  character_specific_colors_included: false
  old_infographic_palette_used: false
  new_high_resolution_scene_palette_used: true
  canonical_surface_and_lighting_colors_separated: true
  pure_black_required: false
  pure_white_required: false
  new_locations_should_inherit_this_palette: true
  avoid_uncontrolled_neon_colors: true
  avoid_muddy_low_saturation_color_grading: true
