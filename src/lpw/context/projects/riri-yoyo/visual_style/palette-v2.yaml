  version: '2.0'
  palette_role: master_project_color_palette
  canonical: true
  source_reference: six_new_high_resolution_location_images
  scope: whole_project
  character_specific: false
  extraction_method: consolidated_from_repeated_midtone_colors_across_new_scene_references
  core_rule: Use these colors as the project's shared visual language. Lighting may alter rendered pixels, but must not redefine
    canonical surface colors.
project_color_identity:
  overall_feel:
  - warm
  - sunny
  - storybook
  - playful
  - natural
  - welcoming
  - preschool_friendly
  - richer_than_soft_pastel
  - high_color_clarity
  dominant_temperature: warm_golden_with_fresh_blue_and_green_counterbalance
  global_contrast: medium
  saturation: moderate_to_rich
  white_behavior: warm_cream_not_pure_white
  dark_behavior: deep_natural_brown_charcoal_or_navy_not_pure_black
