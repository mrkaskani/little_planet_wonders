materials_and_vegetation:
  stone_path:
    material: irregular-rounded-light-warm-stone-pavers
    surface: matte-gently-weathered-with-small-soft-grass-seams
  bridge:
    material: warm-rounded-wood
    form: child-safe-gently-arched-single-span-with-rounded-rails-and-post-caps
  bench:
    material: warm-wood-slats-with-dark-rounded-metal-frame
  lamp_post:
    material: dark-matte-metal
    form: simple-storybook-lantern-head-on-slender-post
  stream:
    water: clear-shallow-blue-green
    boundary: rounded-stones-and-readable-gently-sloped-banks
    motion: broad-slow-ripples-without-sparkle-flicker
  vegetation:
    lawn: broad-soft-green-grass-masses
    tree_trunks: warm-textured-bark
    tree_canopies: rounded-grouped-leaf-masses
    flowering_shrubs: broad-pink-blue-yellow-and-white-clusters
    wildflowers: sparse-to-medium-readable-groups-along-path-and-meadow

lighting_and_atmosphere:
  permanent_geometry_rule: lighting-state-never-changes-path-stream-bridge-tree-bench-or-lamp-layout
  primary_midday:
    stable_values: {time: midday, sun_angle: high, intensity: 1.00}
    unresolved_shadow_quality: [direct-and-crisp, soft]
    common_character: warm-clear-bright-child-safe
  alternate_late_afternoon:
    time: late-afternoon
    sun_angle: low
    shadow_quality: longer
    light_quality: warm-soft-golden
    intensity: 0.75
  dramatic_natural_variant:
    role: optional-sun-ray-lighting-audition-with-identical-geometry
  primary_atmosphere:
    weather: clear
    season: late-spring-with-summer-compatible-board-variant
    temperature: mild
    visibility: high
    air_clarity: high
    humidity_feel: comfortable
  clean_neutral:
    role: value-form-local-color-and-geometry-review
    rule: not-a-new-location-season-or-permanent-color-state
  reconciliation:
    primary_shadow_quality: project-owner-selection-required
    do_not_average_or-combine: true

continuity:
  fixed_across_views_and_states:
    - one-path-one-stream-and-one-bridge
    - bridge-position-orientation-span-and-height
    - path-stream-course-and-safe-bank-boundaries
    - bench-and-lamp-placement
    - foreground-framing-tree-count-and-scale
    - midground-tree-grouping
    - meadow-flower-grouping-and-mountain-silhouette
  temporary_states:
    - sun-angle-and-shadow-length
    - approved-clear-weather-lighting-variant
    - broad-coherent-foliage-motion
    - broad-slow-water-ripples
    - ground-wetness-without-geometry-change

mcp_context:
  retrieval_key: nature-park-v002
  package_status: complete-candidate-with-three-reconciliation-items
  preferred_authority_order:
    - location-v2.yaml-for-v002-structured-review-context
    - location.yaml-for-current-canonical-policy
    - nature-park-primary-master-v001-for-current-generation-conditioning
    - v002-design-review-boards-for-human-review-only
  query_routing:
    safe-scale-and-proportions: relative_scale_authority.stable_context_values_for_mcp
    disputed-scale-values: scale_reconciliation
    site-plan-path-stream-and-bridge: site_geometry
    camera-view-selection: board_catalog
    hardscape-and-vegetation-prompting: materials_and_vegetation
    lighting-atmosphere-selection: lighting_and_atmosphere
    cross-view-and-animation-continuity: continuity
    source-file-lookup: source_images
  safe_prompt_context_fragment: >-
    Fresh peaceful child-safe nature park at clear midday, one curved light warm
    stone path, one shallow calm blue-green stream, exactly one rounded wooden
    arch bridge, one foreground bench and one dark lamp post, two large framing
    trees, grouped midground trees, broad green lawn, readable wildflower groups,
    distant soft mountains, open travel space, and clearly visible water banks.
  safe_scale_context_fragment: >-
    Normalize site width to 1.00 and visible depth to 1.30; path width 0.16,
    bridge span 0.28 and height 0.16, bench width 0.22 and height 0.12, lamp height
    0.26, stream width 0.18, open lawn width 0.60, and foreground tree height 0.90.
  generation_constraints:
    - exactly-one-bridge-one-stream-one-primary-path-one-bench-and-one-lamp-post
    - preserve-stream-path-bridge-and-safe-bank-geometry
    - keep-water-shallow-clear-and-boundaries-readable
    - preserve-foreground-framing-trees-and-midground-tree-groups
    - keep-path-and-meadow-movement-space-open
    - use-only-stable-context-values-until-reconciliation
  direct_conditioning_policy:
    these_five_boards_allowed: false
    reason: multi-panel-collages-with-labels-diagrams-duplicate-views-and-lighting-variants
    current_allowed_location_frame: nature-park-primary-master-v001
  prohibited_inference:
    - absolute-meter-or-centimeter-dimensions
    - medium-tree-canopy-or-large-flower-width-before-selection
    - new-stream-branches-bridges-benches-lamps-or-tree-groups
    - deep-dark-or-unclear-water
    - treating-lighting-or-neutral-reference-as-geometry-change

generation_policy:
  design_review_images_are_direct_conditioning_inputs: false
  allowed_modes_before_v2_approval: []
  forbidden_modes_for_these_five_boards: [t2v, i2v, ti2v-image, s2v]
  active_generation_reference: nature-park-primary-master-v001
  active_generation_reference_version: v001
  clean_v2_frames_required_after_approval:
    - primary-establishing-frame
    - opposite-facing-frame
    - bridge-and-stream-landmark-frame
    - path-action-area-frame
    - clean-neutral-geometry-frame

review_gate:
  technical_registration: complete
  source_package_complete: true
  scale_reconciliation: pending
  primary_shadow_quality_reconciliation: pending
  project_owner_visual_spatial_material-lighting-and-safety-approval: pending
  compare_against_v001: required
  partial_canonical_promotion: forbidden
