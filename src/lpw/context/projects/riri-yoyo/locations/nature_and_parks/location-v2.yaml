authority_resolution:
  scale_and_proportion_board:
    authoritative_for:
      - normalized-site-width-and-visible-depth
      - printed-terrain-elevations
      - path-stream-bridge-bench-lamp-and-tree-relative-scale
    limitation: conflicting-printed-values-remain-unresolved
  transformation_1_board:
    authoritative_for:
      - cinematic-camera-coverage
      - landmark-detail-intent
      - lighting-audition-coverage
      - cross-check-of-stable-scale-strip
  transformation_2_board:
    authoritative_for:
      - site-topology-and-camera-direction-logic
      - hardscape-and-vegetation-material-classes
      - bridge-landmark-emphasis
  transformation_3_board:
    authoritative_for:
      - titled-view-and-state-identification
      - material-closeup-vocabulary
      - printed-primary-alternate-atmosphere-and-neutral-metadata
  transformation_4_board:
    authoritative_for:
      - production-finish-and-surface-character
      - polished-atmosphere-target
      - neutral-quality-control-target
  conflict_rules:
    - do-not-average-or-invent-a-consensus-value
    - scale-board-governs-geometry-except-where-its-own-printed-values-conflict
    - polished-finish-never-overrides-site-geometry-or-landmark-counts
    - lighting-panels-change-illumination-not-park-layout
    - neutral-panels-are-review-states-not-a-new-location-identity

location_identity:
  category: nature-park
  summary: sunny-green-park-with-curved-stone-path-shallow-stream-one-wood-bridge-and-meadow-flowers
  emotional_character: [peaceful, fresh, open, safe, curious, gentle, cheerful]
  medium: premium-soft-stylized-3d-preschool-animation
  default_time_of_day: clear-midday
  default_season: late-spring
  permanent_visual_anchors:
    - one-curving-warm-stone-walking-path
    - one-shallow-clear-stream
    - one-rounded-wooden-arch-bridge
    - one-wood-and-metal-park-bench-near-foreground-path
    - one-dark-metal-lamp-post-near-bench-and-path
    - two-large-foreground-framing-trees
    - grouped-midground-large-and-medium-trees
    - lawn-meadow-flowering-shrubs-and-wildflower-groups
    - distant-blue-green-mountain-range
  quantity_and_continuity_intent:
    bridge: exactly-one
    stream: one-continuous-course
    path: one-primary-continuous-route
    foreground_framing_trees: 2
    midground_large_trees: 5-main
    midground_medium_trees: 6-or-more-grouped
    bench: one-primary
    lamp_post: one-primary

site_geometry:
  coordinate_system: relative-to-site-reference-width
  site_reference_width: 1.00
  visible_site_depth: 1.30
  plan_logic:
    foreground_entry: stone-path-enters-from-lower-foreground
    path_route: curves-through-meadow-and-crosses-near-stream-bridge-area
    stream_route: winding-through-midground-and-under-bridge
    bridge_location: fixed-crossing-over-stream-right-of-primary-path-axis
    bench_location: foreground-left-of-path
    lamp_location: foreground-left-near-bench
    major_tree_framing: large-trunks-at-left-and-right-image-edges
    mountain_range: fixed-background-horizon
  camera_access:
    - primary-path-entry
    - front-aligned-path-view
    - right-side-bridge-view
    - left-side-bench-and-stream-view
    - opposite-facing-view
    - elevated-overview

zones_and_interaction_context:
  path_travel_zone:
    purpose: primary-walking-running-and-character-travel-route
    required_clearance: visually-open-and-free-of-props-or-plant-overgrowth
    continuity: same-continuous-curving-route-in-every-view
  bridge_crossing_zone:
    purpose: supervised-crossing-and-landmark-action
    required_features:
      - two-sided-rounded-wood-railings
      - readable-non-slip-deck-surface
      - clear-entry-and-exit-approaches
    prohibited: [blocked-approaches, missing-rails, abrupt-edge-drop]
  supervised_stream_edge_zone:
    purpose: looking-observing-and-guided-nature-learning
    required_features:
      - shallow-clear-water
      - visible-bed-near-edge
      - rounded-stone-boundary
      - readable-gently-sloped-bank
    supervision_rule: young-characters-do-not-enter-or-approach-water-unsupervised
  meadow_and_flower_zone:
    purpose: visual-discovery-and-gentle-nature-interaction
    rule: flower-groups-border-space-without-blocking-the-path-or-open-lawn
  bench_rest_zone:
    purpose: quiet-rest-observation-and-caregiver-presence
    rule: bench-and-lamp-remain-anchored-beside-not-inside-the-travel-lane
  open_lawn_action_zone:
    purpose: low-risk-group-play-and-wide-character-staging
    rule: preserve-a-broad-readable-open-area-free-of-water-edge-confusion

relative_scale_authority:
  source: scale_and_proportion_board
  unit: relative-to-site-width
  normalization:
    site_reference_width: 1.00
    visible_site_depth: 1.30
  terrain_elevation_printed_values:
    front_lawn_low: 0.18
    path_slight_rise: 0.26
    bridge_top_highest: 0.32
    stream_surface_lowest: 0.10
    back_lawn_rise: 0.24
    printed_elevation_range_lowest_to_highest: 0.32
    mathematical_high_minus_low: 0.22
  stable_structural_values:
    path_width: 0.16
    bridge_span_outer_width: 0.28
    bridge_height_top_to_stream_surface: 0.16
    bench_width: 0.22
    bench_height: 0.12
    lamp_post_total_height: 0.26
    stream_width_average: 0.18
    lawn_width_typical_open_area: 0.60
  tree_values:
    foreground_major_tree:
      total_height: 0.90
      canopy_width: 0.56
      count: 2
    midground_large_tree:
      total_height: 0.72
      canopy_width: 0.38
      count: 5-main
    midground_medium_tree:
      total_height: 0.56
      canopy_width_diagram: 0.30
      canopy_width_summary_table: 0.36
      count: 6-or-more
  flower_group_values:
    large_group:
      width_diagram: 0.12
      width_summary_table: 0.22
      depth: 0.14
    small_group:
      width: 0.12
      depth: 0.08
  stable_context_values_for_mcp:
    site_reference_width: 1.00
    visible_site_depth: 1.30
    foreground_tree_height: 0.90
    foreground_tree_canopy_width: 0.56
    midground_large_tree_height: 0.72
    midground_large_tree_canopy_width: 0.38
    midground_medium_tree_height: 0.56
    path_width: 0.16
    bridge_span: 0.28
    bridge_height: 0.16
    bench_width: 0.22
    bench_height: 0.12
    lamp_height: 0.26
    stream_width: 0.18
    lawn_width: 0.60
    small_flower_group_footprint: "0.12x0.08"
  interpretation_rules:
    - values-are-relative-not-metric-or-imperial
    - do-not-use-conflicting-medium-canopy-or-large-flower-width-until-reconciled
    - treat-printed-elevation-range-as-source-text-not-a-derived-arithmetic-range
    - preserve-proportions-across-all-camera-lighting-and-atmosphere-variants

scale_reconciliation:
  status: required-before-v2-promotion
  conflicts:
    midground_medium_tree_canopy_width: [diagram-0.30, summary-table-0.36]
    large_flower_group_width: [diagram-0.12, summary-table-0.22]
    elevation_range_semantics:
      printed: 0.32
      highest_minus_lowest: 0.22
  rules:
    - do-not-average-conflicting-values
    - do-not-expose-conflicting-fields-as-safe-generation-values
    - project-owner-must-select-intended-tree-and-flower-widths
    - project-owner-must-confirm-whether-elevation-range-means-maximum-height-or-arithmetic-range

