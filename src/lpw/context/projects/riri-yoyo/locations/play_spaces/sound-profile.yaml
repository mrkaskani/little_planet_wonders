id: kindergarten-play-space-sound
type: location-sound-context
version: 1.1
name: Kindergarten Play Space Sound Profile

identity:
  location: kindergarten
  area: indoor-play-space
  category: location

  sonic_identity:
    primary:
      - soft-playroom-room-tone
      - gentle-child-play
      - cushioned-movement
      - quiet-toy-interactions

    secondary:
      - filtered-garden-birds
      - soft-fabric-contact
      - wooden-toy-clicks
      - book-and-shelf-interactions
      - subtle-playhouse-activity

  character:
    - cheerful
    - soft
    - playful
    - cozy
    - safe
    - warm
    - imaginative
    - relaxed
    - child-friendly

  intensity: low-medium

base_ambience:
  id: kindergarten-indoor-play-space

  layers:
    room_tone:
      type: warm-soft-playroom
      intensity: low
      persistence: continuous
      importance: high

    child_activity:
      type: gentle-preschool-play
      intensity: low
      persistence: conditional

    soft_materials:
      type: fabric-and-cushion-movement
      intensity: very-low
      persistence: intermittent

    toys:
      type: quiet-play-toy-activity
      intensity: very-low
      persistence: intermittent

    exterior_nature:
      type: filtered-sunny-garden
      intensity: very-low
      position: windows-left
      persistence: continuous

recurring_details:
  room_tone:
    enabled: true
    intensity: low
    spatial_width: medium-wide

  filtered_birds:
    enabled: true
    intensity: very-low
    position: windows-left

  filtered_foliage:
    enabled: true
    intensity: minimal
    position: windows-left

  cushion_movement:
    enabled: conditional
    intensity: very-low

  toy_activity:
    enabled: conditional
    intensity: low

  child_activity:
    enabled: conditional
    intensity: low

    characteristics:
      - gentle-laughter
      - soft-chatter
      - imaginative-play
      - quiet-reactions
      - small-footsteps

room_acoustics:
  room_size: medium-large

  character:
    - warm
    - soft
    - lightly-damped
    - intimate
    - non-reverberant

  reverberation:
    amount: very-low
    decay: short
    clarity: high

  absorption:
    large-rug: high
    beanbags: high
    cushions: high
    soft-seating: high
    curtains: medium
    toys-and-shelves: medium

  reflective_surfaces:
    wooden-floor: moderate
    windows: moderate
    walls: low-moderate

  rules:
    - preserve soft playroom acoustics
    - dialogue remains clear
    - avoid excessive room echo
    - soft furnishings should dampen movement sounds
    - room must feel occupied and comfortable rather than acoustically empty

windows:
  position: left
  default_state: closed

  exterior_transmission:
    birds:
      intensity: very-low

    foliage:
      intensity: minimal

    breeze:
      intensity: minimal

    garden_activity:
      intensity: very-low
      enabled: conditional

  open_state:
    ambience_change:
      birds: slightly-increased
      foliage: slightly-increased
      breeze: slightly-increased
      spatial_openness: increased

  interaction:
    open:
      sound:
        - soft-window-latch
        - gentle-window-movement
      intensity: low

    close:
      sound:
        - gentle-window-movement
        - soft-latch-click
      intensity: low

  rules:
    - exterior ambience stays filtered while windows are closed
    - exterior sounds remain anchored to the windows
    - transitions between open and closed states are gradual

play_areas:
  soft_seating_zone:
    elements:
      - padded-sofa
      - beanbags
      - round-cushions
      - soft-pillows

    movement:
      sit:
        sound: soft-cushion-compression
        intensity: very-low

      stand:
        sound: gentle-fabric-release
        intensity: very-low

      shift:
        sound: soft-fabric-rustle
        intensity: very-low

      jump_onto:
        sound: muffled-cushion-impact
        intensity: low

    rules:
      - impacts remain soft
      - no exaggerated bounce sounds
      - preserve lightweight child movement

  central_rug_zone:
    surface: thick-soft-rug

    footsteps:
      walk:
        intensity: minimal
        character: soft-muted-step

      run:
        intensity: low
        character: quick-muted-step

      jump:
        intensity: low
        character: soft-damped-landing

    toy_interaction:
      intensity: very-low

    rules:
      - rug strongly reduces hard impact sounds
      - footsteps remain soft
      - small toys produce damped contact

  playhouse_zone:
    structure:
      material:
        - painted-wood
        - padded-elements

    interactions:
      enter:
        sounds:
          - soft-footstep
          - subtle-frame-contact
        intensity: low

      exit:
        sounds:
          - soft-footstep
          - gentle-fabric-or-wood-contact
        intensity: low

      wall_touch:
        sound: subtle-painted-wood-contact
        intensity: very-low

      pretend_knock:
        sound: light-wood-knock
        intensity: low

    interior_acoustics:
      character:
        - slightly-enclosed
        - soft
        - intimate

      voice_effect:
        coloration: subtle
        reverb: very-low

    rules:
      - playhouse must not sound hollow or large
      - pretend interactions remain gentle
      - preserve child-scale materials

  shelf_play_zone:
    elements:
      - books
      - toy-baskets
      - stacking-toys
      - plush-toys
      - small-learning-objects

    intensity: low

  quiet_corner:
    purpose:
      - reading
      - resting
      - calm-play
      - observation

    ambience:
      child_activity: very-low
      toys: minimal
      exterior_birds: very-low

soft_furnishings:
  beanbags:
    interaction:
      sit:
        sound:
          - soft-fabric-compression
          - subtle-filling-shift

      move:
        sound:
          - gentle-fabric-drag
          - soft-filling-movement

    intensity: very-low

  cushions:
    interaction:
      pick_up:
        sound: soft-fabric-rustle

      place:
        sound: muffled-soft-contact

      drop:
        sound: soft-damped-impact

      squeeze:
        sound: subtle-fabric-compression

    intensity: very-low

  padded_sofa:
    interaction:
      sit:
        sound: soft-seat-compression

      climb:
        sound:
          - soft-fabric-contact
          - muffled-footstep

      shift:
        sound: subtle-upholstery-rustle

    intensity: very-low

toys:
  general:
    intensity: low

    material_types:
      - wood
      - soft-plastic
      - fabric
      - paper

  stacking_toys:
    interaction:
      pick_up:
        sound: small-object-contact

      stack:
        sound: gentle-toy-click

      separate:
        sound: soft-object-release

      fall:
        sound: small-lightweight-tumble

    rules:
      - falls remain lightweight
      - no heavy impacts

  wooden_toys:
    interaction:
      touch:
        sound: soft-wood-click

      place:
        sound: gentle-wood-contact

      drop_on_rug:
        sound: muted-wood-contact

      drop_on_floor:
        sound: light-wood-impact

  plush_toys:
    interaction:
      pick_up:
        sound: subtle-fabric-rustle

      place:
        sound: soft-contact

      squeeze:
        sound: minimal-fabric-compression

  toy_bins:
    interaction:
      search:
        sound: soft-toy-rummage

      move:
        sound: gentle-container-shift

      place:
        sound: subtle-bin-contact

  rules:
    - toy sounds occur only during visible or motivated interaction
    - avoid constant toy noise
    - preserve child-scale object weight
    - avoid exaggerated cartoon effects

books_and_shelves:
  books:
    interaction:
      remove:
        sound:
          - soft-book-slide
          - subtle-shelf-contact

      open:
        sound: soft-cover-open

      page_turn:
        sound: gentle-page-turn

      close:
        sound: soft-book-close

      replace:
        sound: gentle-book-on-shelf

  shelves:
    material: wood

    interaction:
      touch:
        sound: subtle-wood-contact

      toy_remove:
        sound: small-object-movement

      toy_replace:
        sound: gentle-object-placement

  intensity: low

plants:
  sound:
    primary: none

  interaction:
    touch:
      sound: very-soft-leaf-contact

    brush:
      sound: subtle-plant-rustle

  intensity: minimal

child_activity:
  default_state: calm-play

  quiet_play:
    sounds:
      - soft-chatter
      - gentle-toy-clicks
      - subtle-fabric-movement
      - quiet-laughter
      - small-footsteps

    intensity: low

  imaginative_play:
    sounds:
      - soft-spoken-play
      - gentle-laughter
      - playhouse-interactions
      - small-toy-movements

    intensity: low-medium

  group_play:
    sounds:
      - gentle-group-chatter
      - soft-laughter
      - quick-muted-footsteps
      - toy-interactions

    intensity: medium-low

  reading:
    sounds:
      - page-turns
      - subtle-body-movement
      - quiet-reactions

    intensity: very-low

  rest:
    sounds:
      - room-tone
      - filtered-birds
      - subtle-fabric-movement

    intensity: very-low

  rules:
    - preserve positive preschool energy
    - avoid continuous screaming
    - avoid chaotic overlapping voices
    - avoid aggressive shouting
    - background speech remains indistinct
    - children should sound physically small and lightweight
    - activity intensity must match visible number of children

floor:
  main_surface: wooden-floor
  secondary_surface: large-soft-rug

  wooden_floor:
    child_footsteps:
      walk:
        intensity: low
        character:
          - light
          - small
          - dry

      run:
        intensity: medium-low
        character:
          - quick
          - controlled
          - lightweight

      jump:
        intensity: low-medium
        character:
          - small
          - non-heavy

  rug:
    child_footsteps:
      walk:
        intensity: minimal

      run:
        intensity: low

      jump:
        intensity: low

    character:
      - soft
      - muted
      - damped

  rules:
    - detect visible walking surface
    - rug footsteps must sound softer than wooden-floor footsteps
    - avoid adult-scale heavy footsteps
    - avoid exaggerated impact sounds

interaction_sounds:
  cushion:
    sit:
      sound: soft-cushion-compression

    move:
      sound: gentle-fabric-rustle

    drop:
      sound: muffled-soft-impact

  beanbag:
    sit:
      sound:
        - soft-fabric-compression
        - subtle-filling-shift

    move:
      sound: gentle-beanbag-shift

  playhouse:
    enter:
      sound: soft-step-and-frame-contact

    knock:
      sound: light-wood-knock

  toy:
    pick_up:
      sound: small-object-contact

    place:
      sound: gentle-object-placement

    drop:
      sound: lightweight-toy-impact

  book:
    remove:
      sound: soft-book-slide

    page_turn:
      sound: gentle-page-turn

  shelf:
    interaction:
      sound: subtle-wood-contact

  footsteps:
    wood:
      sound: light-child-footstep

    rug:
      sound: muted-child-footstep

  rules:
    - sounds require physical motivation
    - material identity must remain consistent
    - interaction volume follows camera distance
    - avoid unnecessary Foley
    - story-relevant actions may receive temporary emphasis

fixed_sources:
  windows:
    id: play-space-windows
    position: left

    sound:
      type: filtered-sunny-exterior
      intensity: very-low

    continuity:
      continuous: true

  central_rug:
    id: play-space-rug
    position: center

    sound:
      primary: none

    interaction:
      - muted-footsteps
      - cushioned-toy-contact

  playhouse:
    id: kindergarten-playhouse
    position: center-right

    sound:
      primary: none

    interaction:
      - playhouse-entry
      - wood-contact
      - pretend-knocking

  soft_seating:
    id: play-space-soft-seating
    position:
      - left
      - foreground
      - right

    sound:
      primary: none

    interaction:
      - cushion-compression
      - fabric-rustle
      - beanbag-movement

  storage_shelves:
    id: play-space-storage
    position:
      - left
      - back
      - right

    sound:
      primary: none

    interaction:
      - books
      - toys
      - storage-bins

spatial_audio:
  enabled: true

  listener_reference: camera

  sources:
    windows:
      position: left
      sound:
        - filtered-birds
        - filtered-foliage
        - subtle-breeze

    soft_seating:
      position:
        - foreground-left
        - foreground-right
      sound:
        - cushion-movement
        - fabric-rustle

    central_rug:
      position: center
      sound:
        - muted-footsteps
        - toy-interactions

    playhouse:
      position: center-right
      sound:
        - pretend-play
        - wooden-structure-contact

    shelves:
      position:
        - left
        - back
        - right
      sound:
        - book-interaction
        - toy-storage-interaction

  rules:
    - preserve physical source positions
    - camera movement changes listening perspective
    - window ambience remains anchored to windows
    - moving characters carry their own sound sources
    - fixed objects must not shift sonically between shots

camera_audio_behavior:
  establishing_wide:
    ambience_width: wide

    emphasis:
      room_tone: normal
      child_activity: normal
      exterior: subtle

    detail_sfx: reduced

  medium:
    ambience_width: medium

    nearby_play_activity: normal
    environmental_detail: normal

  play_activity:
    ambience_width: medium

    emphasis:
      toys: increased
      fabric: increased
      footsteps: increased

  close_up:
    ambience_width: reduced

    emphasis:
      nearby-toy: increased
      hand-interaction: increased
      cushion-contact: increased

    background_children: reduced

  emotional_close_up:
    ambience_width: reduced
    background_activity: reduced
    room_tone: preserved
    filtered-birds: minimal

  playhouse_interior:
    ambience_width: narrow

    room_character:
      enclosed: slight
      exterior_reduction: moderate
      voices: slightly-close

  rules:
    - maintain continuous underlying ambience
    - never restart ambience after cuts
    - foreground details follow camera proximity
    - distant play remains softer than nearby play

dialogue:
  priority: highest

  ambience_behavior:
    during_dialogue:
      volume: low-beneath-dialogue

      reduction:
        children: moderate
        toys: moderate
        fabric: slight
        footsteps: moderate
        exterior_birds: slight
        room_tone: minimal

    between_dialogue:
      volume: normal-low

  background_voice:
    clarity: indistinct
    intensity: very-low-low

  rules:
    - foreground dialogue remains fully intelligible
    - background children must not compete with scripted dialogue
    - maintain play-space identity beneath dialogue
    - reduce repetitive toy activity around important speech
    - restore ambience smoothly after speech

music_relationship:
  music_profile: kindergarten-music

  priority:
    - dialogue
    - important-story-sfx
    - character-action
    - play-interactions
    - location-ambience
    - music

  rules:
    - preserve gentle playroom ambience beneath music
    - music must not mask dialogue
    - music must not mask important toy or movement actions
    - avoid excessive high-frequency competition between toys and music
    - preserve warm imaginative character

states:
  empty:
    id: kindergarten-play-space-empty

    layers:
      room_tone: low
      filtered-birds: very-low
      filtered-foliage: minimal

  default:
    id: kindergarten-play-space-default

    layers:
      room_tone: low
      child_activity: low
      toys: very-low
      fabric: very-low
      filtered-birds: very-low

  quiet_play:
    id: kindergarten-play-space-quiet-play

    layers:
      room_tone: low
      child_activity: very-low

    details:
      toys: low
      books: very-low
      cushion_movement: very-low

  imaginative_play:
    id: kindergarten-play-space-imaginative-play

    layers:
      room_tone: low
      child_activity: low

    details:
      playhouse: low
      toys: low
      soft_laughter: low

  active_play:
    id: kindergarten-play-space-active-play

    layers:
      room_tone: low
      child_activity: low-medium

    details:
      footsteps: low
      cushions: low
      toys: low
      laughter: low

  reading:
    id: kindergarten-play-space-reading

    layers:
      room_tone: low
      child_activity: minimal
      filtered-birds: very-low

    details:
      books: low
      fabric: very-low

  rest:
    id: kindergarten-play-space-rest

    layers:
      room_tone: low
      filtered-birds: very-low
      child_activity: none

    details:
      cushion_movement: minimal

  dialogue:
    id: kindergarten-play-space-dialogue

    layers:
      room_tone: low
      child_activity: very-low
      toys: minimal
      filtered-birds: minimal

  arrival:
    id: kindergarten-play-space-arrival

    temporary_sources:
      - footsteps
      - door
      - child-movement

  departure:
    id: kindergarten-play-space-departure

    temporary_sources:
      - footsteps
      - door

transitions:
  entering_play_space:
    behavior:
      - introduce-soft-room-tone
      - reduce-neighboring-room-ambience
      - introduce-filtered-window-nature
      - introduce-play-activity-if-occupied
      - gradually-reveal-soft-material-details

  leaving_play_space:
    behavior:
      - reduce-playroom-activity
      - preserve-room-tone-through-door
      - transition-to-connected-location-profile

  approaching_playhouse:
    behavior:
      - slightly-increase-playhouse-interactions
      - reduce-distant-play-detail

  entering_playhouse:
    behavior:
      - narrow-spatial-width
      - slightly-filter-room-ambience
      - emphasize-nearby-voice-and-contact
      - preserve-main-room-presence-outside

  exiting_playhouse:
    behavior:
      - restore-full-room-width
      - restore-general-play-ambience

  approaching_windows:
    behavior:
      - slightly-increase-birds
      - slightly-increase-foliage
      - increase-exterior-spatial-definition

  shot_cut:
    behavior:
      ambience: continuous
      environment_state: preserved

    rules:
      - preserve room tone
      - preserve active play state
      - preserve exterior ambience timing
      - do not restart child activity patterns

continuity:
  preserve_across_visual_cuts: true
  do_not_restart_on_each_shot: true

  continuous_layers:
    - room-tone
    - filtered-exterior

  conditional_continuous_layers:
    - child-play
    - general-toy-activity

  preserve_state:
    - occupancy
    - play-mode
    - window-state
    - child-positions
    - toy-positions
    - cushion-positions
    - playhouse-occupancy
    - active-interactions
    - exterior-weather-state

  rules:
    - ambience belongs to scene timeline
    - visual cuts do not reset play activity
    - toys must retain material identity
    - active object interactions continue logically across cuts
    - exterior ambience remains consistent with sunny kindergarten exterior
    - activity changes require visible or narrative motivation

event_memory:
  track:
    - current-play-state
    - playhouse-occupancy
    - active-toys
    - toy-positions
    - cushion-positions
    - beanbag-positions
    - moved-books
    - window-state
    - temporary-sound-events

  examples:
    playhouse:
      states:
        - empty
        - occupied
        - active-play

    play_space:
      states:
        - empty
        - quiet-play
        - imaginative-play
        - active-play
        - reading
        - rest
        - dialogue

priority_system:
  level_1:
    category: dialogue

  level_2:
    category: narrative-action

    examples:
      - important-toy-interaction
      - story-object
      - playhouse-action

  level_3:
    category: character-action

    examples:
      - footsteps
      - jumping
      - cushion-movement
      - toy-use

  level_4:
    category: play-space-identity

    examples:
      - child-play
      - soft-furnishing-movement
      - toy-textures

  level_5:
    category: environmental-background

    examples:
      - room-tone
      - filtered-birds
      - filtered-foliage

  level_6:
    category: music

volume:
  overall: low-beneath-dialogue

  relative_levels:
    dialogue:
      level: foreground

    narrative_sfx:
      level: foreground-support

    character_actions:
      level: foreground-support

    nearby_play:
      level: background-support

    general_child_activity:
      level: background

    toys:
      level: background

    fabric:
      level: subtle-background

    room_tone:
      level: background

    exterior_birds:
      level: distant-background

forbidden:
  children:
    - prolonged-screaming
    - chaotic-yelling
    - aggressive-shouting
    - panic
    - bullying
    - frightening-crying

  play:
    - violent-toy-impacts
    - destructive-play
    - heavy-furniture-impacts
    - aggressive-running
    - excessive-object-crashes

  environment:
    - harsh-room-echo
    - heavy-mechanical-hum
    - harsh-electrical-buzz
    - loud-air-conditioning
    - construction-noise

  exterior:
    - heavy-traffic
    - aggressive-horns
    - sirens
    - thunder
    - storms
    - violent-wind

  emotional:
    - horror-drones
    - ominous-rumbles
    - jump-scare-effects
    - threatening-effects
    - suspense-stingers

negative_constraints:
  - no harsh alarms
  - no chaotic screaming
  - no aggressive shouting
  - no violent play sounds
  - no heavy footsteps
  - no exaggerated toy impacts
  - no excessive room echo
  - no loud mechanical hum
  - no unnecessary Foley
  - no horror ambience
  - no ominous drones
  - no storm ambience
  - no heavy traffic
  - no unnecessary cinematic impacts
  - no sudden ambience resets
  - no sound contradicting sunny daytime conditions
  - no background activity masking dialogue

generation:
  essential_prompt_tokens:
    - warm kindergarten indoor play space
    - cozy preschool playroom ambience
    - soft child play
    - gentle imaginative activity
    - soft cushions and beanbag movement
    - quiet wooden and soft toy interactions
    - muted footsteps on thick rug
    - light footsteps on wooden floor
    - gentle playhouse activity
    - subtle filtered garden birds
    - warm soft interior acoustics
    - calm cheerful preschool environment
    - ages 3 to 6
    - dialogue-friendly
    - continuous ambience

  negative_prompt_tokens:
    - screaming children
    - chaotic classroom
    - heavy running
    - harsh toy impacts
    - loud furniture scraping
    - alarms
    - storm
    - thunder
    - heavy traffic
    - horror ambience
    - ominous drone
    - exaggerated cartoon effects
    - cinematic impacts

  preserve_between_generations:
    - room-tone-character
    - soft-acoustic-character
    - play-activity-level
    - toy-material-character
    - cushion-and-fabric-character
    - filtered-exterior-character
    - overall-volume
    - spatial-source-layout

  variation_allowed:
    - individual-toy-clicks
    - subtle-cushion-movement
    - quiet-child-reactions
    - individual-page-turns
    - soft-footstep-patterns
    - individual-bird-chirps
    - small-playroom-textures

stems:
  preferred: true

  tracks:
    - room-tone
    - filtered-exterior
    - background-children
    - footsteps
    - cushions-and-fabric
    - toys
    - books-and-shelves
    - playhouse
    - interaction-sfx
    - full-ambience-mix

  purpose:
    - dialogue-mixing
    - play-state-control
    - adaptive-level-control
    - spatial-repositioning
    - shot-continuity
    - scene-extension
    - close-up-detail-control

validation:
  environment_checks:
    - room sounds soft and acoustically damped
    - soft furnishings reduce movement impacts
    - exterior sounds remain filtered through windows
    - toy materials sound lightweight and child-sized
    - playhouse sounds remain small and intimate

  continuity_checks:
    - ambience does not restart after cuts
    - play-state remains consistent
    - toy positions and interactions remain logically continuous
    - exterior ambience remains stable
    - character movement remains spatially consistent

  dialogue_checks:
    - foreground speech remains intelligible
    - background children remain indistinct
    - toy activity does not mask dialogue
    - repetitive play sounds reduce during important dialogue

  activity_checks:
    - footsteps match floor surface
    - rug footsteps remain softer than wooden-floor footsteps
    - cushion sounds correspond to physical contact
    - toy sounds occur only during interaction
    - playhouse acoustics activate only when spatially appropriate

  emotional_checks:
    - environment remains cheerful
    - environment remains safe
    - environment remains cozy
    - environment remains playful
    - no unintended fear is introduced
    - no unintended suspense is introduced

  preschool_checks:
    - soundscape remains appropriate for ages 3-6
    - sudden loud sounds are minimized
    - activity remains energetic without becoming chaotic
    - individual sounds remain gentle
    - soundscape avoids overstimulation
    - imaginative-play atmosphere remains warm and inviting

context_dependencies:
  location:
    source: location.yaml

  kindergarten_interior:
    source: ../interiors/location.yaml

  kindergarten_exterior:
