    action_blocking_and-zone_selection: zones_and_interaction_context
    material_prompting: materials_and_surfaces
    lighting_and_palette_prompting: lighting_and_color
  safe_prompt_context_fragment: >-
    Cozy pastel-pink kindergarten indoor play space with one small rounded wood
    playhouse, one centered soft pink round rug, broad pastel floor cushions,
    warm low wooden shelving and storage bins, one large daylight window with
    mint curtains, soft seating, plants, simple fixed wall decorations, and a
    clear circulation loop around the open play zone.
  generation_constraints:
    - exact-one-playhouse-one-window-one-door-and-one-centered-round-rug
    - do-not-add-remove-duplicate-or-relocate-anchor-objects
    - keep-object-colors-materials-positions-and-quantities-consistent
