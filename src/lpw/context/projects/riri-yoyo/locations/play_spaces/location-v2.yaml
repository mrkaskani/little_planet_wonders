measurement_reconciliation:
  status: required-before-v2-promotion
  stable_consensus_values:
    room_depth: 0.82
    ceiling_height: 0.40
    door_height: 0.30
    playhouse_width: 0.28
    playhouse_height: 0.24
    low_shelf_height: 0.12
    round_cushion_or_pouf_diameter: 0.12
  likely_normalized_value_pending-human-confirmation:
    room_width: 1.00
    reason: four-boards-normalize-to-1-point-00-while-board-c-prints-0-point-80
  unresolved_values:
    window_width: [0.34, 0.56]
    window_height: [0.28, 0.36, 0.48]
    door_width: [0.16, 0.18]
    playhouse_depth: [0.18, 0.20]
    shelf_height_semantics: [generic-0.22, low-0.12, tall-0.18]
    rug_diameter: [0.60, 0.70, 0.74, 0.76, 0.78]
    cushion_or_pouf_height: [0.04, 0.05]
  rules:
    - do-not-average-conflicting-values
    - do-not-use-unresolved-values-in-generation-prompts-or-layout-solvers
    - preserve-each-board-table-verbatim-for-review-traceability
    - project-owner-must-select-one-reconciled-value-per-unresolved-field

layout_reconciliation:
  status: required-before-v2-promotion
  stable_consensus:
    - one-centered-round-rug
    - one-playhouse
    - one-large-window
    - one-entry-door
    - perimeter-wood-shelving-and-storage
    - soft-seating-near-window-side
    - open-circulation-around-centered-rug
  conflicts_or_ambiguities:
    - wall-names-and-front-back-left-right-orientation-vary-between-boards
    - board-b-adds-a-round-activity-table-near-the-rear-center-while-other-boards-show-open-rug-space
    - board-b-shows-hanging-lanterns-while-other-boards-emphasize-ceiling-fan-and-recessed-lights
    - some-elevation-diagrams-visually-suggest-more-than-one-door-despite-one-door-quantity-notes
    - playhouse-wall-is-called-right-of-window-front-or-back-across-different-boards
  rules:
    - use-v1-primary-master-for-current-canonical-world-orientation
    - do-not-add-the-activity-table-or-hanging-lanterns-to-v2-without-explicit-selection
    - do-not-mirror-or-relocate-fixed-anchors-based-on-an-unreconciled-board

