camera_and_composition:
  reference_view_types:
    primary_establishing:
      framing: wide-eye-level-room-view
      must_show: [large-window, playhouse, centered-rug, soft-seating, perimeter-storage]
      use: establish-room-geography-and-welcoming-play-mood
    opposite_facing:
      framing: wide-reverse-view
      must_show: [door-or-entry-side, centered-rug, storage, circulation-space]
      use: reverse-coverage-after-orientation-is-reconciled
    corner_to_corner:
      framing: diagonal-wide
      must_show: [rug-footprint, anchor-separation, room-depth]
      use: parallax-and-anchor-continuity
    left_and_right_side_views:
      framing: side-wide
      must_show: [perimeter-storage, open-rug-edge, soft-seating-or-playhouse-context]
      use: zone-coverage-without-relocating-anchors
    elevated_overview:
      framing: high-angle-wide
      must_show: [centered-rug, circulation-loop, perimeter-equipment]
      use: spatial-validation-and-blocking
    orthographic_elevations_and_floor_plan:
      framing: straight-on-or-overhead-technical
      use: design-validation-only-not-emotional-story-shots
  composition_rules:
    - keep-the-rug-and-circulation-loop-readable-in-wide-shots
    - preserve-visual-separation-between-playhouse-door-and-rug
