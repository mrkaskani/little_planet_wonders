  retrieval_key: kindergarten-play-space-v002
  package_status: complete-candidate-with-unresolved-cross-board-conflicts
  preferred_authority_order:
    - location-v2.yaml-for-v002-structured-review-context
    - location.yaml-for-current-canonical-location-policy
