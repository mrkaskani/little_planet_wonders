    - energy-adjustment
    - toy-interaction-editing
    - motif-reuse
    - classroom-play-space-transition

adaptive_music:

  enabled: true

  editable_layers:
    - melody
    - harmony
    - rhythm
    - texture
    - instrumentation-density
    - play-intensity

  priority_order_when_reducing:
    - remove-secondary-instruments
    - remove-hand-percussion
    - remove-bells
    - reduce-pizzicato
    - reduce-marimba
    - reduce-flute
    - reduce-clarinet
    - simplify-ukulele
    - simplify-piano

  priority_order_when-building:
    - piano
    - ukulele
    - clarinet
    - marimba
    - pizzicato-strings
    - flute
    - optional-hand-percussion
    - optional-bells

validation:

  emotional_checks:
    - music feels playful
    - music feels warm
    - music feels safe
    - music encourages imagination
    - friendship remains central
    - energy remains controlled
    - music does not become overstimulating
    - no unintended suspense is present

  location_checks:
    - music feels appropriate for an indoor preschool play space
    - music reflects the soft pastel environment
    - musical articulation feels rounded and comfortable
    - playhouse and toy interactions feel supported
    - location remains distinguishable from the main classroom
    - location remains connected to kindergarten interior identity

  dialogue_checks:
    - children's voices remain intelligible
    - music reduces beneath dialogue
    - clarinet does not compete with speech
    - bells remain absent beneath important dialogue
    - marimba activity reduces during group conversation
    - percussion remains minimal beneath speech

  ambience_checks:
    - toy interaction remains audible
    - children's movement remains audible
    - room tone remains recognizable
    - soft outdoor ambience may remain audible
    - music does not mask physical play sounds

  continuity_checks:
    - play-space motif remains recognizable
    - parent interior motif relationship remains recognizable
    - root kindergarten identity remains recognizable
    - instrumentation remains consistent
    - energy transitions remain gradual
    - music remains appropriate for ages 3-6

context_dependencies:

  location:
    source: location.yaml

  parent_location:
    source: ../interiors/location.yaml

  root_location:
    source: ../exteriors/location.yaml

  parent_music:
    source: ../interiors/music-profile.yaml

  root_music:
    source: ../exteriors/music-profile.yaml

  location_audio:
    source: location.yaml#audio

  color_palette:
    source: ../../visual_style/palette-v2.yaml

  characters:
    source: ../../02-characters/

  scene:
    source: ../../03-scenes/

  cinematography:
    source: ../../cinematography/

  continuity:
    source: ../../continuity/

  editing:
    source: ../../editing/

