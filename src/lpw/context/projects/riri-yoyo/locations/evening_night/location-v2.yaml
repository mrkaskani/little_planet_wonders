mcp_context:
  resource_uri: cinema://projects/riri-yoyo/locations/kindergarten-evening-night-location-v2
  retrieval_scope: canonical-location-v2-design-review-context
  summary: >-
    Approved canonical deep-night location package showing one compact two-story
    storybook stone cottage centered in a fenced flower garden, with a steep
    blue-gray gabled roof, chimney, warm arched entry and windows, curved
    flagstone path, four principal tree zones, crescent moon, cool ambient fill,
    and fixed warm practical light. It replaces the former V1 modern
    kindergarten-evening-night geometry under the same location ID.
  use_for:
    - approved-location-design-review
    - relative-scale-and-site-layout-retrieval
    - camera-and-material-planning
    - night-lighting-and-exposure-planning
    - child-safety-and-path-readability-review
    - continuity-prompt-authoring
  do_not_use_for:
    - direct-i2v-ti2v-image-or-s2v-conditioning
    - claiming-v2-is-only-a-lighting-variant-of-v1
    - inventing-a-distinct-evening-or-twilight-state
    - generating-production-shots-before-clean-frame-approval
  concise_prompt_fragments:
    identity: >-
      One compact two-story storybook stone cottage in a fenced flower garden,
      steep blue-gray gabled roof, one stone chimney, rough limestone walls,
      warm arched wood entry, covered porch, curved flagstone path, four framing
      tree zones, premium soft stylized 3D preschool animation.
    night_lighting: >-
      Calm deep-cobalt night with a small crescent moon and soft clouds, cool
      readable ambient fill, localized 2700K-style warm window and porch glow,
      gentle long shadows, safe readable path, steps, fence, and garden.
