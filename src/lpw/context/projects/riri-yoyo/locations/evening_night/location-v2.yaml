    edge_light: subtle-window-and-practical-rake-on-nearby-stone-wood-and-plants
    highlight_rule: warm-practicals-may-lead-but-must-not-clip-or-bloom-away-detail
    dark_value_rule: preserve-readable-path-fence-planting-and-building-silhouette
    prohibited:
