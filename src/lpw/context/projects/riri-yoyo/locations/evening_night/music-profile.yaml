transitions:

  sunset_to_night:
    behavior:
      - reduce-tempo-gradually
      - remove-active-percussion
      - reduce-acoustic-guitar-rhythm
      - increase-piano-space
      - introduce-celesta-sparingly
      - soften-strings
      - increase-nighttime-ambience
      - transition-sunset-motif-into-nighttime-motif
      - preserve-active-location-motif

  daytime_location_to_nighttime_version:
    behavior:
      - preserve-location-melody
      - reduce-rhythmic-density
      - reduce-arrangement-density
      - soften-instrument-attacks
      - replace-bright-percussion-with-soft-piano-or-celesta
      - lower-energy-without-darkening-emotion
      - retain-recognizable-location-identity

  active_to_quiet:
    behavior:
      - remove-percussion
      - reduce-rhythm
      - simplify-melody
      - increase-silence
      - transition-to-piano-led-texture

  outdoor_to_home:
    behavior:
      - preserve-nighttime-motif
      - reduce-wide-ambient-space-gradually
      - increase-warm-piano
      - introduce-clarinet
      - reduce-celesta
      - emphasize-comfort-and-security

  walking_to_rest:
    behavior:
      - remove-marimba
      - simplify-guitar
      - slow-tempo
      - increase-piano-space
      - allow-ambience-to-lead

  dialogue_to_stars:
    behavior:
      - restore-celesta-sparingly
      - widen-strings
      - introduce-short-nighttime-motif
      - maintain-low-dynamics

  stars_to_dialogue:
    behavior:
      - remove-celesta
      - reduce-strings
      - retain-soft-piano
      - prioritize-dialogue

  night_to_bedtime:
    behavior:
      - reduce-melodic-density
      - remove-rhythm
      - soften-harmony
      - reduce-celesta
      - retain-piano-and-soft-strings
      - increase-room-or-night-ambience

continuity_constraints:

  identity:
    - preserve nighttime calm
    - preserve emotional safety
    - preserve gentle wonder
    - preserve reassurance
    - preserve starlight motif

  relationship_to_location:
    - nighttime profile modifies existing location music
    - permanent location musical identity remains recognizable
    - permanent location motif remains authoritative
    - nighttime motif acts as a time-of-day layer
    - instrumentation may adapt to active location
    - rhythm becomes softer
    - arrangement becomes more spacious
    - darkness never changes location into a threatening place

  relationship_to_sunset:
    - night follows sunset naturally
    - sunset warmth continues into nighttime safety
    - sunset flute identity may transition into celesta
    - rhythmic energy decreases
    - ambience becomes more prominent
    - emotional continuity remains positive

  instrumentation:
    - piano remains primary nighttime harmonic foundation
    - celesta remains nighttime accent rather than continuous texture
    - clarinet provides warm intimate color
    - strings remain soft and distant
    - flute remains secondary
    - percussion remains nearly absent

  energy:
    - baseline energy remains very-low
    - no high-energy nighttime states
    - walking states may briefly reach low
    - energy decreases toward bedtime
    - transitions remain gradual

  environment:
    - preserve insects
    - preserve breeze
    - preserve leaves
    - preserve warm-house sounds when appropriate
    - preserve nighttime environmental identity
    - avoid excessive silence

  emotional:
    - darkness remains safe
    - nighttime remains comforting
    - solitude feels peaceful rather than lonely
    - stars create wonder rather than mystery
    - quiet does not become sadness
    - rest does not imply emotional disengagement
    - home remains warm and secure

  mixing:
    - dialogue always has priority
    - ambience becomes increasingly important
    - music remains sparse
    - music remains background-supportive
    - avoid dense orchestration

