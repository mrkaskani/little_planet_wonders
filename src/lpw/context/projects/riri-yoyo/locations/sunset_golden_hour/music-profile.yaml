    - reduce-flute
    - reduce-strings
    - simplify-guitar
    - simplify-piano

  priority_order_when-building:
    - piano
    - acoustic-guitar
    - flute
    - soft-strings
    - clarinet
    - optional-marimba
    - optional-harp
    - optional-bells

  sunset_progression:

    early:
      energy: low-medium
      rhythm: gentle
      melodic_activity: moderate
      ambience: daytime-evening-mix

    middle:
      energy: low
      rhythm: reduced
      melodic_activity: low
      ambience: increasingly-prominent

    late:
      energy: very-low
      rhythm: minimal
      melodic_activity: sparse
      ambience: evening-leading

validation:

  emotional_checks:
    - music feels warm
    - music feels peaceful
    - music feels reassuring
    - reflection does not become sadness
    - sunset feels safe
    - completion feels positive
    - music remains emotionally appropriate for ages 3-6
    - no unintended suspense is present

  visual_checks:
    - music reflects golden sunlight
    - music reflects orange and pink skies
    - music supports wide scenic landscapes
    - music feels appropriate for distant mountains
    - music supports countryside and flower-field imagery
    - musical energy matches the quieter end-of-day atmosphere

  dialogue_checks:
    - dialogue remains clearly intelligible
    - flute reduces beneath speech
    - strings remain background-only
    - guitar does not compete with speech
    - bells remain absent beneath important dialogue
    - piano remains sparse during emotional lines

  ambience_checks:
    - breeze remains audible
    - birds remain audible when present
    - evening insects remain audible when present
    - footsteps remain readable
    - music does not mask environmental identity
    - ambience may lead during quiet scenic moments

  continuity_checks:
    - sunset motif remains recognizable
    - underlying location identity remains recognizable
    - instrumentation remains warm and acoustic
    - energy decreases gradually
    - transitions remain smooth
    - sunset does not become sad or ominous
    - music remains appropriate for ages 3-6

