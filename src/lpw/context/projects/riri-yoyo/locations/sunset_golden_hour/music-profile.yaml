    setting_sun:
      musical_quality:
        - gently-descending-melody
        - resolved-harmony
        - reduced-rhythm
        - increased-space

transitions:

  daytime_to_golden_hour:
    behavior:
      - reduce-rhythmic-density-gradually
      - soften-percussion
      - warm-harmonic-voicing
      - introduce-acoustic-guitar-or-piano
      - reduce-bright-high-frequency-elements
      - introduce-sunset-motif-subtly
      - preserve-location-motif

  active_play_to_sunset:
    behavior:
      - reduce-tempo-gradually
      - remove-active-percussion
      - simplify-melody
      - transition-to-acoustic-textures
      - increase-musical-space
      - maintain-positive-energy

  exploration_to_reflection:
    behavior:
      - reduce-marimba
      - reduce-guitar-motion
      - shift-to-piano
      - introduce-soft-strings
      - increase-phrase-spacing

  dialogue_to_scenic_view:
    behavior:
      - restore-flute-gently
      - widen-strings-slightly
      - introduce-open-piano-voicing
      - avoid-large-dynamic-change

  scenic_view_to_dialogue:
    behavior:
      - reduce-flute
      - narrow-arrangement
      - soften-strings
      - preserve-piano-or-guitar
      - prioritize-speech

  walking_to_rest:
    behavior:
      - reduce-marimba
      - simplify-guitar
      - lower-tempo-gradually
      - increase-piano-space
      - allow-ambience-to-emerge

  sunset_to_evening:
    behavior:
      - reduce-melodic-density
      - remove-rhythmic-textures
      - simplify-harmony
      - reduce-flute
      - preserve-piano-and-soft-strings
      - increase-evening-ambience
      - resolve-sunset-motif

  sunset_to_episode_end:
    behavior:
      - state-location-or-character-theme-softly
      - transition-into-sunset-motif
      - resolve-harmony
      - reduce-arrangement
      - leave-environmental-tail

continuity_constraints:

  identity:
    - preserve warmth
    - preserve peaceful completion
    - preserve gentle wonder
    - preserve reassurance
    - preserve sunset motif

  relationship_to_location:
    - golden-hour profile modifies existing location music
    - location musical identity remains recognizable
    - sunset should not replace permanent location motifs
    - instrumentation may adapt to location context
    - emotional warmth becomes more prominent
    - rhythmic energy becomes softer

  instrumentation:
    - piano remains primary reflective instrument
    - acoustic guitar provides organic warmth
    - flute carries sunset melodic identity
    - strings provide width only
    - bells remain rare
    - percussion remains minimal

  energy:
    - baseline energy remains low
    - energy generally decreases through sunset
    - scenic reveals may rise briefly to low-medium
    - no high-energy states
    - changes remain gradual

  environment:
    - preserve evening breeze
    - preserve natural ambience
    - preserve footsteps when relevant
    - allow daytime sounds to become progressively quieter
    - introduce evening insects naturally when appropriate

  emotional:
    - sunset remains positive
    - reflection does not become sadness
    - completion does not imply loss
    - homecoming feels safe
    - quiet moments remain emotionally engaging
    - warmth remains central

  mixing:
    - dialogue always has priority
    - environmental ambience remains audible
    - music remains background-supportive
    - arrangement remains transparent
    - avoid excessive emotional scoring

negative_constraints:

  emotion:
    - no horror
    - no fear
    - no threat
    - no suspense
    - no tragedy
    - no grief-heavy-tone
    - no loneliness-heavy-tone
    - no dark-melancholy
    - no permanent-farewell-feeling
    - no emotional-manipulation
    - no heroic-epic-feeling

  instrumentation:
    - no heavy-brass
    - no aggressive-strings
    - no heavy-drums
    - no distorted-synths
    - no threatening-drones
    - no industrial-impacts
    - no horror-textures
    - no piercing-bells
    - no aggressive-electric-guitar
    - no harsh-metallic-percussion

  rhythm:
    - no fast-percussion
    - no aggressive-pulse
    - no tension-ostinato
    - no driving-beat
    - no complex-syncopation
    - no frantic-patterns
    - no dense-percussion

  harmony:
    - no dark-unresolved-harmony
    - no horror-dissonance
    - no strong-chromatic-tension
    - no ominous-low-pedal
    - no tragic-minor-cadence
    - no dramatic-modulation

  melody:
    - no tragic-melody
    - no overly-sentimental-melody
    - no extreme-register-jumps
    - no threatening-motif
    - no frantic-runs
    - no melodramatic-lines

  dynamics:
    - no sudden-loud-accents
    - no dramatic-crescendos
    - no jump-scare-dynamics
    - no extreme-volume-contrast
    - no oversized-emotional-swell

