        - warm-piano
        - acoustic-guitar
        - rounded-midrange

    pink_clouds:
      musical_quality:
        - soft-flute
        - gentle-strings
        - airy-texture

    distant_mountains:
      musical_quality:
        - wide-harmonic-spacing
        - soft-strings
        - long-musical-breathing-space

    valley:
      musical_quality:
        - flowing-harmony
        - open-acoustic-texture
        - gentle-forward-motion

    countryside:
      musical_quality:
        - acoustic-guitar
        - flute
        - wooden-textures
        - simple-pastoral-harmony

    flower_fields:
      musical_quality:
        - delicate-flute-details
        - soft-piano-notes
