id: sunset-golden-hour-music
type: location-music-context
version: 1.1
name: Sunset Golden Hour Music Profile

identity:
  location: sunset-golden-hour

  theme:
    - warmth
    - peaceful completion
    - gentle wonder
    - reflection
    - reassurance
    - togetherness
    - quiet discovery

  emotional_identity:
    primary:
      - warm
      - peaceful
      - reassuring
      - beautiful
      - reflective
      - hopeful

    secondary:
      - gentle
      - comforting
      - spacious
      - affectionate
      - calm
      - wondrous
      - content
      - nostalgic-light

  energy: low

  purpose:
    - establish golden-hour atmosphere
    - support peaceful scene endings
    - support emotional resolution
    - create a sense of warmth and safety
    - support friendship and togetherness
    - allow characters to reflect on discoveries
    - support slow walking and returning-home scenes
    - transition active scenes toward rest
    - reinforce visual warmth without becoming sentimental
    - create recognizable sunset musical identity

musical_character:

  style:
    - gentle children's cinematic
    - warm acoustic
    - pastoral
    - light orchestral
    - soft storybook
    - preschool-friendly

  tone:
    warmth: very-high
    softness: very-high
    playfulness: low
    curiosity: low-medium
    spaciousness: high
    wonder: medium-high
    tenderness: high
    reflection: high
    reassurance: very-high
    brightness: medium
    mystery: very-low
    tension: very-low

  emotional_direction:
    default: warm-reflective-reassurance

  avoid_emotional_direction:
    - sadness-heavy
    - loneliness
    - fear
    - danger
    - suspense
    - melancholy-heavy
    - dramatic-finality
    - heroic-epic
    - threatening
    - tragic

instrumentation:

  primary:

    soft_piano:
      role:
        - harmonic-foundation
        - emotional-support
        - reflective-melody
        - gentle-resolution

      playing_style:
        - warm
        - sparse
        - soft
        - flowing
        - rounded
        - spacious

      register: mid
      intensity: low

    acoustic_guitar:
      role:
        - organic-warmth
        - walking-support
        - countryside-character
        - gentle-rhythm

      playing_style:
        - fingerpicked
        - softly-plucked
        - light-strumming
        - relaxed

      register: mid
      intensity: low

    gentle_flute:
      role:
        - sunset-motif
        - scenic-melody
        - gentle-wonder
        - emotional-lift

      playing_style:
        - airy
        - lyrical
        - soft
        - sustained-short-phrases

      register: mid-high
      intensity: very-low

    soft_strings:
      role:
        - warmth
        - landscape-width
        - emotional-resolution
        - sunset-glow

      playing_style:
        - sustained
        - soft
        - legato
        - transparent

      intensity: very-low

  secondary:

    gentle_clarinet:
      allowed: true

      role:
        - warm-secondary-melody
        - friendship-support
        - intimate-character-moment

      intensity: very-low

      rules:
        - use short rounded phrases
        - remain beneath primary melody
        - avoid low somber register

    muted_marimba:
      allowed: limited

      role:
        - gentle-walking-pulse
        - transition-from-active-scenes
        - subtle-forward-motion

      intensity: very-low

      rules:
        - use sparse notes
        - soften rhythm progressively
        - avoid playful bouncing patterns during reflective moments

    harp:
      allowed: limited

      role:
        - sunset-transition
        - scenic-reveal
        - gentle-light-accent

      intensity: very-low

      rules:
        - use simple broken chords
        - avoid fantasy-heavy gestures
        - avoid large glissandos
        - remain subtle

    soft_bells:
      allowed: limited

      possible_sources:
        - celesta
        - soft-glockenspiel
        - gentle-chime

      role:
        - final-discovery-accent
        - emotional-resolution
        - sunlight-accent

      intensity: very-low

      rules:
        - use isolated notes
        - avoid repetitive sparkle
        - avoid piercing frequencies
        - avoid magical overload

    light_wooden_texture:
      allowed: true

      possible_sources:
        - soft-wood-block
        - muted-marimba
        - wooden-click
        - gentle-shaker

      role:
        - organic-landscape-character
        - walking-support

      intensity: very-low

harmony:

  character:
    - warm
    - open
    - consonant
    - stable
    - spacious
    - reassuring
    - gently-resolving

  complexity: low

  preferred:
    - major
    - major-add6
    - major-add9
    - warm-major7
    - open-fifths
    - gentle-suspended-harmony
    - simple-diatonic-progressions
    - gentle-plagal-motion
    - tonic-pedal
    - soft-IV-I-resolution

  dissonance: minimal

  cadence_character:
    - soft
    - complete
    - unhurried
    - reassuring

  rules:
    - favor warm consonant voicings
    - use wider spacing than daytime-active music
    - allow harmony to breathe
    - resolve suspended notes gently
    - use slow harmonic rhythm
    - avoid dramatic chord changes
    - avoid dark minor turns
    - avoid unresolved endings
    - preserve positive emotional completion

melody:

  complexity: simple

  phrase_length: short-medium

  contour:
    - gently-rising
    - softly-falling
    - flowing
    - arch-shaped
    - small-step-motion

  repetition:
    allowed: true
    amount: moderate

  characteristics:
    - lyrical
    - warm
    - memorable
    - calm
    - spacious
    - comforting
    - singable
    - child-friendly

  phrase_behavior:
    beginning: gentle
    peak: modest
    ending: softly-descending

  rules:
    - allow longer spaces between phrases
    - avoid constant melodic movement
    - use descending phrases for gentle completion
    - allow occasional rising phrase for hope
    - avoid dramatic leaps
    - avoid overly sentimental melody
    - keep melody beneath dialogue
    - preserve recognizable sunset motif

rhythm:

  activity: low

  pulse:
    strength: subtle
    consistency: relaxed
    character:
      - flowing
      - unhurried
      - gentle
      - walking-friendly

  percussion:
    amount: minimal

  preferred:
    - soft-acoustic-guitar-pulse
    - sparse-muted-marimba
    - gentle-wooden-texture
    - very-light-shaker
    - soft-piano-pattern

  activity_relationship:

    scenic_view:
      activity: very-low

    walking_home:
      activity: low

    quiet_conversation:
      activity: very-low

    friendship:
      activity: very-low

    reflection:
      activity: minimal

    episode_resolution:
      activity: minimal

    transition_from_play:
      activity: low

  rules:
    - rhythm gradually settles as sunset deepens
    - allow long rhythmic breathing spaces
    - maintain gentle forward movement when characters walk
    - remove rhythmic elements during emotional reflection
    - avoid noticeable beat emphasis
    - never create urgency
    - never become sleepy in an emotionally flat way

  avoid:
    - heavy-drums
    - fast-percussion
    - strong-pulse
    - aggressive-rhythm
    - tension-ostinato
    - complex-syncopation
    - frantic-patterns
    - driving-bass
    - dense-percussion

tempo:

  default_bpm:
    min: 58
    max: 82

  preferred_bpm: 70

  states:

    early_golden_hour:
      min: 70
      max: 82

    sunset_walk:
      min: 66
      max: 76

    quiet_reflection:
      min: 58
      max: 68

    friendship:
      min: 62
      max: 72

    episode_resolution:
      min: 56
      max: 66

    transition_from_active_scene:
      min: 72
      max: 84

  rules:
    - gradually reduce perceived energy toward sunset
    - follow character movement naturally
    - avoid abrupt tempo reduction
    - preserve gentle momentum
    - allow flexible rubato during scenic moments
    - never create artificial urgency

dynamics:

  default: soft

  range:
    minimum: very-soft
    maximum: medium-soft

  variation: subtle

  contour:
    opening: soft
    middle: soft-medium
    ending: very-soft

  rules:
    - use gradual dynamic movement
    - avoid sudden changes
    - avoid dramatic crescendos
    - avoid strong emotional swells
    - allow gentle widening during scenic reveals
    - settle naturally during resolutions
    - preserve comfortable listening levels for ages 3-6

dialogue:

  priority: highest

  music_behavior:

    during_dialogue:
      volume: reduced
      melodic_activity: reduced
      rhythmic_activity: very-low
      instrumentation_density: reduced

    during_reflective_dialogue:
      volume: very-low
      preferred_instruments:
        - soft-piano
        - acoustic-guitar

    during_friendship_dialogue:
      volume: low
      melody: sparse
      harmony: warm

    during_walk_and_talk:
      volume: low
      rhythm: subtle
      melody: minimal

    between_dialogue:
      volume: normal-low
      melodic_activity: gently-increased

  ducking:
    enabled: true
    behavior: smooth
    attack: gentle
    release: gentle

  rules:
    - dialogue remains completely intelligible
    - reduce flute beneath dialogue
    - avoid strings carrying active melody under speech
    - simplify piano beneath emotional lines
    - remove bells beneath speech
    - reduce guitar rhythm beneath quiet dialogue
    - restore musical detail gradually after dialogue

ambience:

  priority:
    - dialogue
    - important-character-sounds
    - environmental-sounds
    - music

  preserve:
    - gentle-evening-breeze
    - grass-movement
    - leaves-rustling
    - distant-birds
    - soft-insects
    - footsteps-on-path
    - distant-water
    - quiet-countryside-ambience

  birds:
    importance: medium

    behavior:
      - less-active-than-daytime
      - gentle
      - occasional

    music_relationship:
      - leave upper-frequency-space
      - reduce flute when birds are prominent

  breeze:
    importance: high
    role: sunset-atmosphere

    music_relationship:
      - preserve natural spaciousness
      - avoid dense sustained textures

  insects:
    importance: medium

    role:
      - evening-transition
      - natural-time-of-day-cue

    music_relationship:
      - maintain soft high-frequency space
      - avoid excessive bell texture

  footsteps:
    importance: medium

    music_relationship:
      - preserve walking readability
      - guitar or marimba may loosely support walking pace
      - never synchronize rigidly

  distant_water:
    importance: low-medium

  countryside:
    importance: high
    role: environmental-identity

  rules:
    - environmental ambience remains clearly audible
    - sunset should feel naturally quieter than daytime
    - music must sit inside the environment
    - allow ambience-only moments
    - environmental sound continues through transitions
    - avoid overly silent or empty soundscape

mix:

  dialogue_priority: highest

  music_position:
    width: medium-wide
    depth: background

  ambience_position:
    width: wide
    depth: environment

  piano:
    position: center-soft

  acoustic_guitar:
    position: medium-wide

  flute:
    position: slightly-off-center

  strings:
    position: wide-background

  clarinet:
    position: slightly-opposite-flute

  harp:
    position: soft-wide

  marimba:
    position: subtle-wide

  rules:
    - preserve clear dialogue center
    - maintain wide scenic ambience
    - keep low frequencies gentle
    - avoid dense midrange
    - soften high-frequency elements
    - preserve environmental detail
    - create a broad but intimate landscape
    - avoid excessive stereo movement

states:

  default:
    id: sunset-golden-hour-warm
    emotion:
      - warmth
      - peace
      - reassurance

    energy: low

    instrumentation:
      - soft-piano
      - acoustic-guitar
      - gentle-flute
      - soft-strings

  golden_hour_arrival:
    id: sunset-golden-hour-arrival

    emotion:
      - warmth
      - wonder
      - calm

    energy: low-medium

    changes:
      guitar: gentle-fingerpicked-pattern
      piano: warm-open-chords
      flute: short-sunset-motif
      strings: subtle-wide
      marimba: optional-very-light

  scenic_reveal:
    id: sunset-golden-hour-scenic-reveal

    emotion:
      - wonder
      - appreciation
      - openness

    energy: low

    changes:
      strings: slightly-wider
      piano: open-voicing
      flute: gentle-rising-phrase
      guitar: sparse
      harp: optional-single-figure

    rules:
      - create wonder without epic scale
      - avoid strong crescendo
      - allow environment to remain prominent

  sunset_walk:
    id: sunset-golden-hour-walk

    emotion:
      - calm
      - companionship
      - gentle-progress

    energy: low

    changes:
      guitar: soft-steady-fingerpicking
      piano: sparse
      marimba: subtle-step-pulse
      flute: occasional
      strings: very-soft

  friendship:
    id: sunset-golden-hour-friendship

    emotion:
      - warmth
      - kindness
      - connection

    energy: very-low

    changes:
      piano: primary
      guitar: soft
      clarinet: optional-warm-response
      flute: minimal
      strings: subtle
      marimba: absent

  reflection:
    id: sunset-golden-hour-reflection

    emotion:
      - peace
      - thoughtfulness
      - reassurance

    energy: very-low

    changes:
      piano: primary
      guitar: occasional-plucks
      strings: soft-sustained
      flute: sparse
      rhythm: absent

  discovery_resolution:
    id: sunset-golden-hour-discovery-resolution

    emotion:
      - understanding
      - satisfaction
      - gentle-wonder

    energy: low

    changes:
      piano: gentle-resolution
      flute: short-motif
      guitar: supportive
      bell_accent: optional-single-note
      strings: soft

  returning_home:
    id: sunset-golden-hour-returning-home

    emotion:
      - comfort
      - completion
      - security

    energy: low

    changes:
      guitar: primary-rhythm
      piano: warm
      flute: occasional
      marimba: minimal
      strings: subtle

    rules:
      - maintain gentle movement
      - suggest completion without sadness
      - preserve positive expectation of return

  quiet_conversation:
    id: sunset-golden-hour-dialogue

    emotion:
      - supportive
      - intimate
      - warm

    energy: very-low

    changes:
      piano: sparse
      guitar: very-soft
      flute: absent-or-minimal
      strings: minimal
      marimba: absent
      bells: absent

  reassurance:
    id: sunset-golden-hour-reassurance

    emotion:
      - comfort
      - safety
      - hope

    energy: very-low

    changes:
      piano: warm-primary
      clarinet: optional-soft-phrase
      strings: subtle
      guitar: sparse
      flute: gentle-resolution

  episode_resolution:
    id: sunset-golden-hour-episode-resolution

    emotion:
      - completion
      - warmth
      - reassurance
      - togetherness

    energy: very-low

    changes:
      piano: primary
      flute: sunset-theme-resolution
      guitar: soft-final-pattern
      strings: gentle-support
      marimba: absent
      bells: optional-single-final-accent

    rules:
      - resolve clearly
      - remain emotionally warm
      - avoid sentimental exaggeration
      - avoid finality that feels like permanent goodbye

  transition_to_evening:
    id: sunset-golden-hour-to-evening

    emotion:
      - calm
      - rest
      - comfort

    energy: very-low

    changes:
      piano: sparse
      guitar: reduced
      flute: minimal
      strings: soft
      rhythm: absent
      ambience: increasingly-prominent

motif:

  id: sunset-golden-hour-warmth-motif

  purpose:
    - identify-golden-hour
    - reinforce-time-of-day
    - symbolize-warmth
    - symbolize-completion
    - support-reflection
    - connect-scene-resolution
    - create-emotional-continuity

  primary_instrument: gentle-flute

  supporting_instruments:
    - soft-piano
    - acoustic-guitar
    - soft-strings

  structure:
    length: short
    complexity: simple

    character:
      - warm
      - gently-rising
      - softly-descending
      - lyrical
      - reassuring
      - memorable

  emotional_shape:
    beginning: warm
    middle: gently-hopeful
    ending: resolved

  usage:
    - sunset-establishing-shot
    - golden-hour-scenic-reveal
    - friendship-moment
    - quiet-reflection
    - returning-home
    - emotional-resolution
    - scene-ending
    - episode-ending
    - transition-to-evening

  rules:
    - motif remains recognizable
    - core melodic shape remains stable
    - arrangement may change by location
    - location-specific instruments may support it
    - motif remains secondary to established location motifs when required
    - simplify beneath dialogue
    - never become tragic
    - never become epic
    - never imply permanent farewell

environmental_relationship:

  visual_character:
