location_identity:
  category: countryside-golden-hour-landscape
  summary: expansive-flower-meadow-valley-with-winding-stone-path-fence-cottages-and-distant-mountains
  emotional_character: [warm, calm, wondrous, safe, expansive, reflective, gently-magical]
  medium: premium-soft-stylized-3d-preschool-animation
  default_time_of_day: primary-golden-hour
  permanent_visual_anchors:
    - winding-irregular-stone-path-entering-from-foreground
    - connected-low-wood-fence-following-path
    - foreground-and-midground-wildflower-meadow
    - broad-rolling-valley
    - sparse-large-and-medium-rounded-deciduous-trees
    - small-cottage-cluster-on-right-midground-hillside
    - distant-layered-mountain-range-with-one-readable-peak
    - open-low-horizon-and-large-readable-sky
  quantity_and_continuity_intent:
    path: one-continuous-route
    fence: one-coherent-low-boundary-system-with-perspective-separated-segments
    cottage_cluster: one-fixed-right-midground-group-with-three-principal-cottages
    subordinate_distant_roof_forms: unlocked-pending-owner-topology-lock
    major_tree_groups: sparse-general-placement-fixed-exact-count-unlocked
    mountain_range: one-fixed-background-silhouette

