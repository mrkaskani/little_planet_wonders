location_identity:
  category: countryside-golden-hour-landscape
  summary: expansive-flower-meadow-valley-with-winding-stone-path-fence-cottages-and-distant-mountains
  emotional_character: [warm, calm, wondrous, safe, expansive, reflective, gently-magical]
  medium: premium-soft-stylized-3d-preschool-animation
  default_time_of_day: primary-golden-hour
  permanent_visual_anchors:
    - winding-irregular-stone-path-entering-from-foreground
    - connected-low-wood-fence-following-path
    - foreground-and-midground-wildflower-meadow
    - broad-rolling-valley
    - sparse-large-and-medium-rounded-deciduous-trees
    - small-cottage-cluster-on-right-midground-hillside
    - distant-layered-mountain-range-with-one-readable-peak
    - open-low-horizon-and-large-readable-sky
  quantity_and_continuity_intent:
    path: one-continuous-route
    fence: one-connected-run-with-perspective-segments
    cottage_cluster: one-fixed-right-midground-group
    major_tree_groups: sparse-and-fixed
    mountain_range: one-fixed-background-silhouette

relative_scale_authority:
  source: scale_and_proportion_board
  unit: relative-unit
  symbol: RU
  normalization:
    site_reference_width: 1.00
    total_depth: 1.00
    depth_to_width_ratio: "1:1"
  depth_bands:
    foreground_depth: 0.35
    midground_depth: 0.35
    background_depth: 0.30
  lateral_bands:
    left_hillside_width: 0.33
    valley_low_width: 0.34
    right_hillside_width: 0.33
  terrain_heights:
    foreground_reference_height: 0.50
    midground_hill_height: 0.20
    valley_low_below_foreground: 0.20
    distant_mountain_max_height: 0.38
  path_and_fence:
    visible_path_width: 0.18
    fence_height: 0.14
  major_tree:
    total_height: 0.42
    canopy_height: 0.30
    trunk_height: 0.12
    canopy_width: 0.28
  cottage:
    width: 0.20
    height_to_roof_peak: 0.18
  sun:
    visible_disc_diameter: 0.16
  interpretation_rules:
    - all-values-are-relative-not-metric-or-imperial
    - maintain-proportions-across-all-views-compositions-and-lighting-states
    - do-not-change-landmark-size-to-fit-a-camera-view
    - preserve-foreground-midground-background-depth-bands
    - do-not-convert-to-centimeters-without-an-approved-real-world-anchor

site_plan_and_orientation:
  plan_reference:
    north: image-up
    foreground_entry: bottom-center-stone-path
    path_flow: winding-from-foreground-through-valley-toward-background
    cottage_cluster: right-midground
    major_tree_groups: clustered-along-hillsides-and-near-path-with-open-valley-gaps
    flower_fields: broad-foreground-and-midground-bands
    fence: follows-selected-path-edge-sections-without-blocking-travel
  terrain_profile:
    longitudinal: foreground-rise-to-midground-valley-to-background-mountain-layers
    lateral: left-hillside-to-valley-low-to-right-hillside
  movement_spaces:
    - stone-path-travel-lane
    - fence-side-observation-zone
    - broad-meadow-action-area
  camera_clearance:
    - keep-lower-path-readable-for-character-entry
    - keep-valley-and-mountain-axis-open
    - preserve-sky-space-for-wide-establishing-compositions

