materials_and_vegetation:
  stone_path:
    material: irregular-rounded-warm-stone-pavers
    color_family: warm-ochre-rose-and-earth-brown
    continuity: same-winding-route-and-visible-width
  wood_fence:
    material: matte-weathered-warm-brown-wood
    construction: rounded-posts-and-horizontal-rails
    continuity: one-connected-run-never-multiplied
  meadow:
    material: grouped-soft-grass-patches
    motion_rule: coherent-broad-patch-movement-not-independent-blades
  wildflowers:
    grouping: broad-readable-clusters
    colors: [warm-yellow, orange, coral, soft-pink, lavender, white]
    density_rule: preserve-path-edge-and-meadow-grouping-without-noisy-micro-detail
  trees:
    silhouette: broad-rounded-deciduous-canopies
    scale_family: [major-tree, medium-tree, shrub-bush]
    surfaces: textured-bark-and-broad-leaf-masses
  cottages:
    walls: warm-light-stucco-or-stone
    roofs: muted-terracotta-tiles
    placement: fixed-right-midground-cluster

lighting_states:
  permanent_geometry_rule: lighting-state-never-changes-site-layout-or-material-identity
  primary_golden_hour:
    sun: low-left-to-left-center
    character: warm-soft-directional
    effects: [long-shadows, golden-rim-light, readable-open-valley, warm-path-highlights]
  alternate_golden_hour:
    role: composition-audition-with-same-geometry-and-light-family
  late_golden_hour:
    sun: lower-near-horizon
    effects: [deeper-amber, longer-shadows, reduced-sky-brightness]
  near_sunset:
    sun: horizon-adjacent
    effects: [coral-magenta-clouds, deeper-valley-shadow, preserved-landmark-readability]
  clean_neutral:
    role: verify-local-colors-materials-geometry-and-value-separation-without-orange-cast
    rule: not-a-new-location-or-season
  color_management:
    - preserve-green-meadow-brown-fence-stone-path-and-cottage-local-colors
    - do-not-apply-uniform-orange-wash
    - keep-shadow-detail-open-and-child-safe
    - maintain-clear-path-horizon-and-cottage-separation

continuity:
  fixed_across_all_views_and_light_states:
    - path-route-and-width
    - fence-route-height-and-post-spacing-family
    - cottage-cluster-location-and-scale
    - major-tree-groups
    - valley-hill-and-mountain-silhouette
    - flower-field-grouping
    - foreground-midground-background-depth-bands
  temporary_states:
    - sun-angle
    - cloud-color-and-density-within-approved-range
    - shadow-length-and-direction
    - golden-rim-intensity
    - gentle-coherent-foliage-motion

mcp_context:
  retrieval_key: countryside-golden-hour-v002
  aliases: [sunset-golden-hour-nature-park-v002, golden-hour-countryside-v002]
  package_status: complete-candidate
  preferred_authority_order:
    - location-v2.yaml-for-v002-structured-review-context
    - location.yaml-for-current-canonical-policy
    - countryside-golden-hour-primary-master-v001-for-current-generation-conditioning
    - v002-design-review-boards-for-human-review-only
  query_routing:
    exact_scale_and_proportions: relative_scale_authority
    site_plan_terrain_and_orientation: site_plan_and_orientation
    camera_view_selection: board_catalog
    landmark_and_material_prompting: materials_and_vegetation
    lighting_state_selection: lighting_states
    cross-view-continuity: continuity
    source_file_lookup: source_images
  safe_prompt_context_fragment: >-
    Expansive child-safe countryside meadow at golden hour, one winding warm
    stone path entering from the foreground and crossing a broad flower-filled
    valley, one connected low wooden fence, sparse rounded deciduous trees,
    a small fixed cottage cluster on the right midground hillside, layered
    distant mountains, broad readable sky, and soft preserved local colors.
  scale_context_fragment: >-
    Normalize site width and depth to 1.00 RU; foreground depth 0.35, midground
    0.35, background 0.30; path width 0.18, fence height 0.14, major tree height
    0.42 and canopy width 0.28, cottage width 0.20 and roof-peak height 0.18.
  generation_constraints:
    - preserve-one-path-one-connected-fence-run-and-one-cottage-cluster
    - preserve-fixed-valley-mountain-tree-and-flower-group-layout
    - retrieve-lighting-state-separately-from-permanent-geometry
    - retain-broad-open-character-movement-space-on-path-and-meadow
    - keep-meadow-and-flower-motion-coherent-and-low-frequency
  direct_conditioning_policy:
    these_five_boards_allowed: false
    reason: multi-panel-collages-with-labels-duplicate-views-diagrams-and-lighting-variants
    current_allowed_location_frame: countryside-golden-hour-primary-master-v001
  prohibited_inference:
    - absolute-meter-or-centimeter-dimensions
    - new-path-branches-fence-runs-cottages-trees-or-mountain-peaks
    - merging-with-the-separate-daylight-nature-park-location
    - treating-lighting-variation-as-geometry-change
    - uniform-orange-color-wash

generation_policy:
  design_review_images_are_direct_conditioning_inputs: false
  allowed_modes_before_v2_approval: []
  forbidden_modes_for_these_five_boards: [t2v, i2v, ti2v-image, s2v]
  active_generation_reference: countryside-golden-hour-primary-master-v001
  active_generation_reference_version: v001
  clean_v2_frames_required_after_approval:
    - primary-golden-hour-establishing-frame
    - opposite-direction-frame
    - path-and-fence-action-area-frame
    - clean-neutral-geometry-frame

