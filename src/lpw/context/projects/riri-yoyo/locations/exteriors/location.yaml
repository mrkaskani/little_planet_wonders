id: kindergarten-exterior
type: location-context
version: 2
status: approved-primary-master-secondary-views-open
name: Kindergarten Exterior and Garden

metadata:
  project_id: riri-yoyo
  folder_id: exteriors
  category: kindergarten-exterior
  reusable: true
  audience:
    minimum_age: 3
    maximum_age: 6

source_authority:
  project: ../../project.yaml
  visual_style: ../../visual_style/visual_style.yaml
  palette: ../../visual_style/palette-v2.yaml
  lighting: ../../visual_style/lighting.yaml
  materials: ../../visual_style/materials.yaml
  wan_2_2: ../../wan22-preproduction.yaml
  asset_registry: ../../locations-assets.yaml
  sound_profile: sound-profile.yaml
  music_profile: music-profile.yaml

identity:
  summary: sunny-warm-cheerful-kindergarten-garden-and-entrance
  emotional_character:
    - welcoming
    - playful
    - safe
    - open
    - cheerful
  default_time_of_day: daytime
  palette_preset: day_exterior
  material_family:
    - soft-matte-painted-architecture
    - rounded-warm-path-material
    - grouped-soft-foliage

known_landmark_roles:
  - kindergarten-building-face
  - primary-entrance
  - readable-garden-path
  - grouped-trees-and-foliage
  - child-safe-garden-zone

geometry:
  approval_state: locked-to-kindergarten-exterior-primary-master-v001
  rule: do-not-invent-exact-dimensions-or-landmark-positions-before-reference-approval
  preserve_after_approval:
    - building-proportions
    - entrance-position
    - path-layout
    - landmark-count
    - world-orientation
    - camera-accessible-areas

spatial_contract:
  dimensions:
    status: awaiting-approved-reference-measurement
    unit: centimeters
    width_cm: null
    depth_cm: null
    maximum_height_cm: null
  entrances:
    - primary-entrance
  exits:
    - primary-entrance
    - garden-path-boundary
  navigation_areas:
    - readable-garden-path
    - kindergarten-entrance-approach
  safe_interaction_zones:
    - child-safe-garden-zone
    - entrance-waiting-zone
  camera_safe_views:
    - primary-master-view
    - reverse-master-view
    - entrance-view
    - garden-action-area-view
  movement_spaces:
    - garden-path-travel-lane
    - garden-action-area
  permanent_landmarks:
    - kindergarten-building-face
    - primary-entrance
    - readable-garden-path
    - grouped-trees-and-foliage
  approved_movable_asset_ids: []
  movable_asset_source: ../../assets/props.yaml
  rule: exact-measurements-and-landmark-coordinates-cannot-be-invented-before-reference-approval

reference_requirements:
  primary_master_view:
    required: true
    status: approved
    path: ../../assets/locations/kindergarten-exterior/design-review/kindergarten-exterior--primary-master-view--v001.png
    sha256: e9d89d04d87a96c71dcd7d74d24808b29ac114d8949ff1865d75af11142295b1
    pixel_dimensions: 1672x941
    aspect_ratio: "1672:941"
    review_record: ../../validation/location-master-review.yaml
  reverse_view:
    required: true
    status: missing
  entrance_view:
    required: true
    status: missing
  garden_action_area:
    required: true
    status: missing
  scale_reference:
    required: true
    status: missing
  generation_frame_rules:
    - use-one-coherent-image
    - match-output-aspect-ratio
    - preserve-movement-space
    - remove-text-labels-watermarks-and-accidental-faces
    - never-use-a-reference-board-or-collage-as-conditioning-input

wan_2_2_interface:
  contract_source: ../../wan22-preproduction.yaml
  t2v:
    eligibility: exploratory-only-until-geometry-is-approved
    prompt_fragment: >-
      Sunny welcoming kindergarten exterior with a warm rounded building face,
      a clear garden path, grouped friendly foliage, and one readable entrance,
      premium soft stylized 3D preschool animation.
  ti2v_text:
    eligibility: draft-only
    evaluate:
      - broad-layout
      - focal-hierarchy
      - path-and-entrance-readability
  ti2v_image:
    eligibility: blocked-until-approved-single-frame-reference
  i2v:
    eligibility: blocked-until-approved-single-frame-reference
  s2v:
    eligibility: blocked-until-approved-character-and-location-composite-frame
  temporal_constraints:
    - foliage-moves-in-coherent-groups
    - path-building-and-entrance-remain-fixed
    - avoid-random-background-children-or-duplicate-objects
    - use-one-primary-action-and-one-camera-behavior

continuity:
  locked_after_reference_approval:
    - geometry
    - landmark-positions
    - entrance-and-path-orientation
    - permanent-materials
    - permanent-colors
    - vegetation-groups
  temporary_states:
    - time-of-day
    - approved-weather
    - ground-wetness
    - movable-props

quality_control:
  reject:
    - invented-or-moving-architecture
    - mirrored-geography
    - changed-entrance-or-path
    - multiplied-foliage-or-background-subjects
    - generated-text-or-watermark
    - unapproved-reference-path
