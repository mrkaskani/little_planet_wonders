id: kindergarten-interior
type: location-context
version: 2
status: approved-primary-master-secondary-views-open
name: Kindergarten Interior Classroom

metadata:
  project_id: riri-yoyo
  folder_id: interiors
  category: classroom
  reusable: true
  audience:
    minimum_age: 3
    maximum_age: 6

source_authority:
  project: ../../project.yaml
  visual_style: ../../visual_style/visual_style.yaml
  palette: ../../visual_style/palette-v2.yaml
  lighting: ../../visual_style/lighting.yaml
  materials: ../../visual_style/materials.yaml
  wan_2_2: ../../wan22-preproduction.yaml
  asset_registry: ../../locations-assets.yaml
  sound_profile: sound-profile.yaml
  music_profile: music-profile.yaml

identity:
  summary: warm-cozy-clear-kindergarten-learning-room
  emotional_character:
    - welcoming
    - calm
    - playful
    - educational
    - safe
  default_time_of_day: interior-day
  palette_preset: classroom_interior
  material_family:
    - warm-matte-painted-walls
    - rounded-natural-or-painted-wood
    - broad-soft-fabrics
    - clean-child-safe-plastic

known_landmark_roles:
  - broad-window-light-side
  - child-scale-table-zone
  - learning-and-drawing-zone
  - warm-wood-storage-and-furniture
  - clear-door-or-exit

geometry:
  approval_state: locked-to-kindergarten-interior-primary-master-v001
  rule: do-not-invent-room-dimensions-window-placement-or-furniture-layout-before-reference-approval
  preserve_after_approval:
    - room-proportions
    - window-and-door-positions
    - table-and-learning-zone-layout
    - furniture-count-and-scale
    - world-orientation
    - camera-accessible-areas

spatial_contract:
  dimensions:
    status: awaiting-approved-reference-measurement
    unit: centimeters
    width_cm: null
    depth_cm: null
    ceiling_height_cm: null
  entrances:
    - classroom-door
  exits:
    - classroom-door
  navigation_areas:
    - central-room-lane
    - table-circulation-lane
    - door-clearance-lane
  safe_interaction_zones:
    - child-scale-table-zone
    - learning-and-drawing-zone
    - open-floor-action-zone
  camera_safe_views:
    - primary-master-view
    - reverse-master-view
    - door-and-window-view
    - table-action-area-view
  movement_spaces:
    - open-floor-action-zone
    - table-approach-space
  permanent_landmarks:
    - broad-window-light-side
    - classroom-door
    - built-in-storage-zone
  approved_movable_asset_ids: []
  movable_asset_source: ../../assets/props.yaml
  rule: exact-room-measurements-furniture-count-and-layout-cannot-be-invented-before-reference-approval

reference_requirements:
  primary_master_view:
    required: true
    status: approved
    path: ../../assets/locations/kindergarten-interior/design-review/kindergarten-interior--primary-master-view--v001.png
    sha256: 32a21892819b7b9786db06fb1fde77757640ae5f9d16dca77fae9aeb7943bdef
    pixel_dimensions: 1672x941
    aspect_ratio: "1672:941"
    review_record: ../../validation/location-master-review.yaml
  reverse_view:
    required: true
    status: missing
  door_and_window_view:
    required: true
    status: missing
  table_action_area:
    required: true
    status: missing
  scale_reference:
    required: true
    status: missing
  generation_frame_rules:
    - use-one-coherent-image
    - keep-action-contact-points-visible
    - preserve-movement-space
    - remove-written-labels-posters-faces-and-watermarks
    - never-use-a-reference-board-or-collage-as-conditioning-input

wan_2_2_interface:
  contract_source: ../../wan22-preproduction.yaml
  t2v:
    eligibility: exploratory-only-until-geometry-is-approved
    prompt_fragment: >-
      Warm cozy kindergarten classroom with broad window light, rounded child-scale
      tables, simple warm wood storage, a clear learning area, and uncluttered
      premium soft stylized 3D preschool design.
  ti2v_text:
    eligibility: draft-only
    evaluate:
      - broad-room-layout
      - window-direction
      - table-and-learning-zone-readability
  ti2v_image:
    eligibility: blocked-until-approved-single-frame-reference
  i2v:
    eligibility: blocked-until-approved-single-frame-reference
  s2v:
    eligibility: blocked-until-approved-character-and-location-composite-frame
  temporal_constraints:
    - walls-windows-doors-and-furniture-remain-fixed
    - background-toys-remain-sparse-and-stable
    - avoid-tiny-readable-text-and-repeating-wall-patterns
    - use-one-primary-action-and-one-camera-behavior

continuity:
  locked_after_reference_approval:
    - geometry
    - window-and-door-positions
    - table-storage-and-furniture-layout
    - permanent-materials
    - permanent-colors
  temporary_states:
    - time-of-day
    - window-and-door-openness
    - movable-learning-props
    - activity-organization

quality_control:
  reject:
    - changing-room-layout-between-views
    - multiplied-tables-toys-or-windows
    - mirrored-door-or-window-direction
    - generated-writing-or-face-like-posters
    - clutter-that-obscures-character-action
    - unapproved-reference-path
