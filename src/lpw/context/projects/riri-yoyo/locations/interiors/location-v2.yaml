    front_whiteboards: 1
    concentric_circle_rugs: 1
    ceiling_fans: 1
    globe_displays: 1
    perimeter_shelf_systems: four-wall-low-runs-with-one-rear-right-taller-cubby
  variable_set_dressing:
    - potted-plants
    - pastel-storage-bins
