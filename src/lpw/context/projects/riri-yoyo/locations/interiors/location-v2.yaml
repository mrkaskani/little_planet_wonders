location_identity:
  category: classroom
  summary: warm-sunlit-child-scale-kindergarten-learning-room
  emotional_character:
    - welcoming
    - warm
    - playful
    - calm
    - educational
    - safe
  medium: premium-soft-stylized-3d-preschool-animation
  default_time_of_day: warm-interior-day
  permanent_visual_anchors:
    - front-whiteboard-and-bunting-wall
    - left-window-bank
    - right-artwork-and-bulletin-wall
    - rear-opposite-simple-wall
    - perimeter-low-shelving-and-cubbies
    - two-child-scale-group-table-sets
    - centered-multicolor-circular-activity-rug
    - centered-ceiling-fan

orientation_contract:
  coordinate_system: room-relative-units
  unit_symbol: RU
  scale_rule: all-values-are-proportional-not-metric-or-imperial
  room_width_reference: 1.00
  axes:
    horizontal_left_to_right:
      extent_ru: 1.00
      left_boundary: window-wall
      right_boundary: artwork-and-bulletin-wall
    depth_front_to_rear:
      extent_ru: 0.90
      front_boundary: whiteboard-and-bunting-wall
      rear_boundary: opposite-simple-wall
    vertical_floor_to_ceiling:
      extent_ru: 0.78
      lower_boundary: wood-floor
      upper_boundary: paneled-ceiling
  camera_orientation:
    front: wall-with-whiteboard-and-bunting
    left: window-bank-wall
    right: artwork-and-bulletin-wall
    rear: opposite-wall-behind-primary-camera
  invariants:
    - never-mirror-left-window-and-right-artwork-walls
    - never-move-whiteboard-away-from-front-wall
    - never-rotate-the-floor-plan-between-views
    - preserve-object-position-logic-across-all-camera-angles

relative_scale_authority:
  source: scale_and_proportion_reference_board
  architecture:
    room_width_ru: 1.00
    room_depth_ru: 0.90
    ceiling_height_ru: 0.78
    window_bank_width_ru: 0.66
    window_bank_height_ru: 0.60
    whiteboard_width_ru: 0.72
    whiteboard_height_ru: 0.40
    ceiling_fan_span_ru: 0.40
  fixed_storage:
    front_shelf_height_ru: 0.50
    rear_shelf_height_ru: 0.50
    right_shelf_height_ru: 0.50
    typical_shelf_or_cubby_width_ru: 0.30
    typical_shelf_or_cubby_height_ru: 0.50
    arrangement_rule: low-perimeter-storage-running-along-three-room-sides
  child_reference:
    typical_height_ru: 0.62
    purpose: relative-human-scale-only
  table:
    width_ru: 0.45
    depth_ru: 0.45
    height_ru: 0.50
    surface: rounded-solid-wood
  chair:
    width_ru: 0.26
    depth_ru: 0.24
    seat_height_ru: 0.28
    surface: rounded-solid-wood
  activity_rug:
    shape: circular
    construction: concentric-pastel-color-rings
    diameter_ru: not-explicitly-defined-on-this-package
    placement: right-of-center-between-table-zone-and-open-play-zone
    scale_rule: preserve-board-relative-footprint-do-not-invent-a-numeric-diameter
  interpretation_rules:
    - preserve-proportions-across-perspective-elevation-overview-and-floor-plan-views
    - do-not-convert-relative-units-to-centimeters-without-an-approved-real-world-anchor
    - do-not-change-furniture-scale-to-fit-a-camera-composition
    - child-table-chair-whiteboard-and-storage-relations-are-locked-together

spatial_layout:
  floor_plan:
    shape: simple-rectangular-room
    front_wall:
      fixed_elements: [whiteboard, bunting, low-shelving, plants, globe, learning-display]
    left_wall:
      fixed_elements: [broad-window-bank, low-storage-below-window, plants]
    right_wall:
      fixed_elements: [artwork-board, low-shelving, storage-bins, display-items]
    rear_wall:
      fixed_elements: [simple-artwork, low-shelving, tall-cubby-at-corner, plants]
    center:
      fixed_layout: [two-group-table-sets, circular-activity-rug]
      circulation: keep-clear-between-table-zone-rug-and-perimeter-storage
  functional_zones:
    primary_learning_instruction_zone:
      location: front-half-facing-whiteboard
      contains: [whiteboard, group-tables, instructional-display, low-storage]
      use: teacher-led-learning-group-table-activity-and-front-facing-composition
    secondary_learning_activity_zone:
      location: left-window-and-rug-side
      contains: [natural-window-light, plants, circular-rug, blocks, small-group-work-area]
      use: play-floor-work-small-group-activity-and-gentle-side-light-composition
    storage_display_zone:
      location: perimeter-low-shelving
      contains: [cubbies, colored-storage-bins, books, plants, globe, child-safe-displays]
      use: background-continuity-prop-origin-and-cleanup-blocking
    open_circulation_zone:
      location: central-lanes-between-tables-rug-and-shelves
      contains: []
      use: character-travel-camera-clearance-and-action-readability
  production_zone_overlay:
    instruction_zone:
      location: front-whiteboard-wall
      board_source: polished_production_four_side_reference_board-panel-07
    group_learning_zone:
      location: central-left-table-cluster
      board_source: polished_production_four_side_reference_board-panel-07
    circle_play_zone:
      location: circular-rug
      board_source: polished_production_four_side_reference_board-panel-07
    nature_and_light_zone:
      location: left-window-bank-and-plants
      board_source: polished_production_four_side_reference_board-panel-08
    display_and_art_zone:
      location: right-artwork-wall
      board_source: polished_production_four_side_reference_board-panel-08
    storage_and_organization_zone:
      location: perimeter-low-shelving-and-cubbies
      board_source: polished_production_four_side_reference_board-panel-08
    manipulative_play_materials_zone:
      location: rug-edge-and-open-floor
      board_source: polished_production_four_side_reference_board-panel-08

materials_and_surfaces:
  architecture:
    walls: warm-matte-light-wood-plank-panels
    window_trim: warm-painted-or-natural-wood
    ceiling: light-wood-panels
    floor: smooth-warm-wood-planks
  furniture:
    tables_and_chairs: solid-warm-wood-with-smooth-surfaces-and-rounded-edges
    shelves_and_cubbies: low-warm-wood-child-safe-storage
    storage_bins: matte-pastel-molded-plastic
    planter_pots: child-safe-matte-ceramic
  soft_surfaces:
    activity_rug: concentric-rounded-pastel-color-rings
  production_detail_lookup:
    wall_finish: warm-cream-painted-vertical-paneling
    ceiling_finish: warm-cream-acoustic-tile-grid-or-light-paneling
    flooring: light-natural-wood-planks
    window_frame: white-painted-wood
    baseboard: painted-wood-matching-wall
    built_in_shelf: light-natural-wood-clear-finish
    tabletop: smooth-rounded-solid-warm-wood
