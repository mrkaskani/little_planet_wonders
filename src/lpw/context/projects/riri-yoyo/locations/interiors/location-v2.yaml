    left_wall:
      fixed_elements: [broad-mullioned-window-bank, low-shelving-below-window, potted-plants]
    right_wall:
      fixed_elements: [large-artwork-or-bulletin-display, framed-child-art, low-shelving, pastel-storage-bins]
    rear_wall:
      fixed_elements: [small-framed-child-art, low-shelving, right-corner-tall-cubby, potted-plants]
