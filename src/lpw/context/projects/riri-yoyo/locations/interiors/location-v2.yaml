    colors: [cream, terracotta, sage, soft-pastels]
  ceiling_fan:
    material: warm-wood-blades-with-simple-painted-center-hub
    blade_count: 5
    role: functional-air-movement-and-centered-ceiling-anchor

lighting_and_color:
  primary_natural_light:
    source: strong-daylight-through-left-window-bank
    direction: left-to-right-across-room
    character: warm-bright-natural-day
    shadow_character: soft-readable-window-patterns-across-wood-floor
  ambient_fill:
    source: warm-room-bounce-and-soft-interior-ambient-light
    contrast: low-to-moderate
    shadow_rule: keep-corners-shelves-and-child-contact-surfaces-open-and-readable
  exposure: bright-readable-with-protected-window-highlights-and-open-shadows
  palette:
    base_colors: [warm-cream, warm-white, honey-wood]
    accent_colors: [golden-yellow, coral-orange, soft-pink, sage-green, muted-teal, soft-blue]
    accent_locations: [bunting, rug, storage-bins, framed-art, blocks, small-learning-props]
  rules:
    - preserve-local-pastel-colors-under-warm-window-light
    - avoid-harsh-contrast-deep-shadows-or-uniform-orange-cast
    - default-sunlight-originates-at-the-left-window-wall
    - keep-the-room-cheerful-calm-organized-and-readable-for-preschool-viewers
    - ceiling-fan-motion-does-not-create-strobing-or-threatening-shadow-flicker

camera_and_composition:
  approved_reference_view_types:
    primary_front_view:
      framing: wide-room-establishing
      must_show: [left-window-bank, front-whiteboard, two-table-zone, right-of-center-rug]
      use: master-geography-and-welcoming-room-introduction
    left_side_view:
      framing: wide-oblique-from-left-side
      must_show: [window-bank, sunlight-direction, tables, rug, front-wall-continuity]
      use: window-wall-light-and-depth-coverage
    right_side_view:
      framing: wide-oblique-from-right-side
      must_show: [artwork-wall, front-whiteboard, tables, rug, perimeter-storage]
      use: display-wall-parallax-and-zone-separation
    rear_opposite_view:
      framing: wide-reverse-room-view
      must_show: [simple-rear-wall, low-storage, table-rug-separation, fan-orientation]
      use: reverse-coverage-with-orientation-preserved
    elevated_overview:
      framing: high-angle-wide
      must_show: [full-layout, two-table-sets, rug-footprint, circulation-lanes]
      use: topology-blocking-and-continuity-check
    four_wall_elevation:
      framing: straight-on-orthographic-or-near-orthographic
      must_show: [front-left-right-rear-wall-identities-and-relative-proportions]
      use: structural-anchor-and-measurement-validation
    floor_plan:
      framing: orthographic-or-near-orthographic-overhead
      must_show: [one-by-zero-point-nine-footprint, fixed-furniture, rug, clear-lanes]
      use: layout-validation-not-final-story-shot
  composition_rules:
    - keep-character-action-contact-points-and-floor-footing-visible
    - protect-open-floor-table-approach-and-shelf-access-space
    - retain-left-window-light-as-an-orientation-cue
    - keep-the-front-whiteboard-and-right-of-center-rug-distinguishable
    - preserve-two-table-separation-and-eight-main-chair-count
    - avoid-extreme-wide-angle-distortion-of-room-depth-furniture-or-window-scale
    - use-elevation-and-floor-plan-views-for-validation-not-emotional-story-shots

