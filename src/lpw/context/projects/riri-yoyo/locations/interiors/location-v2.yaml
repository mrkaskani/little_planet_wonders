    display_and_art_zone:
      location: right-wall-artwork-and-bulletin-area
      purpose: child-art-display-and-visual-learning
    storage_and_organization_zone:
      location: four-wall-low-shelving-cubbies-and-bins
      purpose: organized-prop-origin-cleanup-and-background-continuity
    manipulative_and_play_materials_zone:
