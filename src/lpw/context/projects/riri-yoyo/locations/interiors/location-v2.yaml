authority_resolution:
  scale_and_proportion_reference_board:
    authoritative_for:
      - room-width-depth-and-ceiling-height
      - front-left-right-rear-orientation
      - window-whiteboard-table-chair-shelf-and-fan-relative-values
      - floor-plan-object-position-logic
  cinematic_four_picture_type_reference_board:
    authoritative_for:
      - primary-left-right-rear-and-elevated-camera-coverage
      - cinematic-zone-framing
      - architectural-material-furniture-surface-and-lighting-language
  structured_location_reference_board:
    authoritative_for:
      - four-wall-elevations-and-elevated-floor-plan
      - primary-and-secondary-functional-area-semantics
      - furniture-storage-material-architecture-and-color-categories
  titled_technical_reference_board:
    authoritative_for:
      - dimensioned-furniture-and-fixture-construction
      - wall-ceiling-floor-window-baseboard-and-shelf-finishes
      - natural-light-ambient-light-palette-and-mood-labels
  polished_production_location_board:
    authoritative_for:
      - final-material-and-surface-appearance
      - production-zone-overlays-and-set-density
      - warm-daylight-and-texture-quality-target
  conflict_rules:
    - current-five-board-revision-overrides-earlier-candidate-measurement-interpretation
    - printed-relative-unit-values-override-perspective-estimates
    - polished-look-never-overrides-locked-room-geometry-or-orientation
    - exact-variable-prop-counts-are-not-inferred-from-perspective-views
    - source-filename-typos-do-not-override-visible-board-titles
    - generated-whiteboard-poster-or-overlay-microtext-is-not-content-authority

location_identity:
  category: kindergarten-classroom
  summary: warm-sunlit-child-scale-learning-play-and-circle-time-room
  medium: premium-soft-stylized-3d-preschool-animation
  emotional_character: [warm, welcoming, playful, educational, calm, organized, safe, bright-and-cheerful]
  default_time_of_day: bright-warm-interior-day
  permanent_visual_anchors:
    - front-whiteboard-with-pastel-triangular-bunting
    - broad-left-mullioned-window-bank
    - right-artwork-and-bulletin-display-wall
    - simple-rear-opposite-wall-with-low-storage-and-small-art
    - low-shelving-and-cubby-runs-along-all-four-walls
    - two-square-child-group-table-sets-with-eight-main-chairs
    - right-of-center-concentric-pastel-circle-rug
    - one-centered-five-blade-wood-ceiling-fan
    - front-right-globe-and-controlled-perimeter-plants

orientation_contract:
  coordinate_system: room-relative-units
  unit_symbol: RU
  front: whiteboard-and-bunting-wall
  left: broad-window-bank-and-natural-light-wall
  right: artwork-bulletin-and-display-wall
  rear: simple-opposite-wall-with-low-storage-small-art-and-plant
  ceiling: warm-cream-acoustic-tile-grid-with-centered-five-blade-fan
  floor: light-natural-wood-plank-floor
  entrance_and_exit:
    status: unresolved-not-visible-in-supplied-v2-boards
    canonical_v1_policy_exists: true
    rule: do-not-invent-or-relocate-a-door-from-these-five-boards
  invariants:
    - never-mirror-left-window-and-right-artwork-walls
    - never-move-the-whiteboard-off-the-front-wall
    - never-substitute-the-simple-rear-wall-for-the-front-learning-wall
    - never-rotate-the-floor-plan-between-shots
    - keep-the-rug-right-of-center-relative-to-the-two-table-zone
    - keep-the-ceiling-fan-centered

relative_scale_authority:
  source: scale-and-proportion-reference-board-cross-checked-by-four-transformation-boards
  unit: relative-unit
  symbol: RU
  normalization:
    room_width_left_to_right: 1.00
    room_depth_front_to_rear: 0.90
    ceiling_height_floor_to_ceiling: 0.78
  wall_and_fixture_values:
    front_wall_width: 1.00
    rear_wall_width: 1.00
    left_wall_depth: 0.90
    right_wall_depth: 0.90
    left_window_bank_width: 0.66
    left_window_bank_height: 0.60
    front_whiteboard_width: 0.72
    front_whiteboard_height: 0.40
    typical_low_shelf_height: 0.50
    front_shelf_height: 0.50
    rear_shelf_height: 0.50
    right_shelf_height: 0.50
    typical_shelf_or_cubby_module_width: 0.30
    ceiling_fan_span: 0.40
  furniture_values:
    child_table: {width: 0.45, depth: 0.45, height: 0.50}
    child_chair: {width: 0.26, depth: 0.24, seat_height: 0.28}
    typical_child_height_reference: 0.62
  unmeasured_or_unresolved:
    - exact-round-rug-diameter
    - window-sill-height
    - chair-total-back-height
    - exact-shelf-run-lengths-and-module-counts
    - door-position-and-door-dimensions
    - real-world-metric-or-imperial-dimensions
  interpretation_rules:
    - all-values-are-proportional-relative-units-not-real-world-units
    - use-the-current-values-as-one-consistent-system-across-room-and-object-prompts
    - preserve-the-entire-proportion-set-together
    - do-not-convert-to-centimeters-meters-or-feet-without-an-approved-anchor
    - do-not-derive-rug-or-door-dimensions-from-perspective-estimates

