      purpose: safe-character-travel-camera-clearance-and-readable-action

materials_and_surfaces:
  floor:
    material: light-natural-wood-planks
    finish: smooth-warm-matte-clear-finish
    production_color: honey-maple-to-light-oak
  walls:
    material: vertical-paint-grade-paneling-or-subtle-grooved-wall-finish
    finish: flat-to-matte
    production_color: warm-cream
  ceiling:
    material: acoustic-tile-grid
    finish: painted-warm-cream-matte
  window_frame_and_mullions:
    material: painted-wood
    finish: smooth-semi-matte
    production_color: warm-white
  baseboards:
    material: paint-grade-wood
    finish: wall-matching-warm-cream
  tables_chairs_shelves_and_cubbies:
    material: light-natural-maple-like-wood
    finish: smooth-warm-matte-clear-finish
    edge_rule: visibly-rounded-child-safe-edges-and-corners
  activity_rug:
    material: soft-low-pile-tufted-textile
    pattern: concentric-rounded-rings
    colors: [muted-teal, lavender-blue, pastel-pink, soft-coral, warm-yellow, pale-center]
  storage_bins:
    material: matte-molded-child-safe-plastic
    colors: [pastel-coral, sage-green, muted-teal, soft-blue, golden-yellow]
  planter_pots:
