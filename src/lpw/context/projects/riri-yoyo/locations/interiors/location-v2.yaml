    accents: [pastel-yellow, pastel-pink, muted-teal, soft-blue, gentle-orange, soft-green]
    accent_locations: [bunting, rug, storage-bins, child-artwork, small-learning-props]
  rules:
    - preserve-local-colors-under-warm-sunlight
    - avoid-harsh-contrast-or-deep-threatening-shadows
    - sunlight-always-enters-from-the-left-window-side-in-default-day-state
