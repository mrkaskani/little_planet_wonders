metadata:
  project_id: riri-yoyo
  character_id: yoyo
  title: Yoyo Visual Identity Version 2
  purpose: >-
    Define Yoyo's proposed second visual identity from the supplied turnaround,
    expression, close-up, palette, and scale-and-proportion sheets without
    overwriting the existing approved version.
  created_date: 2026-08-20
  source: project-owner-supplied-design-package
  review_record: ../../validation/yoyo-v2-review.yaml

versioning:
  base_character_authority: character.yaml
  base_reference_id: yoyo-identity-sheet-v001
  candidate_package_id: yoyo-design-package-v002
  replaces_after_approval: yoyo-identity-sheet-v001
  active_canonical_version: v001
  candidate_version: v002
  promotion_rule: >-
    V2 becomes canonical only after explicit project-owner approval. Until then,
    character.yaml and the approved V1 single-frame references remain active.
  changed_fields:
    - canonical-design-review-image-set
    - head-unit-proportions
    - silhouette-measurements
    - face-eye-and-beak-placement
    - canonical-character-colors
    - material-and-close-up-detail-evidence
  unchanged_invariants:
    - canonical-character-id-yoyo
    - protagonist-role
    - emperor-penguin-inspired-chick-species
    - preschool-age-readability
    - playful-curious-friendly-personality
    - rounded-child-safe-shape-language
    - no-default-wardrobe-or-accessories
    - dialogue-voice-music-acting-and-movement-authorities

