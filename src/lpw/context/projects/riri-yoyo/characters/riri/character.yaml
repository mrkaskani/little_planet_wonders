id: riri
type: character-context
version: 2
status: draft

identity:
  name: Riri
  display_name: Riri
  role: protagonist
  narrative_function: sweet companion, cheerful encourager, and gentle emotional anchor
  species: puppy
  breed_inspiration: stylized toy-breed puppy
  gender_presentation: softly-feminine
  age_impression: young child
  perceived_age_range: "3-5"

  target_audience:
    minimum_age: 3
    maximum_age: 6

character_summary: >
  Riri is a sweet, cheerful little puppy with a warm smile and expressive eyes.
  She brings softness, comfort, and joy to every scene. Riri is affectionate,
  friendly, and emotionally open, often helping others feel safe, included,
  and happy. She loves cuddles, playtime, and discovering little beautiful
  things in the world around her.

design_intent:
  core_impression:
    - sweet
    - cheerful
    - warm
    - cuddly
    - gentle
    - playful
    - friendly
    - emotionally-readable

  silhouette_goal: >
    A tiny rounded puppy with a large head, soft chubby body, short legs,
    small floppy ears, and a fluffy curved tail. The silhouette should feel
    plush, instantly lovable, and clearly recognizable even at small sizes.

  personality_visibility: >
    Riri's warmth should be visible through her soft smile, bright open eyes,
    slightly lifted cheeks, cuddly seated posture, and gentle playful movement.

  complexity_level: simple
  child_readability: very-high
  visual_style: premium-soft-3d-preschool-animation
  realism_level: stylized
  shape_language:
    primary: circles-and-soft-ovals
    secondary: rounded-puffs-and-soft-tapers
    forbidden:
      - sharp-angles
      - aggressive-shapes
      - hard-edges

physical_design:
  body_type: tiny-rounded-puppy
  posture: upright-seated-or-soft-stand
  height_category: very-small
  build: plush-chubby
  center_of_gravity: low
  visual_weight: soft-light-cuddly

  proportions:
    head_to_body_ratio: "1:1"
    head_size: oversized
    body_shape: rounded-oval
    torso_length: short
    neck_visibility: minimal
    leg_length: very-short
    paw_size: small-rounded
    tail_length: short-to-medium
    ear_size: small
    symmetry: mostly-symmetrical

  scale:
    approximate_character_height_cm: 35
    comparison: lap-sized-puppy
    scale_consistency_rule: >
      Riri should always read as a very small young puppy, clearly smaller
      than adult characters and slightly smaller than most child companions.

  head:
    shape: large-rounded
    forehead: smooth-and-soft
    cheek_shape: full-round-cheeks
    muzzle_length: short
    muzzle_shape: tiny-soft-rounded
    chin: minimal
    crown_detail: smooth-fluffy-fur
    top_fur_tuft: none-distinct

  ears:
    count: 2
    type: floppy
    size: small
    shape: rounded-triangle-with-soft-fold
    set_position: high-side-of-head
    resting_position: gently-drooped
    movement_style: subtle-bounce-with-expression

  face:
    overall_shape: rounded-soft-puppy-face
    expression_style: highly-readable
    default_expression: warm-cheerful-smile
    cheek_volume: plush
    muzzle_definition: soft
    brow_definition: minimal-soft

  eyes:
    count: 2
    size: oversized
    shape: rounded-oval
    iris_color: bright-sky-blue
    iris_gradient:
      outer: cool-cornflower-blue
      middle: clear-sky-blue
      inner: pale-ice-blue
    pupil_color: near-black
    sclera_color: soft-white
    eye_spacing: medium-wide
    eye_alignment: symmetrical
    highlight_style:
      - one-large-soft-highlight
      - one-small-sparkle-highlight
    eyelash_style: long-curved-upper-lashes
    lower_lash_style: none
    eyebrow_style: subtle-soft-fur-brow
    emotional_readability: very-high

  nose:
    size: tiny
    shape: soft-rounded-triangle
    color: petal-pink
    shine_level: soft-gloss
    nostrils: subtle

  mouth:
    shape: tiny-soft-smile
    default_position: gently-open-or-closed-smile
    corner_expression: slightly-upturned
    interior_color: soft-rose
    tongue_visibility: only-in-big-happy-expressions
    teeth: none

  legs:
    count: 4
    length: very-short
    build: plush-rounded
    stance: stable-and-soft

  paws:
    count: 4
    size: small-rounded
    shape: plush-paw
    fur_color: blush-pink
    pad_color: rosy-pink
    claw_visibility: none
    toe_definition: soft-minimal

  tail:
    count: 1
    length: short-to-medium
    shape: fluffy-plume
    curve: gently-upward
    resting_position: curled-slightly-behind-body
    movement_style: soft-happy-wag

surface_design:
  material_style: ultra-soft-plush-fur
  texture_complexity: low-to-medium
  visible_individual_hairs: only-as-soft-fuzz
  fur_length:
    face: short-soft
    body: short-medium-plush
    chest: slightly-fluffier
    tail: fluffiest-area
    paws: soft-plush
  shine_level: soft-satin
  specular_strength: low
  softness_priority: critical
  avoid:
    - coarse-hair
    - realistic-dog-fur-clumping
    - wiry-texture
    - wet-fur-look
    - plastic-surface

color_palette:
  palette_strategy: >
    Improved from a mostly single-note pink palette into a more production-ready
    pastel system with clearer value separation, cleaner focal accents, and better
    readability across lighting conditions while preserving Riri's soft pink identity.

  primary:
    name: cotton-candy-pink
    hex: "#F5B6D2"
    usage:
      - main-body-fur
      - head
      - ears
      - outer-legs

  primary_shadow:
    name: rose-blush
    hex: "#E79BBC"
    usage:
      - form-shadows
      - ear-fold-shadows
      - body-depth
      - tail-shadow

  light_fur:
    name: strawberry-milk
    hex: "#FBE3EE"
    usage:
      - muzzle
      - inner-cheeks
      - belly-highlights
      - forehead-soft-highlights

  accent_fur:
    name: pastel-periwinkle
    hex: "#BFD4FF"
    usage:
      - chest-fur-accent
      - front-paw-accent-fur
      - tail-accent-fur

  accent_shadow:
    name: powder-blue
    hex: "#93B7F2"
    usage:
      - shadowed-blue-fur-accent
      - cool-detail-depth

  iris_outer:
    name: cornflower-blue
    hex: "#5E84D8"

  iris_middle:
    name: sky-blue
    hex: "#7FC6FF"

  iris_inner:
    name: ice-blue
    hex: "#D7EEFF"

  pupil:
    name: near-black
    hex: "#1A1A22"

  sclera:
    name: soft-white
    hex: "#FFFDFE"

  nose:
    name: petal-pink
    hex: "#F2A6BC"

  mouth_interior:
    name: warm-rose
    hex: "#C8788E"

  paw_pads:
    name: candy-rose
    hex: "#EFA1BB"

  eye_highlight:
    name: bright-white
    hex: "#FFFFFF"

markings:
  base_fur:
    color: cotton-candy-pink
    coverage: full-body-base

  muzzle_highlight:
    shape: soft-rounded-muzzle-area
    color: strawberry-milk
    position: center-lower-face
    symmetry: symmetrical

  chest_accent:
    shape: soft-fluffy-inverted-teardrop
    color_mix:
      base: strawberry-milk
      accent: pastel-periwinkle
    position: center-chest
    edge_style: feather-soft

  front_paw_accents:
    shape: soft-fur-cuffs
    color_mix:
      base: blush-pink
      accent: pastel-periwinkle
    placement:
      - front-left-paw
      - front-right-paw
    symmetry: mostly-symmetrical

  tail_accent:
    shape: blended-tip-and-inner-streak
    color_mix:
      base: cotton-candy-pink
      accent: pastel-periwinkle
    position: tail
    style: soft-gradient-like-blend

  distinctive_features:
    - oversized-blue-expressive-eyes
    - long-curved-upper-eyelashes
    - tiny-petal-pink-nose
    - warm-smiling-mouth
    - plush-cotton-candy-pink-fur
    - soft-blue-fur-accents-on-chest-paws-and-tail
    - tiny-floppy-ears
    - fluffy-curved-tail
    - visible-rosy-paw-pads

hair_or_fur_details:
  type: plush-puppy-fur
  overall_length: short-medium
  density: high
  softness: extremely-soft
  chest_detail: slightly-longer-fluff
  tail_detail: fluffiest-and-most-airy
  ear_detail: short-velvety-fur
  paw_detail: plush-rounded-fur
  movement: >
    Fur should react subtly to movement with soft bounce and volume,
    but must remain neat, simplified, and easy to reproduce.

wardrobe:
  shared_catalog: ../../assets/costumes.yaml
  default:
    enabled: false
    outfit_id: none
    description: Riri normally appears without clothing.

  optional_signature_accessory:
    enabled: false
    rule: >
      No accessory should be added unless a specific scene or episode
      explicitly requests one.

accessories:
  shared_catalog: ../../assets/costumes.yaml
  default:
    enabled: false
    items: []

  rule: >
    Do not add bows, collars, tags, jewelry, shoes, hats, or props
    unless explicitly requested.

personality:
  primary_traits:
    - sweet
    - cheerful
    - affectionate
    - gentle
    - friendly
    - playful

  secondary_traits:
    - encouraging
    - cuddly
    - curious
    - sensitive
    - eager-to-please
    - softly-excitable

  social_style: warm-and-welcoming
  emotional_openness: very-high
  confidence_level: medium
  patience_level: high
  empathy_level: very-high
  problem_solving_style: gentle-persistence
  comfort_style:
    - nuzzles-friends
    - stays-close
    - offers-soft-encouragement
    - cheers-others-on

behavior:
  default_energy_level: medium-high
  attention_style: attentive-and-curious
  reaction_style: immediate-but-gentle
  recovery_style: calm-and-positive

  friendship_behavior:
    - greets-others-warmly
    - smiles-often
    - comforts-sad-friends
    - celebrates-small-successes
    - invites-others-to-play
    - stays-close-when-someone-feels-shy

  recurring_habits:
    - tilts-head-when-listening
    - gives-tiny-happy-tail-wags
    - bounces-lightly-when-excited
    - sits-neatly-with-paws-forward
    - nuzzles-softly
    - blinks-slowly-when-content

  emotional_arc_rule: >
    Riri's emotions should remain gentle, easy to read, and reassuring.
    If she becomes worried or sad, she should recover clearly through
    comfort, friendship, or a hopeful action.

movement_language:
  general_style: soft-bouncy-gentle-and-readable
  movement_scale: small
  movement_speed: light-and-playful
  acceleration: soft
  stopping_style: tiny-safe-stop-or-sit
  balance_style: stable-and-cute
  center_of_motion: head-and-tail-led

  walk_style:
    name: tiny-cheerful-trot
    stride: short
    rhythm: light-even
    body_motion: gentle-bob
    tail: small-wag

  run_style:
    name: playful-mini-bound
    stride: short
    speed: lively-but-soft
    ears: gentle-bounce
    tail: fluff-swish

  turn_style:
    name: quick-paw-pivot
    footwork: two-small-steps
    head_lead: slight

  jump_style:
    name: tiny-four-paw-hop
    height: low
    landing: soft
    squash_and_stretch: subtle

  idle_motion:
    - soft-breathing-bob
    - occasional-slow-blink
    - tiny-tail-sway
    - subtle-head-tilt
    - paw-adjustment

  excitement_motion:
    - tail-wags-faster
    - front-paws-lift-slightly
    - eyes-open-wider
    - body-leans-forward
    - tiny-bounce

  curiosity_motion:
    - head-tilt
    - one-ear-lifts-slightly
    - eyes-focus
    - nose-points-forward

  surprise_motion:
    - eyes-open-wide
    - mouth-opens-small
    - body-pauses
    - ears-lift-slightly

  fear_motion:
    - body-lowers-gently
    - tail-tucks-partially
    - eyes-widen
    - stays-close-to-friend
    - recovery-should-be-quick-and-reassuring

  sadness_motion:
    - head-lowers
    - ears-droop-more
    - smile-softens
    - body-stillness-increases

  determination_motion:
    - eyes-focus-forward
    - mouth-closes-softly
    - paws-set-firmly
    - posture-lifts

expression_library:
  neutral:
    eyes: naturally-open-and-soft
    mouth: tiny-warm-smile
    ears: gently-relaxed
    posture: upright-relaxed

  happy:
    eyes: bright-and-softly-curved
    mouth: open-smile
    cheeks: slightly-lifted
    posture: open-and-inviting
    tail: wagging

  excited:
    eyes: wide-and-sparkling
    mouth: bigger-smile
    ears: perked-slightly
    posture: forward-lean
    tail: energetic-wag

  curious:
    eyes: focused
    mouth: small-soft-smile
    head: tilted
    posture: alert-but-gentle

  surprised:
    eyes: fully-wide
    mouth: small-open-o-smile
    ears: lifted-softly
    posture: slight-stillness

  sad:
    eyes: slightly-lowered
    mouth: softly-downturned
    ears: drooped
    posture: small-and-close

  worried:
    eyes: wide-with-soft-upper-lids
    mouth: slightly-open
    ears: lowered
    posture: cautious-and-close

  determined:
    eyes: focused-forward
    mouth: closed-softly
    ears: lightly-set
    posture: sturdy-and-ready

  affectionate:
    eyes: soft-and-gentle
    mouth: tiny-smile
    posture: leaning-in
    tail: soft-sway

dialogue_style:
  sentence_length: short
  vocabulary_level: preschool
  tone: sweet-positive-direct

  preferred_language_patterns:
    - gentle-encouragement
    - happy-observations
    - invitations-to-play
    - caring-questions
    - reassuring-statements

  common_phrases:
    - "Hi, friend!"
    - "Let's play!"
    - "You can do it!"
    - "It's okay."
    - "That makes me happy!"
    - "Come with me!"
    - "I can help!"

  avoid:
    - sarcasm
    - insults
    - long-complex-sentences
    - mean-spirited-language
    - threatening-language

camera_readability:
  preferred_framing:
    - full-body
    - seated-full-body
    - medium-close-up
    - close-up-face

  eye_line_height: child-friendly
  preferred_camera_angle: eye-level

  avoid_angles:
    - extreme-low-angle
    - extreme-high-angle
    - distorted-close-up
    - angles-hiding-face
    - back-view-without-tail-readability

  silhouette_requirements:
    - ears-must-remain-readable
    - tail-must-remain-readable
    - head-must-read-larger-than-body
    - paws-must-not-merge-into-body
    - seated-pose-must-remain-clear

reference_views:
  required:
    - front
    - three-quarter-front
    - side
    - back

  expression_sheet_required: true
  pose_sheet_required: true
  color_palette_sheet_required: true
  scale_reference_required: true

reference_image_guidance:
  design_review_references_required: true
  generation_reference_policy: task-specific
  approved_generation_reference_status: missing

  authoritative_features:
    - preserve-character-identity-from-reference
    - preserve-stable-facial-features
    - preserve-stable-body-proportions
    - preserve-stable-markings
    - preserve-canonical-color-regions

  ignore_from_reference:
    - ignore-reference-background
    - ignore-reference-lighting-color-cast
    - ignore-reference-generation-artifacts
    - ignore-pose-specific-deformation

  conflict_resolution: >
    Approved canonical YAML and the approved identity reference must agree.
    Block generation for review when they conflict; never silently redesign
    Riri or refine her canonical palette during video generation.

  generation_input_rules:
    - use-one-coherent-single-frame-image
    - never-use-turnaround-expression-or-pose-sheet-as-conditioning-frame
    - require-correct-anatomy-and-clear-silhouette
    - require-action-compatible-starting-pose-and-movement-space
    - remove-text-labels-watermarks-and-additional-characters

wan_2_2_interface:
  contract_source: ../../wan22-preproduction.yaml
  t2v:
    eligibility: exploratory-or-distant-use-only
    exact-recurring-identity-approval: forbidden-without-source-image
  ti2v_text:
    eligibility: draft-only
    evaluate:
      - broad-puppy-silhouette
      - pink-blue-color-separation
      - simple-motion-direction
  ti2v_image:
    eligibility: requires-approved-single-frame-reference
  i2v:
    eligibility: requires-approved-single-frame-reference
    prompt_schema:
      - current-state
      - one-action-with-direction-speed-and-endpoint
      - one-camera-behavior
      - identity-invariants
  s2v:
    eligibility: requires-approved-single-frame-reference-and-locked-clean-speech
    preferred_frames:
      - neutral-half-body-front-or-three-quarter
      - neutral-full-body-front-or-three-quarter
    face_invariants:
      - blue-eye-shape-size-and-highlights
      - petal-pink-nose
      - short-readable-muzzle
      - stable-mouth-edges
      - clean-fur-color-boundaries
    silence_rule: mouth-rests-when-speech-is-absent

continuity_constraints:
  identity:
    - preserve facial identity
    - preserve species
    - preserve age impression
    - preserve head-to-body ratio
    - preserve eye size and spacing
    - preserve ear shape
    - preserve tail fluff shape
    - preserve warm smile

  colors:
    - preserve overall pink identity
    - preserve blue eyes
    - preserve pink nose
    - preserve blue accent fur on chest paws and tail
    - improve palette clarity without changing the core look

  body:
    - preserve rounded puppy body
    - preserve short legs
    - preserve tiny floppy ears
    - preserve fluffy curved tail
    - preserve plush seated readability

  wardrobe:
    - do not add clothing unless requested
    - do not add default accessories

  personality:
    - preserve sweet cheerful personality
    - preserve affectionate warmth
    - preserve gentle playful motion

forbidden_changes:
  - changing Riri into another animal species
  - making Riri older or adult-looking
  - making the body thin
  - making the legs long
  - making the ears large and upright
  - removing the fluffy tail
  - changing the eye color away from blue
  - changing the base pink identity
  - removing the warm smile
  - removing the long upper eyelashes
  - changing the nose color to black
  - adding teeth
  - adding visible claws
  - adding realistic fur detail
  - making the design photorealistic
  - making the design frightening
  - making the design aggressive
  - adding unrequested collar
  - adding unrequested bow
  - adding unrequested clothing
  - adding unrequested jewelry
  - adding text or logos
  - changing temporary lighting into permanent fur color
  - copying background bokeh as character markings
  - adding extra limbs
  - removing limbs
  - distorting paw structure
  - creating asymmetrical eyes
  - changing the smile into a smirk or sneer

child_safety:
  age_range: "3-6"

  design_requirements:
    - soft-rounded-shapes
    - friendly-readable-face
    - no-sharp-anatomical-features
    - no-frightening-details
    - no-realistic-violence
    - no-sexualized-design
    - no-dangerous-accessories

  motion_requirements:
    - actions-must-be-easy-to-read
    - avoid-chaotic-motion
    - avoid-dangerous-imitation
    - avoid-long-distress-reactions

  emotional_requirements:
    - fear-must-be-brief-and-gentle
    - sadness-must-have-clear-recovery
    - conflicts-must-remain-safe
    - comfort-must-follow-worry

generation_guidance:
  t2v_identity_fragment: >
    One tiny rounded pink plush puppy named Riri, oversized head, very short
    legs, small floppy ears, fluffy curved tail, bright blue eyes, petal-pink
    nose, periwinkle chest paw and tail accents, warm gentle smile.

  i2v_preservation_fragment: >
    Preserve Riri's approved face, proportions, pink-and-periwinkle color regions,
    blue eyes, floppy ears, plush tail, and soft fur; change only the requested motion.

  ti2v_draft_fragment: >
    Tiny rounded pink plush puppy, oversized head, short legs, floppy ears,
    blue eyes, simple stable color regions and one clear action.

  s2v_face_fragment: >
    Preserve Riri's eyes, nose, muzzle, mouth edges, cheeks, eyelashes, and short
    facial fur without shimmer or pulsing during speech.

  concise_negative_fragment: >
    realistic dog, photoreal fur, wet or wiry fur, long legs, upright ears,
    black nose, changed eyes or markings, accessories, anatomy drift, extra limbs,
    additional characters, text, logo, watermark.

asset_requirements:
  primary_generation_reference:
    expected_path: assets/characters/riri/reference.png
    status: missing
    required_for:
      - i2v
      - s2v
  character_turnaround:
    expected_path: assets/characters/riri/turnaround.png
    status: missing
    use: identity-review-only
  expression_sheet:
    expected_path: assets/characters/riri/expressions.png
    status: missing
    use: identity-review-only
  pose_sheet:
    expected_path: assets/characters/riri/poses.png
    status: missing
    use: identity-review-only
  palette_sheet:
    expected_path: assets/characters/riri/palette.png
    status: missing
    use: identity-review-only

metadata:
  created_for_project: riri-yoyo
  approval_required: true
  continuity_priority: critical
  reusable_across_episodes: true
  palette_refined: true
  palette_refinement_goal: improved-readability-and-animation-consistency
