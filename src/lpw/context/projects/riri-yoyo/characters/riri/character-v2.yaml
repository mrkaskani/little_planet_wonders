metadata:
  project_id: riri-yoyo
  character_id: riri
  title: Riri Visual Identity Version 2
  purpose: >-
    Define Riri's proposed second visual identity from the supplied turnaround,
    expression, close-up, palette, and scale-and-proportion sheets without
    overwriting the existing approved version.
  created_date: 2026-08-20
  source: project-owner-supplied-design-package
  review_record: ../../validation/riri-v2-review.yaml

versioning:
  base_character_authority: character.yaml
  base_reference_id: riri-identity-sheet-v001
  candidate_package_id: riri-design-package-v002
  replaces_after_approval: riri-identity-sheet-v001
  active_canonical_version: v002
  candidate_version: v002
  promotion_rule: >-
    V2 was explicitly approved by the project owner on 2026-08-27 and is now
    the canonical visual identity. character.yaml remains the authority only
    for inherited nonvisual behavior, voice, music, acting, and movement fields.
  changed_fields:
    - canonical-design-review-image-set
    - head-unit-proportions
    - silhouette-measurements
    - face-eye-muzzle-nose-and-mouth-placement
    - canonical-character-colors
    - material-and-close-up-detail-evidence
  unchanged_invariants:
    - canonical-character-id-riri
    - protagonist-role
    - stylized-toy-breed-puppy-species
    - preschool-age-readability
    - sweet-cheerful-gentle-playful-personality
    - rounded-child-safe-shape-language
    - no-default-wardrobe-or-accessories
    - dialogue-voice-music-acting-and-movement-authorities

