movement_rules:
  global:
    id: riri-yoyo-preschool-cinematography-movement
    version: 2
    status: approved
    wan_2_2_contract: ../wan22-preproduction.yaml
    philosophy: let_characters_create_energy_first_and_camera_support_them_second_keep_dialogue_and_learning_stable_make_exploration_gently_fluid_let_action_and_music_become_more_dynamic_and_return_to_clear_comfortable_stability_before_the_child_needs_to_understand_feel_or_respond
    goal: cinematic_lively_story_movement_without_chaos_distraction_dizziness_fear_or_confusion
    production_uses:
      - storyboarding
      - previz
      - shot_generation
      - ai_video_generation
      - animation
      - camera_layout
      - editing
      - motion_review
      - final_visual_qc
    works_with:
      - camera-language.yaml
      - composition-rules.yaml
      - lens-package.yaml
      - character_blocking
      - environment_blocking
      - dialogue_timing
      - lip_sync
      - sound_effects
      - music
      - editing_rhythm

  wan_2_2_interface:
    primary_action_count: 1
    camera_behavior_count: 1
    default_speed: slow-controlled
    action_schema:
      - moving-character-body-part-or-object
      - direction
      - speed
      - range
      - repetition-count
      - endpoint
      - locked-regions
    complexity_priority:
      - primary-character-action
      - essential-prop-contact
      - facial-expression
      - camera-motion
      - background-motion
    t2v:
      rule: describe-one-visible-directional-action-that-fits-the-duration
    i2v:
      rules:
        - begin-from-a-pose-compatible-with-the-source-frame
        - limit-moving-body-regions
        - keep-nonparticipating-body-and-background-stable
        - prefer-locked-camera-for-contact-or-anatomy-sensitive-action
    ti2v:
      role: test-motion-direction-scope-and-endpoint-before-a14b
    s2v:
      rules:
        - audio-controls-mouth-and-performance-timing
        - gestures-follow-emphasis-and-settle-during-pauses
        - no-speech-like-mouth-motion-during-silence
        - avoid-large-body-motion-with-complex-camera-motion
    failure_response:
      - simplify-action-before-searching-more-seeds
      - lock-camera-before-increasing-motion-complexity
      - shorten-segment-when-identity-or-background-drifts

  audience:
    minimum_age: 3
    maximum_age: 6
    developmental_stage: preschool
    prioritize_visual_comprehension: true
    prioritize_character_readability: true
    prioritize_emotional_clarity: true
    prioritize_spatial_clarity: true
    avoid_visual_overstimulation: true
    allow_medium_to_high_energy_when_story_motivated: true

  core_philosophy:
    camera_moves_only_when_story_motivated: true
    every_movement_must_do_at_least_one:
      - follow_character
      - reveal_information
      - strengthen_emotion
      - establish_spatial_relationships
      - support_action
      - guide_viewer_attention
      - introduce_location
      - emphasize_discovery
      - support_comedy
      - support_musical_rhythm
      - transition_between_story_information
    required_qualities:
      - smooth
      - controlled
      - predictable
      - readable
      - child_friendly
      - physically_coherent
    rules:
      never_move_only_because_shot_feels_static: true
      avoid_unnecessary_visual_instability: true
      movement_must_settle_on_meaningful_information: true
      comprehension_has_priority_over_motion_style: true

  energy_scale:
    normalized_range:
      minimum: 0.0
      maximum: 1.0
    definitions:
      0.0: completely_locked
      0.2: almost_static
      0.4: gentle_cinematic_motion
      0.6: active_tracking_or_playful_motion
      0.8: energetic_action_motion
      1.0: extreme_motion
    preschool_limits:
      default:
        minimum: 0.0
        maximum: 0.6
      special_sequences:
        maximum: 0.75
      absolute_maximum: 0.8
      above_absolute_maximum_forbidden: true
    recommended_ranges:
      dialogue: {minimum: 0.0, maximum: 0.25}
      learning: {minimum: 0.0, maximum: 0.2}
      participation: {minimum: 0.0, maximum: 0.0}
      emotion: {minimum: 0.0, maximum: 0.25}
      exploration: {minimum: 0.2, maximum: 0.45}
      discovery: {minimum: 0.2, maximum: 0.5}
      comedy: {minimum: 0.2, maximum: 0.6}
      walking: {minimum: 0.2, maximum: 0.45}
      running: {minimum: 0.4, maximum: 0.7}
      celebration: {minimum: 0.4, maximum: 0.7}
      musical: {minimum: 0.3, maximum: 0.7}
      action: {minimum: 0.4, maximum: 0.7}
      mild_danger: {minimum: 0.2, maximum: 0.5}

  motion_priority:
    hierarchy:
      story_action: highest
      character_performance: very_high
      camera_motion: supporting
      background_motion: low
      decorative_motion: lowest
    dominant_motion_sources_per_shot: 1
    rules:
      camera_must_not_compete_with_main_character_action: true
      simplify_camera_when_character_motion_is_energetic: true
      gentle_camera_energy_may_support_still_character: true
      avoid_simultaneous_maximum_character_camera_background_editing_and_sfx_energy: true
      reduce_background_motion_when_camera_motion_is_high: true

  locked_camera:
    energy: 0.0
    preferred_for:
      - participation_pause
      - important_dialogue
      - educational_demonstration
      - emotional_reassurance
      - direct_to_camera_speaking
      - important_reaction
      - object_identification
      - counting
      - shape_recognition
      - visual_concentration
    allowed_subject_motion:
      - character_animation
      - environmental_micro_motion
      - subtle_performance
    participation_forbidden:
      - pan
      - tilt
      - dolly
      - orbit
      - zoom
      - crane
      - reframing
      - focus_driven_camera_shift

  dolly:
    purpose: physically_move_camera_closer_to_or_farther_from_subject
    allowed_for:
      - emotional_connection
      - curiosity
      - discovery
      - important_information
      - environment_to_character_transition
      - environment_reveal
    preferred_speed: slow_to_moderate
    acceleration: gentle
    deceleration: gentle
    rules:
      avoid_abrupt_start: true
      avoid_abrupt_stop: true
      preserve_character_proportions: true
    in:
      uses:
        - emotional_emphasis
        - curiosity
        - realization
        - discovery
        - important_story_information
        - reassurance
      intensity: {minimum: 0.15, maximum: 0.4}
      rules:
        do_not_use_for_every_important_line: true
        do_not_make_preschool_danger_feel_threatening: true
    out:
      uses:
        - reveal_environment
        - reveal_another_character
        - intimate_to_group_context
        - end_scene
        - show_activity_scale
      intensity: {minimum: 0.15, maximum: 0.4}
      rules:
        newly_revealed_information_must_be_understandable: true

  tracking:
    role: primary_movement_language_for_characters_in_motion
    uses:
      - walking
      - running
      - exploring
      - dancing
      - carrying_objects
      - group_movement
      - playful_chase
    styles:
      - lateral_tracking
      - front_tracking
      - rear_tracking
      - three_quarter_tracking
      - gentle_parallel_tracking
    preserve:
      - character_scale
      - character_identity
      - lead_room
      - movement_direction
      - stable_horizon
      - intended_camera_distance
    rules:
      avoid_excessive_distance_change: true
      specify_distance_behavior: true
      keep_tracking_speed_smooth: true

  lateral_tracking:
    safety_role: safest_default_for_preschool_action
    preferred_for:
      - walking
      - running
      - travel
      - physical_comedy
      - side_to_side_play
    advantages:
      - clear_body_silhouette
      - understandable_movement_direction
      - predictable_spatial_geography
    rules:
      avoid_sudden_reversal: true
      preserve_lead_room: true

  front_tracking:
    movement_relationship: camera_retreats_smoothly_as_character_approaches
    preferred_for:
      - joyful_running
      - exploration
      - group_movement
      - musical_sequence
    rules:
      preserve_safe_distance: true
      prevent_rapid_character_scale_growth: true
      maintain_stable_facial_proportions: true

  rear_follow:
    preferred_for:
      - entering_new_space
      - exploration
      - transition
      - discovery
    rules:
      keep_destination_or_direction_clear: true
      avoid_close_view_that_obscures_environment: true
      preserve_character_silhouette: true

  pan:
    preferred_speed: slow_to_moderate
    allowed_styles:
      - gentle_pan
      - controlled_follow_pan
      - playful_short_pan
    uses:
      - follow_movement
      - reveal_adjacent_object
      - reveal_another_character
      - establish_spatial_connection
      - connect_story_information
    rules:
      begin_on_meaningful_information: true
      end_on_meaningful_information: true
      fast_pan_is_rare: true
    avoid:
      - repeated_left_right_searching
      - rapid_oscillation
      - aggressive_whip_pan
      - unmotivated_scanning

  tilt:
    preferred_speed: slow_to_moderate
    uses:
      - reveal_height
      - follow_vertical_character_motion
      - introduce_tall_object
      - reveal_above_or_below
      - follow_climbing_or_jumping
    rules:
      avoid_disorienting_extreme_angle: true
      preserve_spatial_understanding: true
      settle_horizon_after_tilt: true

  crane:
    preferred_speed: slow_to_moderate
    qualities:
      - smooth
      - graceful
      - expansive
      - joyful
    uses:
      - establishing_scene
      - environment_reveal
      - celebration
      - musical_sequence
      - transition
      - group_activity
      - ending_sequence
    rules:
      avoid_large_rapid_vertical_displacement: true
      avoid_dramatic_or_intimidating_feeling: true
      preserve_character_readability: true

  push_in:
    definition: subtle_forward_motion_that_emphasizes_attention
    preferred_speed: very_slow_to_slow
    uses:
      - curiosity
      - emotional_connection
      - discovery
      - important_reaction
      - story_realization
    rules:
      keep_distance_restrained: true
      avoid_constant_push_ins: true
      preserve_story_significance: true

  pull_out:
    uses:
      - reveal_context
      - show_group_relationship
      - end_emotional_moment
      - expose_larger_playful_situation
      - individual_to_environment_transition
    rules:
      move_slowly_enough_for_new_information_to_read: true
      settle_on_clear_final_composition: true

  orbit:
    default_usage: limited
    preferred_arc_degrees: {minimum: 10, maximum: 35}
    normal_maximum_arc_degrees: 45
    exceptional_maximum_arc_degrees: 60
    preferred_speed: slow_to_moderate
    allowed_for:
      - celebration
      - musical_sequence
      - magical_discovery
      - gentle_group_interaction
      - selected_hero_moment
    forbidden_during:
      - learning
      - participation
      - serious_dialogue
      - worry
      - sadness
      - important_lip_sync
      - visually_complex_action
    rules:
      full_360_orbit_not_routine: true
      avoid_with_rapid_character_movement: true
      preserve_horizon_and_character_scale: true

  handheld:
    default_allowed: false
    maximum_intensity: 0.15
    conditional_uses:
      - playful_action
      - mild_surprise
      - gentle_environmental_instability
      - carefully_controlled_danger
    must_never_resemble:
      - panic
      - documentary_chaos
      - horror
      - violent_impact
      - unstable_action_cinema
    rules:
      return_quickly_to_stable_camera: true
      require_explicit_story_justification: true

  camera_shake:
    default_allowed: false
    maximum_intensity: 0.1
    maximum_duration: very_short
    conditional_use: subtle_impact_response_for_specific_comedy_or_environment_event
    forbidden_for:
      - fear
      - crying
      - threats
      - loud_sounds
      - normal_running
      - dialogue
    rules:
      object_impact_does_not_automatically_require_shake: true

  zoom:
    avoid_visible_zoom: true
    prefer_physical_camera_movement: true
    conditional_zoom:
      speed: slow
      intensity: subtle
      frequency: rare
      story_motivation_required: true
    forbidden:
      - crash_zoom
      - snap_zoom
      - repeated_zoom
      - zoom_pumping
      - uncontrolled_ai_zoom
    rules:
      never_change_character_proportions_accidentally: true

  dialogue:
    default_camera: locked_or_nearly_locked
    energy: {minimum: 0.0, maximum: 0.25}
    allowed:
      - extremely_slow_push_in
      - restrained_tracking_for_walking_character
      - gentle_reframe
      - subtle_two_shot_adjustment
    avoid:
      - orbit
      - strong_crane
      - unnecessary_pan
      - handheld
      - zoom
      - continuous_camera_drift
    rules:
      avoid_acceleration_on_important_words: true
      dialogue_intelligibility_has_priority: true
      lip_sync_visibility_has_priority: true

  lip_sync:
    normal_maximum_energy: 0.35
    key_dialogue_maximum_energy: 0.2
    preserve:
      - mouth_visibility
      - face_scale
      - viewing_angle
      - foreground_clearance
    avoid:
      - rapid_perspective_change
      - strong_foreground_occlusion
      - excessive_motion_blur

  educational:
    preferred_camera: locked
    energy: {minimum: 0.0, maximum: 0.2}
    conditionally_allowed:
      - slow_pan_between_comparison_objects
      - gentle_tracking_with_character_demonstration
      - subtle_dolly_to_reveal_learning_object
      - clear_object_to_character_reframe
    rules:
      never_distort_educational_relationship: true
      sizes_keep_camera_distance_between_objects_constant: true
      shapes_avoid_distorting_angles: true
      counting_keep_complete_set_visible_during_count: true
      colors_avoid_changing_lighting_during_movement: true

  participation:
    camera: locked
    energy: 0.0
    hold_seconds:
      minimum: 3
      preferred: 4
      maximum: 5
    communicate: now_it_is_the_childs_turn
    response_window_forbidden:
      - camera_motion
      - reframing
      - zoom
      - rack_focus
      - camera_shake
      - background_camera_parallax
      - new_visual_reveal

  walking:
    energy: {minimum: 0.2, maximum: 0.45}
    preferred_camera:
      - lateral_tracking
      - gentle_front_tracking
      - gentle_rear_follow
      - locked_wide
    rules:
      keep_pace_comfortable: true
      do_not_circle_constantly: true
      maintain_visible_destination_when_relevant: true

  running:
    energy: {minimum: 0.4, maximum: 0.7}
    preferred_camera:
      - lateral_tracking
      - smooth_front_tracking
      - controlled_rear_follow
      - medium_wide_locked_camera
      - gentle_pan_follow
    forbidden_combinations:
      - [fast_running, fast_orbit]
      - [fast_running, heavy_camera_shake]
      - [fast_running, rapid_zoom]
    rules:
      keep_character_readable: true
      maintain_clear_direction: true
      preserve_lead_room: true

  jumping:
    preferred_camera:
      - stable
      - gentle_vertical_follow
      - small_controlled_tilt
      - wider_framing
    rules:
      do_not_rise_aggressively_with_every_jump: true
      preserve_takeoff_and_landing_geography: true
      keep_ground_reference_visible_when_helpful: true

  dancing:
    allowed:
      - smooth_tracking
      - gentle_crane
      - restrained_orbit
      - controlled_push_pull
      - locked_wide
      - medium_tracking
    rules:
      movement_may_respond_to_musical_phrasing: true
      do_not_move_on_every_beat: true
      choreography_remains_dominant_motion: true

  musical_sequences:
    energy: {minimum: 0.35, maximum: 0.7}
    allowed:
      - tracking
      - crane
      - gentle_orbit
      - rhythmic_pan
      - push_pull
      - motivated_transition
    rules:
      follow_musical_phrase_not_every_beat: true
      alternate_active_and_calm_shots: true
      avoid_continuous_high_energy_for_entire_song: true

  comedy:
    story_beats:
      - setup
      - anticipation
      - payoff
      - reaction
    physical_comedy:
      framing: wider
      camera: stable_or_restrained_follow
    reaction_comedy:
      allowed:
        - locked
        - subtle_push
        - gentle_reframe
    rules:
      short_fast_pan_only_when_needed_to_reveal_payoff: true
      do_not_make_camera_itself_the_repeated_joke: true
      keep_comedic_action_visible: true

  discovery:
    sequence:
      - establish_character_attention
      - gently_follow_gaze_or_action
      - reveal_object
      - hold_for_comprehension
      - show_character_reaction
    preferred:
      - slow_push
      - gentle_pan
      - short_track
      - controlled_crane
      - reveal_from_foreground
    rules:
      do_not_reveal_important_discovery_through_rapid_movement: true

  exploration:
    preferred:
      - tracking
      - gentle_crane
      - slow_pan
      - mild_push
      - rear_follow
    rules:
      continuous_motion_may_be_slightly_higher: true
      preserve_clear_geography: true
      avoid_aimless_floating_camera: true

  celebration:
    energy: {minimum: 0.45, maximum: 0.7}
    preferred:
      - crane_up
      - gentle_orbit
      - smooth_push
      - group_tracking
      - controlled_pull_out
    rules:
      may_feel_larger_than_normal_storytelling: true
      preserve_face_and_gesture_readability: true

  emotional:
    energy: {minimum: 0.0, maximum: 0.25}
    preferred:
      - locked
      - extremely_slow_push
      - gentle_pull_out
      - very_small_reframe
    emotion_primary_sources:
      - character_acting
      - facial_expression
      - pose
      - voice
      - music
    rules:
      camera_manipulation_remains_secondary: true

  sadness_and_worry:
    camera: stable
    avoid:
      - rapid_push_in
      - handheld
      - extreme_pull_back
      - orbit
      - looming_movement
      - sudden_reframing
    rules:
      visual_intensity_remains_gentle: true

  reassurance:
    reduce_camera_movement: true
    preferred:
      - locked
      - gentle_push
      - gentle_pull_out_to_two_shot
    rules:
      return_horizon_to_stability: true
      communicate_visual_safety: true

  danger:
    maximum_energy: 0.5
    allowed:
      - subtle_tracking
      - gentle_follow
      - very_light_justified_instability
    avoid:
      - frantic_handheld
      - violent_shake
      - rapid_pov
      - aggressive_push_in
      - predator_tracking
      - chaotic_camera_changes
      - extremely_fast_pursuit_camera
    viewer_must_understand:
      - character_location
      - problem_location
      - safety_location

  point_of_view:
    frequency: sparse
    qualities:
      - smooth
      - slow
      - predictable
    avoid:
      - simulated_head_bob
      - fast_turn
      - sudden_downward_look
      - aggressive_forward_motion
      - falling_pov
      - horror_pov
      - predator_pov
    rules:
      prevent_motion_sickness: true
      require_clear_story_reason: true

  subject_distance:
    ai_video_must_preserve_intentional_distance: true
    tracking_distance_behavior_required:
      - constant
      - increasing
      - decreasing
    prevent:
      - creeping_closer
      - drifting_farther
      - character_scale_pumping
      - focal_length_drift
      - perspective_drift
    rules:
      never_leave_distance_behavior_ambiguous: true

  camera_height:
    allowed:
      - eye_level
      - character_eye_level
      - slightly_above_when_needed
      - slightly_below_when_needed
    rules:
      height_must_remain_intentional: true
      no_random_vertical_float_during_tracking: true
      vertical_movement_requires_explicit_motivation: true

  horizon:
    stable_by_default: true
    roll_tolerance: very_low
    intentional_dutch_angle_allowed: false
    avoid:
      - roll_drift
      - accidental_dutch_angle
      - rocking_horizon
      - rotational_wobble

  acceleration:
    ease_in: true
    ease_out: true
    preferred_acceleration: gentle
    preferred_deceleration: gentle
    rules:
      avoid_instantaneous_start: true
      fast_acceleration_requires_selected_comedy_or_action_beat: true

  direction_changes:
    rules:
      avoid_sudden_reversal: true
      require_character_or_story_motivation: true
      allow_viewer_orientation_time: true
      use_smooth_deceleration: true
      transition_direction_clearly: true
      avoid_repeated_left_right_left_right_motion: true

  movement_duration:
    required_structure:
      - clear_start
      - clear_middle
      - clear_end
    every_movement_must_settle: true
    settle_before:
      - dialogue
      - educational_information
      - reaction
      - participation_prompt
      - scene_ending
    rules:
      avoid_continuous_drift_without_destination: true

  motion_blur:
    style: controlled_cinematic
    must_not_obscure:
      - face
      - eyes
      - mouth
      - character_identity
      - important_object
      - educational_information
    errors:
      - excessive_pan_blur
      - excessive_tracking_blur
      - ai_generated_smear
      - temporal_deformation

  parallax:
    purpose: reinforce_environmental_depth
    stronger_allowed_during:
      - tracking
      - exploration
      - environment_reveal
    physical_rule: foreground_moves_faster_than_background
    avoid:
      - extreme_foreground_streaking
      - repeated_foreground_face_occlusion

  foreground_passes:
    frequency: sparse
    uses:
      - transition
      - environmental_depth
      - scene_reveal
    must_not_obscure:
      - important_dialogue
      - emotional_acting
      - educational_content
      - participation_prompt

  environmental_motion:
    coordinate_with:
      - trees
      - water
      - clouds
      - vehicles
      - background_characters
      - moving_props
    rules:
      avoid_every_layer_moving_strongly_at_once: true
      reduce_background_motion_when_camera_motion_is_high: true
      preserve_primary_motion_hierarchy: true

  multi_character_movement:
    camera_follows: story_leader
    group_rules:
      establish_group_geography: true
      identify_primary_mover: true
      retain_secondary_characters_when_useful: true
      avoid_rapid_target_switching: true
      do_not_reframe_for_every_moving_character: true

  movement_across_cuts:
    maintain_direction_continuity: true
    example:
      before_cut: screen_left_to_screen_right
      after_cut: preserve_screen_left_to_screen_right
    exception: clear_reorientation_shot
    rules:
      avoid_contradictory_direction_that_confuses_geography: true

  scene_transitions:
    preferred:
      - character_motion_wipe
      - object_wipe
      - gentle_pan_transition
      - environmental_occlusion
      - match_on_action
      - smooth_pull_out
      - smooth_push_into_next_scene
    avoid:
      - rapid_spin_transition
      - aggressive_whip_transition
      - repeated_zoom_transition
      - chaotic_motion_blur_transition

  lens_interaction:
    source_of_truth: lens-package.yaml
    24mm:
      preferred:
        - crane
        - environmental_tracking
        - broad_movement
        - wide_reveal
      avoid:
        - extreme_camera_proximity
    28mm:
      preferred:
        - exploration_tracking
        - action
        - medium_energy_environmental_movement
    35mm:
      role: primary_movement_lens
      preferred:
        - tracking
        - running
        - walking
        - dancing
        - comedy
        - crane
        - restrained_orbit
    50mm:
      preferred:
        - dialogue_tracking
        - medium_push
        - subtle_dolly
        - participation_locked
        - educational_locked
    65mm:
      preferred:
        - subtle_reaction_movement
        - extremely_slow_push
        - restrained_tracking
    85mm:
      preferred:
        - locked
        - extremely_slow_push
      avoid:
        - fast_tracking
        - orbit
        - crane
        - strong_handheld

  composition_preservation:
    source_of_truth: composition-rules.yaml
    preserve_during_motion:
      - primary_focal_point
      - character_silhouette
      - headroom
      - lead_room
      - looking_room
      - face_readability
      - object_readability
      - screen_direction
    rule: camera_motion_must_not_destroy_approved_composition

  ai_video_movement_lock:
    required_metadata:
      - camera_motion_type
      - movement_direction
      - movement_speed
      - movement_energy
      - movement_start
      - movement_end
      - camera_height
      - camera_distance_behavior
      - lens
      - focus_target
      - subject_tracking
      - horizon_behavior
    lock_after_approval: true
    unrequested_motion_forbidden:
      - dolly
      - pan
      - tilt
      - orbit
      - crane
      - zoom
      - shake
      - roll
      - vertical_drift
      - horizon_drift

  ai_motion_stability:
    generation_errors:
      - camera_breathing
      - random_zooming
      - focal_length_drift
      - horizon_wobble
      - camera_jitter
      - uneven_tracking_speed
      - unexpected_acceleration
      - perspective_pumping
      - subject_scale_pumping
      - random_orbit
      - accidental_reframing
      - unexplained_vertical_floating
      - jerky_camera_corrections
      - temporal_motion_discontinuity

  presets:
    locked_dialogue: {movement: locked, energy: 0.0}
    gentle_dialogue_push: {movement: slow_push_in, energy: 0.15}
    standard_walk: {movement: lateral_tracking, energy: 0.3}
    exploration_follow: {movement: gentle_rear_tracking, energy: 0.35}
    discovery_reveal: {movement: slow_push_or_pan, energy: 0.3}
    educational_hold: {movement: locked, energy: 0.0}
    participation_hold: {movement: locked, energy: 0.0}
    emotional_connection: {movement: extremely_slow_push, energy: 0.15}
    running_track: {movement: smooth_tracking, energy: 0.55}
    playful_action: {movement: controlled_tracking, energy: 0.55}
    physical_comedy: {movement: restrained_follow, energy: 0.45}
    reaction_comedy: {movement: locked_or_short_push, energy: 0.2}
    celebration: {movement: gentle_crane_or_orbit, energy: 0.6}
    musical_tracking: {movement: smooth_tracking, energy: 0.55}
    environment_reveal: {movement: slow_crane_or_dolly, energy: 0.3}
    reassurance: {movement: locked_or_gentle_push, energy: 0.1}
    mild_danger: {movement: controlled_tracking, energy: 0.4}
    scene_exit: {movement: gentle_pull_out, energy: 0.25}

  forbidden_movement_language:
    - random_camera_drift
    - uncontrolled_ai_zoom
    - focal_length_drift
    - aggressive_handheld
    - violent_camera_shake
    - rapid_spinning_camera
    - repeated_orbits
    - full_360_orbit_as_default
    - horror_style_push_in
    - predator_pov_tracking
    - excessive_whip_pan
    - repeated_left_right_pan
    - crash_zoom
    - snap_zoom
    - zoom_pumping
    - unstable_horizon
    - accidental_dutch_angle
    - camera_roll_drift
    - camera_jitter
    - perspective_pumping
    - subject_scale_pumping
    - excessive_motion_blur
    - constant_camera_motion
    - movement_without_story_purpose
    - simultaneous_high_camera_and_character_motion
    - strong_camera_motion_during_dialogue
    - movement_during_participation_pause
    - aggressive_camera_motion_during_learning
    - unmotivated_direction_reversal
    - rapid_vertical_camera_floating
    - chaotic_multi_axis_motion

  quality_control:
    enforcement: required_before_shot_approval
    checks:
      movement_has_story_motivation: true
      correct_movement_for_scene: true
      movement_energy: true
      camera_speed: true
      acceleration_smoothness: true
      deceleration_smoothness: true
      movement_direction: true
      camera_distance: true
      character_scale_stability: true
      horizon_stability: true
      lens_stability: true
      perspective_stability: true
      tracking_accuracy: true
      lead_room: true
      screen_direction: true
      composition_preservation: true
      face_readability: true
      lip_sync_visibility: true
      educational_readability: true
      participation_camera_lock: true
      motion_blur: true
      parallax: true
      foreground_occlusion: true
      action_readability: true
      emotional_intensity: true
      danger_intensity: true
      preschool_visual_safety: true
      ai_camera_drift: true
      ai_zoom_drift: true
      camera_jitter: true
      temporal_motion_consistency: true
    rejection_conditions:
      - movement_has_no_story_purpose
      - movement_energy_exceeds_context_or_absolute_limit
      - approved_composition_is_lost_during_motion
      - dialogue_or_lip_sync_becomes_unreadable
      - educational_relationship_is_distorted
      - participation_window_contains_camera_or_focus_motion
      - horizon_or_character_scale_drifts
      - ai_video_adds_unrequested_camera_motion
      - motion_blur_or_temporal_smear_hides_story_information
