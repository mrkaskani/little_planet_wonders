lens_package:
  global:
    id: riri-yoyo-preschool-cinematic-lens-package
    version: 2
    status: approved
    wan_2_2_contract: ../wan22-preproduction.yaml
    audience_age:
      minimum: 3
      maximum: 6
    philosophy: 50mm_is_the_natural_storytelling_home_35mm_opens_the_world_for_movement_and_play_24mm_to_28mm_establishes_environment_and_energy_and_65mm_to_85mm_gently_brings_the_audience_closer_without_sacrificing_identity_clarity_or_comfort
    goals:
      - clear_character_readability
      - comfortable_perspective
      - stable_character_proportions
      - emotional_clarity
      - spatial_comprehension
      - simple_visual_storytelling
      - consistent_depth
      - preschool_safe_visual_intensity
    production_uses:
      - storyboard_generation
      - image_generation
      - ai_video_generation
      - animation
      - shot_planning
      - visual_quality_control
    works_with:
      - camera-language.yaml
      - composition-rules.yaml
      - character_reference_sheets
      - environment_reference_sheets
      - scene_blocking
      - dialogue_and_lip_sync_requirements

  wan_2_2_interface:
    principle: >-
      Treat focal-length labels as concise perspective and framing guidance;
      source-image perspective remains authoritative for I2V and S2V.
    one_lens_family_per_generation_segment: true
    no_focal_length_change_during_segment: true
    prompt_translation:
      24mm: wide-environment-view-with-controlled-perspective
      35mm: natural-wide-character-and-environment-view
      50mm: natural-character-perspective
      65mm: gentle-character-emphasis
      85mm: stable-close-character-portrait
    t2v:
      rule: pair-one-lens-family-with-one-framing-and-one-camera-behavior
    i2v:
      rule: do-not-prompt-a-lens-that-conflicts-with-the-source-frame-perspective
    ti2v:
      role: draft-perspective-and-framing-test
    s2v:
      preferred:
        - 50mm
        - 65mm
        - 85mm
      avoid:
        - wide-angle-face-distortion
        - shallow-focus-that-hides-eyes-or-mouth

  virtual_camera_baseline:
    sensor_reference: full_frame_36x24mm
    focal_length_equivalence: full_frame_equivalent
    projection: rectilinear
    default_reference_lens: 50mm
    aspect_ratio_awareness: required
    lens_height_reference: character_eye_level
    camera_distance_units: meters_in_virtual_scene_scale
    field_of_view_consistency: locked_per_focal_length_and_sensor
    perspective_consistency: locked_by_camera_position_not_focal_length_label_alone
    character_scale_consistency: required_across_matching_coverage
    calibration:
      require_consistent_world_scale: true
      require_consistent_character_height_units: true
      calibrate_camera_distance_to_character_reference_sheet: true
      do_not_change_sensor_size_between_scenes: true
      do_not_crop_sensor_to_fake_focal_length: true
    rules:
      same_focal_length_must_keep_same_perspective_characteristics: true
      camera_height_must_be_explicit_per_shot: true
      subject_distance_must_be_explicit_per_shot: true
      field_of_view_must_not_drift_during_shot: true
      account_for_delivery_aspect_ratio_before_final_framing: true

  core_philosophy:
    preferred_perspective: natural_comfortable_and_friendly
    audience_relationship: physically_close_but_never_aggressive_or_invasive
    character_requirements:
      cute: true
      recognizable: true
      proportionally_stable: true
    avoid:
      - oversized_noses
      - stretched_faces
      - enlarged_foreground_limbs
      - compressed_body_proportions
      - distorted_heads
      - extreme_background_expansion
      - extreme_background_compression
    rules:
      lens_choice_requires_story_purpose: true
      lens_choice_is_not_random_aesthetic_decoration: true
      preserve_character_identity_over_cinematic_novelty: true
      default_to_50mm_when_story_need_is_unclear: true

  lenses:
    24mm:
      focal_length: 24mm
      approximate_horizontal_field_of_view_degrees: 73.7
      perspective_strength: strong_wide
      distortion_tolerance: low
      edge_stretch_risk: high
      background_compression: very_low
      depth_of_field_tendency: deep
      preferred_camera_distance: far
      preferred_distance_meters:
        minimum: 4.0
        maximum: 20.0
      storytelling_purpose: establish_environment_scale_and_broad_energy
      preferred_shot_types:
        - establishing
        - large_environment
        - location_introduction
        - broad_action
        - large_group
        - environment_reveal
        - musical_spectacle
        - very_wide_character_movement
      preferred_framing:
        - wide
        - full_environment_with_readable_characters
      conditional_framing:
        extreme_wide: only_when_narratively_necessary
      movement:
        - locked
        - gentle_crane
        - smooth_dolly
        - controlled_tracking
      rules:
        keep_character_faces_far_from_camera: true
        monitor_characters_near_frame_edges: true
        maintain_readable_character_scale: true
        preserve_sufficient_distance_to_prevent_distortion: true
      forbidden_shot_types:
        - emotional_closeup
        - normal_dialogue_closeup
        - participation_prompt
        - important_facial_reaction
        - face_dominant_shot

    28mm:
      focal_length: 28mm
      approximate_horizontal_field_of_view_degrees: 65.5
      perspective_strength: moderate_wide
      distortion_tolerance: low
      edge_stretch_risk: medium
      background_compression: low
      depth_of_field_tendency: deep
      preferred_camera_distance: medium_far_to_far
      preferred_distance_meters:
        minimum: 3.5
        maximum: 15.0
      storytelling_purpose: controlled_environmental_action_and_playful_immersion
      preferred_shot_types:
        - playful_exploration
        - environment_interaction
        - wide_character_movement
        - group_action
        - energetic_sequence
        - gentle_immersive_shot
        - physical_comedy_with_environment
      preferred_framing:
        - wide
        - medium_wide
        - full_body_group
      movement:
        - smooth_tracking
        - gentle_crane
        - character_follow
      rules:
        preserve_strong_character_readability: true
        keep_close_faces_away_from_camera: true
        use_when_environment_remains_story_relevant: true
        prefer_over_24mm_when_less_exaggeration_is_needed: true
      forbidden_shot_types:
        - face_closeup
        - emotional_closeup
        - participation_closeup

    35mm:
      focal_length: 35mm
      approximate_horizontal_field_of_view_degrees: 54.4
      perspective_strength: gentle_wide
      distortion_tolerance: low
      edge_stretch_risk: low_to_medium
      background_compression: low_to_moderate
      depth_of_field_tendency: moderate_to_deep
      preferred_camera_distance: medium_to_far
      preferred_distance_meters:
        minimum: 2.5
        maximum: 12.0
      storytelling_purpose: primary_wide_character_and_physical_storytelling
      energy_range: medium_to_high
      preferred_shot_types:
        - full_body_character
        - walking
        - running
        - jumping
        - dancing
        - physical_comedy
        - discovery
        - character_environment_interaction
        - medium_wide_two_shot
        - small_group
        - playful_action
        - musical_sequence
      preferred_framing:
        - full_body
        - medium_wide
        - wide
      movement:
        - tracking
        - dolly
        - crane
        - restrained_orbit
        - character_follow
      preserves:
        - readable_faces
        - full_body_gestures
        - clear_movement_direction
        - environment_context
        - comfortable_perspective
      rules:
        avoid_extreme_face_proximity: true
        preserve_lead_room_for_action: true
        keep_character_silhouette_clear: true
      forbidden_shot_types:
        - extreme_face_closeup
        - distorted_foreground_limb_shot

    50mm:
      focal_length: 50mm
      approximate_horizontal_field_of_view_degrees: 39.6
      perspective_strength: natural
      distortion_tolerance: very_low
      edge_stretch_risk: very_low
      background_compression: moderate
      depth_of_field_tendency: moderate
      preferred_camera_distance: medium
      preferred_distance_meters:
        minimum: 1.5
        maximum: 8.0
      storytelling_purpose: primary_standard_storytelling_and_proportion_reference
      series_visual_baseline: true
      character_proportion_reference_lens: true
      default_when_uncertain: true
      preferred_shot_types:
        - dialogue
        - medium_character
        - two_shot
        - educational_moment
        - participation_moment
        - everyday_interaction
        - character_introduction
        - calm_exploration
        - object_demonstration
        - gentle_comedy
        - normal_emotional_storytelling
      preferred_framing:
        - medium
        - medium_closeup
        - medium_two_shot
      emotional_quality:
        - natural
        - friendly
        - neutral
        - intimate_without_intensity
        - proportionally_accurate
      movement:
        - locked
        - restrained_tracking
        - gentle_dolly
        - very_slow_push
      rules:
        minimize_perceptual_distortion: true
        use_to_judge_character_proportion_consistency: true
        preserve_dialogue_and_lip_sync_readability: true
      forbidden_shot_types:
        - none_by_default

    65mm:
      focal_length: 65mm
      approximate_horizontal_field_of_view_degrees: 31.0
      perspective_strength: gentle_portrait
      distortion_tolerance: very_low
      edge_stretch_risk: negligible
      background_compression: moderate_to_high
      depth_of_field_tendency: moderate_to_shallow
      preferred_camera_distance: medium_to_far
      preferred_distance_meters:
        minimum: 1.2
        maximum: 6.0
      storytelling_purpose: gentle_portrait_reaction_and_emotional_attention
      preferred_shot_types:
        - medium_closeup
        - dialogue_reaction
        - emotional_reaction
        - reassurance
        - curiosity
        - thoughtful_moment
        - gentle_character_connection
        - important_line
        - subtle_facial_acting
      preferred_framing:
        - medium_closeup
        - closeup_with_breathing_room
      movement:
        - locked
        - subtle_push
        - restrained_tracking
      rules:
        provide_gentle_subject_separation: true
        preserve_warm_preschool_feeling: true
        avoid_excessive_background_compression: true
        use_selectively_to_preserve_significance: true
      forbidden_shot_types:
        - crowded_large_group
        - compressed_full_environment

    85mm:
      focal_length: 85mm
      approximate_horizontal_field_of_view_degrees: 23.9
      perspective_strength: portrait_detail
      distortion_tolerance: very_low
      edge_stretch_risk: negligible
      background_compression: high_but_controlled
      depth_of_field_tendency: shallow_to_moderate
      preferred_camera_distance: medium_far
      preferred_distance_meters:
        minimum: 1.0
        maximum: 5.0
      storytelling_purpose: important_emotional_connection_and_story_detail
      preferred_shot_types:
        - important_emotional_closeup
        - facial_reaction
        - significant_realization
        - reassurance
        - key_story_moment
        - object_insert
        - important_prop_detail
        - expression_reference
      preferred_framing:
        - closeup
        - medium_closeup
        - insert
      movement:
        - locked
        - extremely_slow_push_in
        - very_restrained_tracking
      rules:
        preserve_facial_breathing_room: true
        emotional_connection_must_not_feel_claustrophobic: true
        avoid_continuous_closeup_usage: true
        avoid_aggressive_push_ins: true
      forbidden_shot_types:
        - broad_action
        - large_group
        - continuous_dialogue_coverage
        - participation_response_hold_unless_specifically_approved

  lens_hierarchy:
    environment:
      primary: 24mm
      secondary: 28mm
    physical_action:
      primary: 35mm
      secondary: 28mm
    normal_storytelling:
      primary: 50mm
      secondary: 35mm
    dialogue:
      primary: 50mm
      secondary: 65mm
    reaction:
      primary: 65mm
      secondary: 85mm
    emotional_closeup:
      primary: 85mm
      secondary: 65mm
    educational:
      primary: 50mm
      secondary: 35mm
    participation:
      primary: 50mm
      secondary: 65mm
    group:
      primary: 35mm
      secondary: 28mm
    object_insert:
      primary: 85mm
      secondary: 65mm
    running:
      primary: 35mm
      secondary: 28mm
    musical:
      primary: 35mm
      secondary: 24mm
    celebration:
      primary: 35mm
      secondary: 50mm

  perspective_safety:
    character_identity_must_never_change_from_lens_distortion: true
    faces:
      avoid:
        - ultra_wide_closeup
        - exaggerated_nose_size
        - camera_proximity_oversized_eyes
        - distorted_ears
        - stretched_cheeks
        - enlarged_foreground_hands
    bodies:
      avoid:
        - perspective_oversized_feet
        - extreme_limb_foreshortening
        - stretched_bodies_near_wide_lens_edges
      preserve:
        - head_to_body_ratio
        - limb_proportions
        - wardrobe_proportions
        - accessory_scale
    edge_protection:
      keep_faces_out_of_wide_lens_edge_zones: true
      inspect_full_body_scale_at_both_frame_edges: true
      reframe_or_change_camera_distance_when_stretching_appears: true

  camera_distance_rules:
    units: meters_in_calibrated_virtual_scene
    values_are_starting_points: true
    scale_to_character_reference_height: true
    comfortable_minimum_distance:
      face_closeup: 0.9
      medium_closeup: 1.2
      medium: 1.8
      full_body: 3.0
      wide: 5.0
      group: 4.0
    rules:
      lens_and_camera_distance_must_be_selected_together: true
      do_not_force_framing_with_inappropriate_close_lens_position: true
      wide_lenses_require_greater_face_distance: true
      portrait_lenses_allow_tighter_framing_from_greater_distance: true
      preserve_natural_perspective: true
      revise_lens_before_violating_character_identity: true

  dialogue_rules:
    standard_dialogue: 50mm
    emotionally_important_dialogue: 65mm
    rare_key_reaction_or_emphasis: 85mm
    body_language_or_environment_dialogue: 35mm
    avoid: 24mm_face_dominant_dialogue
    important_line_requirements:
      preserve_mouth_visibility: true
      preserve_eye_readability: true
      reduce_perspective_distortion: true
      maintain_stable_camera_distance: true
      avoid_unnecessary_lens_changes: true
      prioritize_lip_sync_over_visual_novelty: true

  participation_rules:
    preferred_lens: 50mm
    optional_lens: 65mm
    framing:
      - medium
      - medium_closeup
    response_period_seconds:
      minimum: 3
      preferred: 4
      maximum: 5
    camera_feeling: friendly_and_direct
    lock_during_response:
      lens: true
      composition: true
      camera_position: true
      focus: true
    avoid:
      - wide_lens_facial_distortion
      - aggressive_closeup
      - moving_camera
      - focal_length_change
      - rack_focus_distraction

  educational_rules:
    default_lens: 50mm
    contextual_character_and_object_lens: 35mm
    relevant_object_detail_lenses:
      - 65mm
      - 85mm
    must_not_distort:
      - shape
      - size_comparison
      - object_proportion
      - spatial_relationship
    concepts_requiring_neutral_perspective:
      - big_versus_small
      - long_versus_short
      - near_versus_far
      - shape_recognition
      - quantity_comparison
    exception: perspective_may_be_exaggerated_only_when_perspective_is_the_lesson

  action_rules:
    preferred_lens: 35mm
    alternate_lens: 28mm
    occasional_environmental_lens: 24mm
    create_energy_through:
      - character_movement
      - camera_tracking
      - blocking
      - editing
      - composition
    rules:
      do_not_use_extreme_distortion_as_energy: true
      keep_direction_and_destination_readable: true
      preserve_character_proportions_during_motion: true

  comedy_rules:
    physical_comedy:
      - 35mm
      - 28mm
    reaction_comedy:
      - 65mm
      - 85mm
    interaction_comedy:
      - 35mm
      - 50mm
    rules:
      wider_lens_shows_setup_and_physical_payoff: true
      longer_lens_shows_facial_reaction_payoff: true
      fisheye_requires_rare_explicit_approval: true

  emotional_rules:
    intimacy_progression:
      35mm: environment_and_character
      50mm: normal_connection
      65mm: emotional_attention
      85mm: important_emotional_connection
    rules:
      do_not_use_closeup_for_every_emotional_line: true
      preserve_closeup_story_significance: true
      maximum_intensity_must_remain_age_appropriate: true
      return_to_wider_context_after_emotional_resolution: true

  danger_rules:
    character_and_problem: 35mm
    character_response: 50mm
    mild_worry_or_reaction: 65mm
    require_clear_path_to_safety: true
    avoid:
      - extreme_telephoto_compression
      - extreme_wide_distortion
      - threatening_ultra_low_wide_lens
      - extreme_close_face_distortion
      - predator_style_pov_lensing

  depth_of_field:
    default: moderate
    by_context:
      dialogue: moderate_to_shallow
      emotional_closeup: shallow_to_moderate
      educational: moderate_to_deep
      action: moderate_to_deep
      group: moderate_to_deep
      participation: moderate
    rules:
      comprehension_has_priority_over_separation: true
      do_not_blur_important_objects: true
      do_not_blur_relevant_characters: true
      do_not_blur_gestures: true
      do_not_blur_educational_information: true
      viewer_must_not_search_through_blur: true

  focus_behavior:
    default: stable_subject_focus
    character_eyes_normally_sharp: true
    rack_focus:
      allowed_only_for_important_story_relationship: true
      qualities:
        - slow
        - clear
        - motivated
        - easy_to_follow
      approved_paths:
        - character_to_discovered_object
        - object_to_character_reaction
        - foreground_clue_to_character
    avoid:
      - repeated_decorative_focus_pulls
      - focus_hunting
      - intentionally_soft_character_eyes

  lens_continuity:
    maintain_within_scene: true
    progression_should_reflect_story_intimacy: true
    preferred_progressions:
      - [35mm, 50mm, 65mm]
      - [50mm, 65mm, 85mm]
      - [24mm, 35mm, 50mm]
    avoid_unmotivated_progressions:
      - [24mm, 85mm, 24mm]
    rules:
      avoid_random_dramatic_focal_length_alternation: true
      large_lens_jump_requires_story_motivation: true
      preserve_camera_side_and_subject_scale: true

  shot_reverse_shot:
    preferred_pairs:
      - [50mm, 50mm]
      - [65mm, 65mm]
      - [50mm, 65mm]
    conditional_pair:
      lenses: [50mm, 65mm]
      reason: intentional_difference_in_emotional_importance
    avoid_pairs:
      - [24mm, 85mm]
    maintain:
      - similar_perspective
      - consistent_character_scale
      - matching_eye_line_geometry
      - comfortable_background_compression
    rules:
      imbalance_requires_explicit_story_meaning: true

  two_shot_rules:
    medium_two_shot: 50mm
    wider_physical_interaction: 35mm
    selective_tight_two_shot: 65mm
    rules:
      use_65mm_only_when_both_characters_fit_comfortably: true
      do_not_force_telephoto_compression: true
      preserve_comfortable_interpersonal_spacing: true
      preserve_both_faces_and_eye_lines: true

  group_rules:
    three_to_five_characters:
      preferred: 35mm
      optional: 28mm
    larger_groups:
      preferred: 28mm
      optional: 24mm
    rules:
      keep_characters_away_from_distorting_frame_edges: true
      keep_each_major_character_recognizable: true
      preserve_clear_group_hierarchy: true
      maintain_readable_face_separation: true

  character_identity_lock:
    preserve:
      - head_shape
      - head_to_body_ratio
      - eye_size
      - eye_spacing
      - muzzle_or_beak_dimensions
      - ear_proportions
      - body_width
      - limb_length
      - hand_or_paw_size
      - foot_size
      - wardrobe_size
      - accessory_placement
    ai_generation_rule: lens_perspective_must_never_be_interpreted_as_permanent_design_change
    compare_against:
      - approved_character_reference_sheet
      - 50mm_proportion_reference

  environment_relationship:
    wide_lens_effect: increased_perceived_depth
    long_lens_effect: compressed_perceived_distance
    rules:
      use_depth_effects_intentionally: true
      preserve_room_dimensions_across_lens_changes: true
      preserve_path_length: true
      preserve_distance_between_characters: true
      preserve_object_spacing: true
      preserve_environment_scale: true
      prevent_lens_effect_from_becoming_continuity_error: true

  optical_rendering:
    style: clean_controlled_virtual_prime
    chromatic_aberration: none_or_negligible
    barrel_distortion: minimal
    pincushion_distortion: minimal
    vignetting: subtle_or_none
    lens_flare: controlled
    bloom: controlled_by_lighting_system
    focus_breathing: minimal
    edge_softness: minimal
    anamorphic_distortion: false
    rules:
      strong_real_world_imperfections_require_explicit_approval: true
      imperfections_must_never_reduce_preschool_readability: true

  lens_flare:
    default_frequency: rare
    must_be_story_motivated: true
    allowed_for:
      - sunlight
      - magical_discovery
      - joyful_outdoor_moment
      - selected_musical_shot
    must_not_cover:
      - eyes
      - mouth
      - educational_object
      - important_action
      - participation_prompt
    rules:
      never_use_strong_flare_only_for_decoration: true

  zoom_behavior:
    default_lens_language: virtual_prime
    visible_zoom_default_allowed: false
    prefer_for_reframing:
      - dolly
      - tracking
      - crane
      - character_movement
    controlled_zoom:
      allowed: true
      speed: slow
      requires_specific_story_reason: true
    forbidden:
      - crash_zoom
      - snap_zoom
      - repeated_zoom_pumping

  ai_video_lens_stability:
    focal_length_locked_unless_intentional_change_specified: true
    field_of_view_locked: true
    background_compression_locked: true
    perspective_locked: true
    generation_errors:
      - unintentional_zoom_in
      - unintentional_zoom_out
      - perspective_change
      - field_of_view_change
      - character_distortion
      - background_compression_change
      - focal_length_drift

  shot_lens_lock:
    required_metadata:
      - lens
      - framing
      - camera_distance
      - camera_height
      - focus_target
      - depth_of_field
      - movement
      - subject_distance
    rules:
      lock_after_shot_approval: true
      deliberate_revision_requires_updated_metadata: true
      generated_segments_must_share_locked_values: true
      report_any_uncontrolled_drift: true

  presets:
    establishing_environment:
      lens: 24mm
      framing: wide
      depth_of_field: deep
    exploration_wide:
      lens: 28mm
      framing: wide
      depth_of_field: moderate_to_deep
    character_action:
      lens: 35mm
      framing: full_body_or_medium_wide
      depth_of_field: moderate_to_deep
    standard_character:
      lens: 50mm
      framing: medium
      depth_of_field: moderate
    standard_dialogue:
      lens: 50mm
      framing: medium_or_medium_closeup
      depth_of_field: moderate_to_shallow
    educational_medium:
      lens: 50mm
      framing: medium
      depth_of_field: moderate_to_deep
    participation_direct:
      lens: 50mm
      framing: medium_or_medium_closeup
      depth_of_field: moderate
      movement: locked
    gentle_reaction:
      lens: 65mm
      framing: medium_closeup
      depth_of_field: moderate_to_shallow
    emotional_reaction:
      lens: 65mm
      framing: medium_closeup
      depth_of_field: shallow_to_moderate
    emotional_closeup:
      lens: 85mm
      framing: closeup
      depth_of_field: shallow_to_moderate
    object_detail:
      lens: 85mm
      framing: insert
      depth_of_field: moderate
    group_activity:
      lens: 35mm
      framing: medium_wide
      depth_of_field: moderate_to_deep
    running:
      lens: 35mm
      framing: full_body_or_medium_wide
      depth_of_field: moderate_to_deep
    physical_comedy:
      lens: 35mm
      framing: medium_wide
      depth_of_field: moderate_to_deep
    reaction_comedy:
      lens: 65mm
      framing: medium_closeup
      depth_of_field: moderate
    celebration:
      lens: 35mm
      framing: medium_wide
      depth_of_field: moderate_to_deep
    musical_wide:
      lens: 28mm
      framing: wide
      depth_of_field: deep

  forbidden_lens_language:
    - fisheye_as_default
    - ultra_wide_face_closeup
    - extreme_perspective_distortion
    - random_focal_length_changes
    - uncontrolled_ai_zoom
    - uncontrolled_field_of_view_drift
    - excessive_background_compression
    - distorted_character_faces
    - enlarged_foreground_limbs
    - stretched_frame_edge_characters
    - aggressive_crash_zoom
    - repeated_snap_zoom
    - decorative_focus_hunting
    - extreme_shallow_focus_during_learning
    - blurry_character_eyes
    - wide_lens_threatening_closeup
    - inconsistent_lenses_between_matching_shots
    - lens_changes_during_participation_pause
    - lens_distortion_that_changes_character_identity

  quality_control:
    enforcement: required_before_shot_approval
    checks:
      correct_lens_for_story_function: true
      focal_length_consistency: true
      field_of_view_consistency: true
      character_proportion_preservation: true
      face_distortion: true
      limb_distortion: true
      frame_edge_stretching: true
      camera_distance: true
      character_scale: true
      background_compression: true
      depth_of_field: true
      eye_focus: true
      focus_target: true
      lens_continuity: true
      shot_reverse_shot_consistency: true
      participation_lens_stability: true
      educational_object_readability: true
      action_readability: true
      emotional_intensity: true
      preschool_visual_safety: true
      uncontrolled_zoom: true
      focal_length_drift: true
      ai_video_perspective_drift: true
    rejection_conditions:
      - lens_has_no_defined_story_function
      - character_identity_changes_due_to_perspective
      - matching_shots_have_unmotivated_lens_or_scale_mismatch
