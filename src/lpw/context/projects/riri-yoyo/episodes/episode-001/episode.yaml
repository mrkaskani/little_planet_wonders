type: episode-context
version: 1
status: three-s2v-video-jobs-arranged-awaiting-local-model-and-backend
title: A Warm Light in the Garden

metadata:
  project_id: riri-yoyo
  purpose: >-
    Example episode source showing how a compact episode file selects canonical
    characters, emotions, intensity, location, conversation, music, ambience,
    and sound-effect intent while the loader supplies full character and
    expression details from their reusable YAML authorities.
  audience_age: "3-6"
  language: English
  educational_focus: greeting-a-friend-and-naming-a-light

source_authority:
  characters:
    riri: ../../characters/riri/character-v2.yaml
    yoyo: ../../characters/yoyo/character-v2.yaml
  voices:
    riri: ../../characters/riri/voice-profile.yaml
    yoyo: ../../characters/yoyo/voice-profile.yaml
  acting_style: ../../characters/acting-style.yaml
  relationships: ../../characters/relationships.yaml
