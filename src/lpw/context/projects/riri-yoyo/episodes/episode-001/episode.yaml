scenes:
  - id: moonlit-garden-greeting
    order: 1
    title: The Warm Garden Light
    location_id: kindergarten-evening-night
    time_of_day: night
    duration_target_seconds: 12
    visual_prompt_intent: >-
      Riri and Yoyo stand together on the clearly lit curved flagstone path in
      the approved V2 storybook-cottage garden at calm blue night, looking
      toward one localized warm porch light. Preserve the V2 stone cottage,
      steep blue-gray roof, arched entrance, fence, path, four tree zones, and
      practical-light positions unchanged.
    character_states:
      riri:
        emotion: happy
        intensity: level_2
        action: turns-her-gaze-from-yoyo-to-the-warm-light-with-one-small-paw-lift
      yoyo:
        emotion: curious
        intensity: level_2
        action: follows-riris-gaze-with-one-clear-head-tilt-and-still-observation-beat
    conversation:
      language: English
      overlap: forbidden
      lines:
        - order: 1
          speaker: riri
          emotion: happy
          text: "Hi, Yoyo! Look at the warm light."
          listener: yoyo
          listener_state: attentive-closed-beak-and-gaze-on-the-light
        - order: 2
          speaker: yoyo
          emotion: curious
          text: "Is that our garden light?"
          listener: riri
          listener_state: warm-attentive-closed-mouth-and-small-head-tilt
        - order: 3
          speaker: riri
          emotion: affectionate
          text: "Yes. It helps us see the path."
          listener: yoyo
          listener_state: happy-understanding-and-stable-closed-beak
