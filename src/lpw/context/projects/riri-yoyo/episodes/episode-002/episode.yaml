  caveat: >-
    Tiny Whisper did not reliably recognize Yoyo's early sung line. The
    10.80-second cut is therefore an editorial inference from the user's
    11-second cue. Boundaries from 16.36 seconds onward use detected word
    onsets or offsets.
  detected_anchors:
    - {time_seconds: 16.36, event: riri-line-vocal-entry, confidence: medium}
    - {time_seconds: 21.20, event: ground-word-end, confidence: medium}
    - {time_seconds: 21.78, event: chorus-setup-entry, confidence: high}
    - {time_seconds: 25.06, event: sharing-line-entry, confidence: high}
    - {time_seconds: 29.46, event: play-word-end, confidence: high}
  edit_boundaries_seconds: [0.0, 10.8, 16.36, 21.78, 25.06, 29.46, 34.0]
  final_edit_frames_at_24fps: [0, 259, 393, 523, 601, 707, 816]

