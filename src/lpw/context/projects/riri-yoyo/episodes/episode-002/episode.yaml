common_negative_prompt: >-
  identity drift, species drift, altered face, altered eye color, altered fur or
  feather pattern, changed proportions, wardrobe, clothes, duplicate Riri,
  duplicate Yoyo, extra character, human, extra limb, missing limb, fused paw,
  fused flipper, malformed hand, malformed beak, broken mouth, lip tearing,
  asymmetrical eyes, crossed eyes, face obstruction, cropped head, cropped feet,
  cropped tail, tight close-up, insufficient motion buffer, floating feet,
  sliding feet, inconsistent shadow, geometry drift, room layout change, moving
  shelves, moving playhouse, window change, lighting flicker, color flicker,
  random object, duplicate shape, extra shape, circle becomes oval ring ball or
  cushion, square becomes rectangle diamond cube or cushion, prop teleportation,
  unreadable shape silhouette, abrupt camera jump, handheld shake, whip pan,
  focus pumping, frame warping, temporal jitter, VAE burn, oversaturation,
  crushed contrast, tiled seam, FramePack discontinuity, malformed frame, text,
  subtitle, caption, logo, watermark, border, panel, collage, contact sheet

scenes:
  - id: scene-01-walking
    order: 1
    title: Looking for Shapes
    time: {start_seconds: 0.0, end_seconds: 10.8, duration_seconds: 10.8}
    audio_story: instrumental-introduction-and-walking-lead-in
    reference_image: reference-images/v001/scene-01-walking.png
    reference_status: human-selected-wan22-first-frame
    camera: wide-establishing-preschool-eye-level-gentle-forward-track
    action: >-
      Riri and Yoyo start beside the large window, walk side by side across the
      exposed wooden floor, and reach the near edge of the circular rug.
    positive_prompt: >-
      Approved V2 Riri, the plush pale-pink puppy with blue chest paw and tail
      accents, starts on screen-left beside approved V2 Yoyo, the plush
      black-and-white penguin with violet-blue eyes and a small gold beak, on
      screen-right. At frame zero both full characters are together beside the
      large teal-curtain window in the back-left of the approved warm pink
      kindergarten play space. Neither character touches the circular rug.
      They face diagonally from the window toward the rug across a long visible,
      unobstructed strip of pale wooden floor. Over the shot they walk naturally
      side by side from the window, cross the wooden floor, and arrive at the
      near edge of the carpet. Use alternating toddler steps, soft ear and tail
      bounce for Riri, gentle waddling body motion for Yoyo, believable foot
      contact and window-cast shadows. The wide stable eye-level camera keeps
      the window, entire walking lane, and carpet destination readable while
      making a very slow forward track. Preserve the shelves, cushions and
      teal-trim playhouse. No discovered circle or square is visible yet. Keep
      faces, bodies, lighting, scale, perspective, and screen direction stable.

  - id: scene-02-yoyo-finds-circle
    order: 2
    title: Yoyo Finds a Circle
    time: {start_seconds: 10.8, end_seconds: 16.36, duration_seconds: 5.56}
    audio_story: "Yoyo the penguin holds a circle so round"
    reference_status: previous-approved-job-final-frame
    camera: medium-wide-preschool-eye-level-gentle-push-toward-yoyo
    action: >-
      Yoyo notices the yellow circle, points to its round edge, lifts it with
      both flippers, and proudly holds it upright while Riri watches.
    positive_prompt: >-
      Continue seamlessly in the same approved V2 play space. Yoyo remains
      screen-right and discovers exactly one sunny-yellow flat foam circle on
      the rug. As the lyric plays, Yoyo bends naturally, reaches with one
      flipper, lifts the circle using both flippers, traces or indicates its
      round edge, then holds it upright against the lower belly. Yoyo's beak
      moves naturally with the sung words while eyes and beak stay unobscured.
      Riri remains screen-left, attentive, happy, silent-looking, and physically
      stable without false lip motion. Preserve exact identity, prop geometry,
      floor contact, room layout, morning light, and smooth camera continuity.

  - id: scene-03-riri-finds-square
    order: 3
    title: Riri Finds a Square
    time: {start_seconds: 16.36, end_seconds: 21.78, duration_seconds: 5.42}
    audio_story: "Riri the puppy finds a square on the ground"
    reference_status: previous-approved-job-final-frame
    camera: medium-wide-preschool-eye-level-gentle-push-toward-riri
    action: >-
      Riri discovers the blue square on the rug, lowers a paw, indicates its
      sides, and picks it up while Yoyo preserves the yellow circle.
    positive_prompt: >-
      Continue in the same approved V2 play space with Riri screen-left and
      Yoyo screen-right. Riri discovers exactly one sky-blue flat foam square
      on the ground. As the lyric plays, Riri lowers one front paw to the rug,
      points toward the square's four equal sides, then lifts it with both paws
      and holds it upright. Her mouth moves clearly with the sung line while
      her eyes and muzzle remain unobscured. Yoyo watches warmly and continues
      holding the same single yellow circle without shape or identity drift.
      Preserve stable anatomy, prop scale and colors, screen direction,
      floor contact, warm daylight, room geometry, and smooth camera motion.

  - id: scene-04-chorus-together
    order: 4
    title: Put Them Together
    time: {start_seconds: 21.78, end_seconds: 25.06, duration_seconds: 3.28}
    audio_story: "Let's put them together, they happily say"
    performance_rule: both-riri-and-yoyo-sing-together-not-solo
    reference_status: previous-approved-job-final-frame
    camera: wide-symmetrical-two-shot-locked-preschool-eye-level
    action: >-
      Both turn slightly toward one another, sing together, and begin extending
      their separately held shapes toward the center.
    positive_prompt: >-
      Wide stable two-shot in the same room. Riri on screen-left holds the same
      blue square; Yoyo on screen-right holds the same yellow circle. BOTH
      characters sing together in synchrony throughout “Let's put them
      together, they happily say”; neither is a solo speaker and neither stays
      frozen. Use clear restrained mouth and beak articulation, joyful shared
      eye contact, small rhythmic body bounces, and gradual coordinated arm and
      flipper movement toward the center. Keep both full bodies and both shapes
      readable, faces unobscured, camera locked, and all identity, geometry,
      lighting, scale, shadow, and prop details temporally consistent.

  - id: scene-05-sharing-shapes
    order: 5
    title: Sharing Is the Best Way to Play
    time: {start_seconds: 25.06, end_seconds: 29.46, duration_seconds: 4.4}
    audio_story: "Sharing our shapes is the best way to play"
    performance_rule: both-riri-and-yoyo-sing-together-not-solo
    reference_status: previous-approved-job-final-frame
    camera: wide-two-shot-locked-preschool-eye-level
    action: >-
      Both sing the exact educational line together and exchange or present
      their shapes to each other without hiding either silhouette.
    positive_prompt: >-
      Continue the stable wide two-shot. Riri screen-left extends the same blue
      square and Yoyo screen-right extends the same yellow circle toward the
      shared center space. BOTH characters sing together in synchrony for the
      exact lyric “Sharing our shapes is the best way to play.” Show natural,
      modest mouth and beak motion on the same beats, warm eye contact, and a
      clear cooperative handoff gesture. Keep the square and circle separate,
      fully visible, geometrically stable, and never covering either face.
      Preserve approved identities, character scale, room geometry, morning
      lighting, shadows, screen direction, framing, and temporal continuity.

  - id: scene-06-high-five
    order: 6
    title: Shape-Friend High Five
    time: {start_seconds: 29.46, end_seconds: 34.0, duration_seconds: 4.54}
    audio_story: musical-resolution-after-the-final-word
    reference_status: previous-approved-job-final-frame
    camera: medium-wide-two-shot-gentle-settling-push
    action: >-
      With the shapes placed side by side, Riri and Yoyo raise one limb each,
      make one clean high-five, briefly hold the celebration, then relax.
    positive_prompt: >-
      Final joyful beat in the same approved room. The blue square and yellow
      circle rest neatly side by side on the rug. Riri remains screen-left and
      raises exactly one front paw; Yoyo remains screen-right and raises exactly
      one flipper. Animate one clean approach, one gentle paw-to-flipper high-five
      contact, a tiny happy bounce, then a calm held ending through the musical
      cadence. Mouth and beak relax after the lyric ends; no silent chatter.
      Preserve full bodies, limb separation, prop geometry, face identity,
      floor contact, room layout, warm daylight, soft shadows, and stable camera.

