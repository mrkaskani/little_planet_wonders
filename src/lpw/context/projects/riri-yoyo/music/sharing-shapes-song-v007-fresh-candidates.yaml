prompt: >-
  Upbeat nursery rhyme and acoustic folk pop for toddlers. One clear, warm,
  playful solo singer performs the entire song alone. The same singer must sing
  Verse 1, Verse 2, and the Chorus; never introduce a duet, second singer,
  choir, response vocal, or character voice. Use a gentle bouncy walking pulse,
  finger-strummed acoustic guitar, bright xylophone, soft hand percussion, and
  cheerful rounded bass. Keep the arrangement sparse and quieter than the
  centered, dry, forward lead vocal. Begin Verse 1 within two seconds. Follow
  the explicit structure in order and sing every supplied lyric line exactly
  once. Do not omit, truncate, repeat, paraphrase, replace, or add words. Use a
  narrow toddler-friendly melody and slow, clearly separated English syllables.
  Fully sing the final word "play", then allow a brief clean instrumental
  cadence. No voice cloning, spoken dialogue, ad-libs, humming, nonsense
  syllables, dramatic belting, shouting, or long instrumental intro.

lyrics: |-
  [Verse 1]
  Yoyo the penguin holds a circle so round

  [Verse 2]
  Riri the puppy finds a square on the ground

  [Chorus]
  Let's put them together, they happily say
  Sharing our shapes is the best way to play

