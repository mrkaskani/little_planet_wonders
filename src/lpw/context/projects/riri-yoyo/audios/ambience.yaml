# FILE NAME: ambience.yaml
locations:
  kindergarten_classroom:
    source_profiles:
      location: ../locations/interiors/location.yaml
      sound: ../locations/interiors/sound-profile.yaml
      canonical_sound_profile_id: kindergarten-interior-sound

    supported_states:
      - kindergarten-interior-empty
      - kindergarten-interior-default
      - kindergarten-quiet-learning
      - kindergarten-free-play
      - kindergarten-story-time
      - kindergarten-art-activity
      - kindergarten-interior-dialogue
      - kindergarten-interior-quiet
      - kindergarten-interior-arrival
      - kindergarten-interior-departure

    base_layer:
      asset: audio-assets/ambience/kindergarten-classroom-room-tone.wav
      loop: true
      gain_db: -27

    layers:
      - id: soft-ventilation
        asset: audio-assets/ambience/kindergarten-soft-ventilation.wav
        gain_db: -33
        loop: true

      - id: wooden-room-resonance
        asset: audio-assets/ambience/kindergarten-wooden-room-resonance.wav
        gain_db: -35
        loop: true

      - id: filtered-garden
        asset: audio-assets/ambience/kindergarten-filtered-garden.wav
        gain_db: -34
        loop: true

    spatial_sources:
      - id: ceiling-fan
        asset: audio-assets/ambience/kindergarten-ceiling-fan.wav
        position: overhead
        distance: medium
        gain_db: -34
        loop: true

      - id: garden-windows
        asset: audio-assets/ambience/kindergarten-window-garden-bleed.wav
        position: left
        distance: medium
        gain_db: -35
        loop: true

      - id: classroom-door
        asset: audio-assets/ambience/kindergarten-hallway-bleed.wav
        position: rear
        distance: adjacent_room
        gain_db: -37
        loop: true

    activity_layers:
      quiet:
        enabled_by_default: true
        assets:
          - audio-assets/ambience/kindergarten-quiet-classroom-bed.wav

      normal:
        assets:
          - audio-assets/ambience/kindergarten-distant-classroom-activity.wav

      busy:
        assets:
          - audio-assets/ambience/kindergarten-active-classroom-bed.wav

    time_of_day_layers:
      morning:
        assets:
          - audio-assets/ambience/kindergarten-morning-window-birds.wav
        gain_db: -36

      daytime:
        enabled_by_default: true
        assets:
          - audio-assets/ambience/kindergarten-daytime-window-garden.wav
        gain_db: -35

      golden_hour:
        assets:
          - audio-assets/ambience/kindergarten-golden-hour-window-garden.wav
        gain_db: -36

      evening:
        assets:
          - audio-assets/ambience/kindergarten-evening-interior-bed.wav
        gain_db: -35

      night:
        assets:
          - audio-assets/ambience/kindergarten-night-interior-bed.wav
        gain_db: -36

    weather_layers:
      rain:
        assets:
          - audio-assets/ambience/kindergarten-rain-on-windows.wav
        gain_db: -30

      heavy_rain:
        assets:
          - audio-assets/ambience/kindergarten-heavy-rain-on-windows.wav
        gain_db: -27

      post_rain:
        assets:
          - audio-assets/ambience/kindergarten-window-post-rain-drips.wav
        gain_db: -34

    conditional_layers:
      - id: open-window-garden
        asset: audio-assets/ambience/kindergarten-open-window-garden.wav
        trigger: windows_open
        position: left
        loop: true
        gain_db: -31

      - id: adjacent-classroom
        asset: audio-assets/ambience/kindergarten-adjacent-classroom.wav
        trigger: adjacent_classroom_occupied
        position: adjacent_room
        gain_db: -37

    exclusions:
      - individual_child_voices
      - foreground_laughter
      - footsteps
      - chair_movements
      - toy_impacts
      - door_actions
      - harsh_hvac
      - school_bell_without_trigger

    mixing:
      dialogue_priority: true
      music_priority: true
      ambience_bus: ambience
      duck_under_dialogue_db: -4
      max_simultaneous_layers: 4

    continuity:
      preserve_across_cuts: true
      restart_on_every_shot: false
      crossfade_ms: 400
      maintain_phase_when_possible: true

    transition_rules:
      same_location:
        preserve_base_layer: true
        crossfade_ms: 300

      interior_to_exterior:
        crossfade_ms: 800

      exterior_to_interior:
        crossfade_ms: 700

      classroom_to_play_space:
        crossfade_ms: 600

