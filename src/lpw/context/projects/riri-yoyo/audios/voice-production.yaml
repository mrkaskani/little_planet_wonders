metadata:
  id: riri-yoyo-english-voice-production
  type: voice-production-context
  version: 2
  status: approved
  project_id: riri-yoyo
  purpose: consistent child-friendly English dialogue for animation and lip sync
  approval_required: true
  continuity_priority: critical

source_authority:
  wan_2_2_contract: ../wan22-preproduction.yaml
  s2v_input_contract: s2v-input-spec.yaml
  dialogue_technical_contract: audio_style.yaml
  pronunciation: pronunciation.yaml
  character_voice_profiles: ../characters/{character_id}/voice-profile.yaml
  s2v_dialogue_audio_prompt: >-
    ../generation-records/prompts/s2v-dialogue-audio-preparation--prompt-v001.yaml

wan_2_2_interface:
  supported_task: s2v
  role: prepare_and_lock_clean_english_performance_audio
  distinguish_inputs:
    voice_cloning_reference:
      purpose: establish_speaker_identity_only
      source: ../characters/{character_id}/voice-profile.yaml
      not_automatically_valid_as_final_s2v_audio: true
    final_s2v_conditioning_audio:
      purpose: control_words_performance_and_timing
      must_match_approved_transcript_exactly: true
      must_pass: s2v-input-spec.yaml
  downstream_invalidation:
    audio_hash_change_invalidates_generated_video: true
    transcript_hash_change_invalidates_generated_video: true
    timing_change_invalidates_generated_video: true
  boundary_policy:
    preferred_maximum_segment_seconds: 6
    split_at_sentence_end_long_pause_stillness_or_edit_point: true
    never_split_inside_word_vowel_closure_large_gesture_or_contact: true
  onset_buffer_policy:
    leading_silence_seconds: {minimum: 0.2, maximum: 0.5, default: 0.25}
    add_after_clean_voice_generation: true
    first_breath-or-phoneme-before-buffer-end: forbidden
    short-fade-as-silence-substitute: forbidden
    one-second-padded-frame-options-at-16fps: [21, 25]

audience:
  minimum_age: 3
  maximum_age: 6
  primary_language_level: preschool
  target_language: English
  require_simple_vocabulary: true
  require_short_sentences: true
  require_clear_word_boundaries: true
  avoid_fast_complex_phrasing: true
  avoid_ambiguous_emotional_delivery: true

workflow:
  require_exact_approved_dialogue: true
  forbid_dialogue_paraphrasing: true
  forbid_unapproved_ad_libs: true
  require_emotional_reference: true
  require_pronunciation_reference: true
  require_clean_dialogue: true
  require_review_before_lock: true
  require_locked_audio_for_lip_sync: true
  regenerate_video_after_material_audio_change: true
  preserve_locked_dialogue_timing: true
  preserve_character_voice_continuity: true
  require_final_dialogue_qc: true

voice_casting:
  target_quality: professional_animation
  require_child_friendly_voice: true
  require_warm_natural_delivery: true
  require_character_distinction: true
  require_voice_consistency_across_episodes: true
  avoid_overly_mature_voice: true
  avoid_baby_talk: true
  avoid_caricatured_accents: true
  avoid_voice_imitation_of_real_people: true
  character_profiles:
    riri:
      character_context: characters/riri/character.yaml
      voice_profile: characters/riri/voice-profile.yaml
      voice_id: riri-v1
    yoyo:
      character_context: characters/yoyo/character.yaml
      voice_profile: characters/yoyo/voice-profile.yaml
      voice_id: yoyo-v1

voice_characteristics:
  overall_style:
    - warm
    - friendly
    - playful
    - expressive
    - reassuring
    - natural
  vocal_energy:
    minimum: 0.35
    preferred: 0.55
    maximum: 0.75
  pitch_variation:
    minimum: moderate
    maximum: expressive
  speaking_style: conversational_animation
  articulation: clear
  vocal_smile: subtle_to_moderate
  emotional_readability: high
  naturalness_priority: high
  cuteness_priority: moderate
  exaggeration_level: moderate
  profile_identity_is_authoritative: true
  emotion_changes_performance_not_identity: true

pronunciation:
  context: audios/pronunciation.yaml
  require_clear_natural_pronunciation: true
  require_consistent_character_name_pronunciation: true
  require_consistent_recurring_word_pronunciation: true
  preserve_complete_syllables: true
  preserve_word_endings: true
  require_clean_vowels: true
  require_clear_consonants: true
  avoid_swallowed_syllables: true
  avoid_overstretched_vowels: true
  avoid_rushed_words: true
  avoid_robotic_over_articulation: true
  pronunciation_priority:
    - character_names
    - educational_words
    - story_keywords
    - repeated_phrases
    - call_and_response_lines
  character_names:
    yoyo:
      pronunciation: "YO-yo"
      stress: first_syllable
      require_consistency: true
      dictionary_entry: pronunciation.entries.Yoyo
    riri:
      pronunciation: "REE-ree"
      stress: first_syllable
      require_consistency: true
      dictionary_entry: pronunciation.entries.Riri

dialogue_delivery:
  pace:
    overall: slow_to_moderate
    target_words_per_minute_minimum: 90
    target_words_per_minute_maximum: 125
    allow_faster_short_reactions: true
    never_rush_learning_words: true
    undersized_shot_policy: extend_shot_instead_of_speeding_dialogue
  sentence_delivery:
    require_natural_phrase_breaks: true
    require_clear_sentence_endings: true
    avoid_rushing_between_sentences: true
    preserve_short_readable_phrases: true
  pauses:
    minimum_between_major_ideas_seconds: 0.35
    preferred_between_major_ideas_seconds: 0.6
    allow_longer_pause_for_comprehension: true
    preserve_approved_pause_timing: true
  emphasis:
    emphasize_story_keywords: true
    emphasize_learning_words: true
    emphasize_character_names_when_needed: true
    maximum_emphasis_intensity: 0.7
    avoid_pitch_or_volume_exaggeration: true
  reactions:
    allow:
      - gentle_gasp
      - happy_laugh
      - small_giggle
      - curious_hmm
      - excited_oh
      - surprised_wow
      - playful_yay
      - gentle_sigh
    require_dialogue_clarity_after_reaction: true
    avoid_reaction_overuse: true
    reactions_must_match_character_profile: true

emotional_performance:
  require_emotion_matching_scene: true
  require_emotional_transition_continuity: true
  require_reassuring_baseline: true
  maximum_emotional_intensity: 0.6
  safety_ceiling_applies_to_all_emotions: true
  preferred_emotional_intensity_range:
    minimum: 0.25
    maximum: 0.55
  positive_emotions:
    happiness:
      maximum_intensity: 0.75
    excitement:
      maximum_intensity: 0.7
    curiosity:
      maximum_intensity: 0.65
    celebration:
      maximum_intensity: 0.7
  difficult_emotions:
    sadness:
      maximum_intensity: 0.45
      require_soft_delivery: true
    worry:
      maximum_intensity: 0.45
      require_reassuring_context: true
    surprise:
      maximum_intensity: 0.55
      forbid_frightened_scream: true
    frustration:
      maximum_intensity: 0.4
      forbid_aggression: true
  require_recovery_after_negative_emotion: true
  identity_source: characters/{character_id}/voice-profile.yaml
  scene_emotion_source: scene.emotional_arc
  shot_emotion_source: shot.emotional_state

safety:
  maximum_emotional_intensity: 0.6
  require_reassuring_resolution: true
  require_emotional_safety_for_preschool_audience: true
  forbid_realistic_distress_performance: true
  forbid_sustained_fear_delivery: true
  forbidden_delivery:
    - screaming
    - aggressive shouting
    - threatening delivery
    - extreme panic
    - intense crying
    - harsh sarcasm
    - frightening whispers
    - sudden large volume changes
    - hostile mocking
    - prolonged distress
    - breathless panic
    - angry growling
    - intimidating delivery

participation:
  minimum_response_pause_seconds: 3
  maximum_response_pause_seconds: 5
  preferred_response_pause_seconds: 4
  avoid_distracting_motion_during_pause: true
  avoid_dialogue_during_response_pause: true
  avoid_competing_sound_effects_during_pause: true
  maintain_soft_background_audio_if_present: true
  allow_character_prompt_before_pause: true
  allow_gentle_encouragement_after_pause: true
  require_clear_question_or_instruction_before_pause: true
  avoid_pressuring_child_to_respond: true

call_and_response:
  enabled: true
  require_clear_prompt: true
  require_single_simple_task: true
  allow_examples:
    - repeat_word
    - answer_simple_question
    - identify_object
    - imitate_sound
    - count_along
    - say_character_name
  avoid_multiple_questions_without_pause: true
  avoid_negative_feedback_for_wrong_answer: true
  response_feedback_style:
    - encouraging
    - positive
    - gentle
    - nonjudgmental

character_voice_continuity:
  require_same_voice_identity: true
  require_same_core_pitch_range: true
  require_same_speech_rhythm: true
  require_same_accent: true
  require_same_pronunciation_rules: true
  require_same_energy_baseline: true
  require_same_signature_reactions: true
  allow_scene_based_emotional_variation: true
  forbid_unmotivated_voice_style_changes: true
  prevent_voice_swapping: true
  compare_against_character_voice_profile: true

performance_consistency:
  track_per_character:
    - pitch_range
    - average_pace
    - energy_level
    - articulation
    - accent
    - pronunciation
    - vocal_texture
    - signature_reactions
    - emotional_baseline
  compare_new_recordings_to_reference: true
  require_match_before_audio_lock: true
  store_comparison_result: true
  store_reference_identifier: true

recording:
  format: mono_dialogue
  preferred_sample_rate_hz: 48000
  preferred_bit_depth: 24
  record_dry_voice: true
  require_low_noise_floor: true
  require_consistent_microphone_distance: true
  require_consistent_recording_environment: true
  avoid_room_echo: true
  avoid_clipping: true
  avoid_plosives: true
  avoid_mouth_clicks: true
  avoid_excessive_sibilance: true
  avoid_background_noise: true
  avoid_baked_in_music: true
  avoid_baked_in_reverb: true
  avoid_baked_in_sound_effects: true
  retain_original_lossless_recording: true

dialogue_editing:
  preserve_natural_breaths: true
  remove_distracting_breaths: true
  remove_clicks_and_pops: true
  remove_unwanted_noise: true
  correct_obvious_timing_gaps: true
  preserve_natural_performance_timing: true
  avoid_aggressive_noise_reduction: true
  avoid_robotic_time_stretching: true
  avoid_audible_pitch_correction: true
  avoid_over_compression: true
  preserve_word_and_syllable_timing: true

dialogue_processing:
  noise_reduction: light
  equalization: gentle
  compression: light_to_moderate
  de_essing: gentle
  limiting: safety_only
  reverb: none_for_lip_sync_master
  stereo_effects: none_for_lip_sync_master
  preserve_voice_naturalness: true
  preserve_transient_clarity: true
  preserve_consonant_and_word_ending_clarity: true

loudness:
  require_consistent_character_loudness: true
  require_consistent_scene_loudness: true
  avoid_large_line_to_line_level_changes: true
  dialogue_priority: highest
  prevent_clipping: true
  maintain_headroom: true
  target_lufs: -16
  maximum_true_peak_db: -1
  maximum_adjacent_line_difference_lu: 2

lip_sync_input:
  dialogue_only: true
  mono_preferred: true
  use_final_approved_take: true
  require_tight_trim: true
  preserve_natural_leading_breath_when_needed: true
  preserve_exact_dialogue_timing: true
  forbid_music: true
  forbid_ambience: true
  forbid_foley: true
  forbid_sound_effects: true
  forbid_reverb: true
  forbid_delay: true
  forbid_background_vocals: true
  forbid_overlapping_unrelated_dialogue: true
  require_audio_hash: true
  require_transcript_hash: true
  require_word_timestamps: true
  prefer_phoneme_timestamps: true

lip_sync:
  synchronize_to_locked_dialogue: true
  prioritize:
    - syllable_timing
    - vowel_shapes
    - major_consonants
    - mouth_open_close_timing
    - emotional_expression
  require_visible_pause_matching: true
  require_reaction_sound_matching: true
  avoid_random_mouth_motion: true
  avoid_mouth_motion_during_silence: true
  audio_is_timing_authority: true
  invalidate_when_audio_hash_changes: true
  regenerate_after:
    - dialogue_take_change
    - dialogue_timing_change
    - word_change
    - pronunciation_change
    - major_emotional_delivery_change

music_interaction:
  dialogue_has_priority: true
  require_music_ducking_under_dialogue: true
  avoid_busy_melody_under_important_dialogue: true
  avoid_strong_transients_over_words: true
  reduce_music_activity_during_learning_lines: true
  reduce_music_activity_during_participation_prompts: true
  allow_music_energy_to_rise_between_dialogue_lines: true
  music_context: audios/music.yaml

sound_effect_interaction:
  dialogue_has_priority: true
  allow_medium_to_high_sfx_energy: true
  avoid_masking_dialogue: true
  avoid_sfx_on_important_syllables: true
  reduce_sfx_during_learning_words: true
  reduce_sfx_during_participation_prompts: true
  allow_stronger_sfx:
    - movement
    - transitions
    - comedy
    - discoveries
    - celebrations
    - action_sequences
  require_child_safe_sound_design: true
  sound_effect_context: audios/sound-effects.yaml

final_mix:
  dialogue_priority: highest
  music_priority: secondary
  sound_effect_priority: secondary
  ambience_priority: background
  require_dialogue_intelligibility: true
  require_preschool_safe_dynamic_range: true
  avoid_overcrowded_mix: true
  avoid_constant_high_energy_audio: true
  preserve_quiet_contrast: true
  preserve_participation_pauses: true
  mixing_context: audios/mixing.yaml

quality_control:
  check_exact_dialogue: true
  check_missing_words: true
  check_extra_words: true
  check_pronunciation: true
  check_character_name_pronunciation: true
  check_articulation: true
  check_pacing: true
  check_emotional_intensity: true
  check_character_voice_consistency: true
  check_noise: true
  check_clipping: true
  check_lip_sync_source_cleanliness: true
  check_participation_pause_duration: true
  check_dialogue_intelligibility_in_final_mix: true
  check_preschool_safety: true
  required_review_fields:
    - identity
    - dialogue_accuracy
    - emotional_safety
    - listening_comfort

audio_lock:
  require_director_approval: true
  require_dialogue_approval: true
  require_pronunciation_approval: true
  require_emotional_delivery_approval: true
  require_technical_qc_pass: true
  assign_version_id: true
  store_audio_hash: true
  store_transcript_hash: true
  store_alignment_metadata: true
  forbid_untracked_changes_after_lock: true
  require_new_version_after_material_change: true
  invalidate_downstream_video_after_material_change: true

forbidden_changes:
  - paraphrasing_approved_dialogue
  - adding_unapproved_ad_libs
  - changing_character_voice_identity
  - swapping_Riri_and_Yoyo_voices
  - changing_Yoyo_from_YO-yo
  - changing_Riri_from_REE-ree
  - changing_locked_dialogue_timing
  - replacing_locked_audio_without_new_approval
  - adding_music_ambience_foley_or_effects_to_lip_sync_input
  - using_aggressive_noise_reduction_or_time_stretching
  - exceeding_preschool_emotional_safety_limits

location_voice_integration:
  profile_sources:
    kindergarten_classroom: ../locations/interiors/sound-profile.yaml
    kindergarten_play_space: ../locations/play_spaces/sound-profile.yaml
    kindergarten_exterior_garden: ../locations/exteriors/sound-profile.yaml
    nature_park: ../locations/nature_and_parks/sound-profile.yaml
    countryside_golden_hour: ../locations/sunset_golden_hour/sound-profile.yaml
    kindergarten_evening_night: ../locations/evening_night/sound-profile.yaml
  production_policy:
    generate_and_lock_clean_voice_before_location_processing: true
    preserve_unprocessed_dialogue_master: true
    apply_location_response_on_separate_bus: true
    apply_distance_and_occlusion_after_voice_identity_lock: true
    location_change_must_not_change_pitch_timbre_or_articulation: true
    match_room_response_across_connected_shots: true
    preserve_dialogue_timing_across_perspective_changes: true
  intelligibility_protection:
    classroom_activity: reduce_before_dialogue_gain_increase
    play_space_toys: reduce_before_dialogue_gain_increase
    garden_birds: reduce_repetitive_calls
    park_stream: reduce_competing_detail_band
    meadow_wind: reduce_competing_midrange
    night_insects: reduce_repetitive_high_frequency_detail
  off_screen_dialogue:
    use_location_geometry: true
    preserve_word_endings: true
    preserve_target_vocabulary: true
    avoid_excessive_occlusion: true
