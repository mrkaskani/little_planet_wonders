locations_assets:
  metadata:
    id: reusable_preschool_location_asset_library
    version: 2
    status: approved-preproduction-schema
    project_id: riri-yoyo
    phase: preproduction
    scope: reusable_location_environment_prop_and_interaction_vocabulary
    audience_age:
      minimum: 3
      maximum: 6
    philosophy: define_what_the_world_contains_and_what_those_things_can_do_once_then_let_episodes_select_and_modify_reusable_pieces
    rules:
      episodes_select_registered_ids: true
      scenes_must_not_redefine_canonical_assets: true
      approved_visual_designs_remain_in_referenced_files: true
      this_file_does_not_duplicate_full_visual_descriptions: true

  reference_policy:
    canonical_sources:
      - approved_location_yaml
      - approved_environment_reference_images
      - approved_asset_reference_files
      - assets/props.yaml
    rules:
      registry_entries_reference_existing_designs: true
      missing_reference_must_be_marked_unavailable: true
      never_recreate_or_infer_visual_design_from_state_name: true
      state_changes_must_not_redesign_asset_or_location: true

  permanent_and_movable_boundary:
    permanent_environment:
      includes:
        - architecture
        - terrain-and-path-geometry
        - fixed-landmarks
        - fixed-doors-windows-and-built-in-storage
        - fixed-play-or-bridge-structures
        - approved-vegetation-groups
      identity_source: each-approved-location-yaml-and-reference-set
      state_changes: lighting-weather-openness-or-approved-temporary-condition-only
    movable_entities:
      recurring_props_source: assets/props.yaml
      costumes_source: assets/costumes.yaml
      vehicles_source: assets/vehicles.yaml
      background_characters_source: assets/background-characters.yaml
      rule: movable-entities-never-become-permanent-landmarks-through-generation
    reject:
      - movable-prop-baked-into-canonical-architecture
      - fixed-landmark-treated-as-a-carryable-prop
      - unregistered-object-invented-by-a-location-description

  location_profile_audit:
    status: completed-awaiting-visual-reference-measurements
    audit_date: "2026-08-19"
    dimensions_policy:
      unit: centimeters
      exact-values-require-approved-reference-or-layout: true
      unknown-values-use-null-not-invented-estimates: true
    required_spatial_fields:
      - boundary-dimensions
      - entrance-ids
      - exit-ids
      - navigation-area-ids
      - safe-interaction-zone-ids
      - camera-safe-view-ids
      - movement-space-ids
      - permanent-landmark-ids
      - approved-movable-asset-ids
    profiles:
      - location_id: kindergarten-exterior
        source: locations/exteriors/location.yaml
        audit: passed-policy-awaiting-reference-measurements
      - location_id: kindergarten-interior
        source: locations/interiors/location.yaml
        audit: passed-policy-awaiting-reference-measurements
      - location_id: kindergarten-play-space
        source: locations/play_spaces/location.yaml
        audit: passed-policy-awaiting-reference-measurements
      - location_id: nature-park
        source: locations/nature_and_parks/location.yaml
        audit: passed-policy-awaiting-reference-measurements
      - location_id: countryside-golden-hour
        source: locations/sunset_golden_hour/location.yaml
        audit: passed-policy-awaiting-reference-measurements
      - location_id: kindergarten-evening-night
        source: locations/evening_night/location.yaml
        audit: passed-policy-awaiting-daylight-geometry-and-variant-references

  wan_2_2_reference_policy:
    contract_source: wan22-preproduction.yaml
    design_review_reference:
      may_be_turnaround_board_or_multi_view_sheet: true
      may_be_used_directly_for_i2v_or_s2v: false
    generation_reference:
      one_coherent_single_frame_required: true
      approved_version_and_source_path_required: true
      allowed_modes_must_be_declared: true
      aspect_ratio_and_pixel_dimensions_required: true
      framing_starting_pose_and_movement_space_required: true
      text_labels_watermarks_duplicate_subjects_and_accidental_faces_forbidden: true
    mode_rules:
      t2v: descriptive-exploration-only-when-exact-layout-is-not-required
      ti2v_text: draft-composition-and-motion-review
      ti2v_image: approved-single-frame-required
      i2v: approved-single-frame-required
      s2v: approved-character-and-location-composite-frame-required

  location_schema:
    required_fields:
      - location_id
      - name
      - category
      - reference
      - zones
      - landmarks
      - entrances
      - exits
      - interaction_points
      - assets
      - environment_states
      - approved_variants
    rules:
      location_id_is_unique: true
      location_reference_is_authoritative: true
      location_instance_state_belongs_in_scene_or_continuity_state: true

  location_categories:
    - home
    - living_room
    - bedroom
    - bathroom
    - kitchen
    - classroom
    - activity_room
    - playground
    - garden
    - park
    - street
    - shop
    - library
    - play_center
    - nature
    - beach
    - forest
    - farm
    - vehicle
    - fantasy
    - other

  zone_schema:
    required_fields:
      - zone_id
      - reference
      - connected_zones
      - landmarks
      - assets
      - interaction_points
      - entry_points
      - exit_points
    rules:
      zones_are_used_for_scene_blocking: true
      connected_zone_required_for_continuous_character_travel: true
      disconnected_transition_requires_registered_transport_or_explicit_cut: true

  landmark_schema:
    required_fields:
      - landmark_id
      - location_id
      - zone_id
      - reference
      - fixed
      - interaction_allowed
    rules:
      permanent_landmark_never_moves_without_approved_location_revision: true
      landmark_id_is_stable_across_camera_angles: true

  asset_schema:
    required_fields:
      - asset_id
      - name
      - category
      - reference
      - default_location
      - default_zone
      - default_storage
      - mobility
      - ownership
      - unique
      - state_dimensions
      - allowed_interactions
    rules:
      asset_id_is_unique: true
      reference_controls_visual_identity: true
      current_state_and_position_belong_in_scene_continuity: true
      unique_asset_must_not_duplicate: true

  asset_categories:
    - structural
    - furniture
    - toy
    - educational_object
    - story_prop
    - container
    - clothing_item
    - wearable
    - food
    - drink
    - tool_child_safe
    - art_supply
    - musical_instrument
    - sports_object
    - playground_equipment
    - vegetation
    - vehicle
    - book
    - decoration
    - background_object
    - interactive_environment_asset

  mobility_schema:
    required_flags:
      - fixed
      - movable
      - carryable
      - wearable
      - rollable
      - pushable
      - pullable
      - environment_animated
    rules:
      fixed_and_movable_must_not_both_be_true: true
      carryable_requires_movable: true
      wearable_requires_movable: true
      movement_not_supported_by_true_flag_is_forbidden: true

  asset_state_vocabulary:
    generic_condition:
      states:
        - pristine
        - clean
        - slightly_dusty
        - dusty
        - dirty
        - muddy
        - wet
        - damp
        - dry
        - messy
        - damaged_mild
        - repaired
      transitions:
        pristine: [clean, slightly_dusty, dirty, wet]
        clean: [pristine, slightly_dusty, dusty, dirty, muddy, wet, messy]
        slightly_dusty: [dusty, dirty, clean]
        dusty: [dirty, clean]
        dirty: [muddy, wet, clean]
        muddy: [wet, clean]
        wet: [damp, dry]
        damp: [dry, wet]
        dry: [wet, damp]
        messy: [clean]
        damaged_mild: [repaired]
        repaired: [clean, pristine]
      trigger_requirements:
        return_to_clean: [wash, clean]
        return_to_dry: [dry, elapsed_drying_time]
        return_to_repaired: [child_safe_repair_action]
      safety:
        dangerous_or_disturbing_damage_forbidden: true

    container_state:
      states:
        - closed
        - slightly_open
        - half_open
        - open
        - empty
        - partially_full
        - full
      independent_dimensions:
        openness: [closed, slightly_open, half_open, open]
        fill: [empty, partially_full, full]
      transitions:
        closed: [slightly_open, half_open, open]
        slightly_open: [closed, half_open, open]
        half_open: [closed, slightly_open, open]
        open: [half_open, slightly_open, closed]
        empty: [partially_full, full]
        partially_full: [empty, full]
        full: [partially_full, empty]

    door_window_state:
      states:
        - closed
        - slightly_open
        - half_open
        - open
        - locked_if_story_safe
        - unlocked
      independent_dimensions:
        openness: [closed, slightly_open, half_open, open]
        lock: [locked_if_story_safe, unlocked]
      rules:
        locked_state_requires_child_safe_story_reason: true
        locked_state_must_not_create_frightening_entrapment: true

    switchable_state:
      states: [off, on]
      transitions:
        off: [on]
        on: [off]

    movement_state:
      states:
        - stationary
        - moving_slowly
        - moving
        - swinging
        - spinning
        - rolling
        - bouncing
        - floating
      rules:
        movement_requires_supported_mobility_flag: true
        state_change_requires_interaction_or_environment_trigger: true

    visibility_state:
      states:
        - visible
        - partially_hidden
        - hidden
        - covered
        - revealed
      rules:
        unique_story_asset_location_remains_tracked_while_hidden: true
        reveal_requires_prior_hidden_or_covered_state: true

    organization_state:
      states:
        - organized
        - slightly_messy
        - messy
        - scattered
        - sorted
      rules:
        return_to_organized_or_sorted_requires_sort_or_cleanup_action: true

    toy_state:
      states:
        - idle
        - being_used
        - moving
        - stored
        - assembled
        - disassembled_child_safe
      rules:
        disassembly_must_be_age_appropriate_and_safe: true

    book_state:
      states:
        - closed
        - open
        - page_turning
        - being_read
        - stored
      rules:
        page_turning_is_momentary: true

    food_state:
      states:
        - whole
        - partially_eaten
        - eaten
        - served
        - spilled
        - being_carried
      rules:
        consumption_state_does_not_reset: true

    drink_state:
      states:
        - full
        - partially_full
        - empty
        - spilled
      rules:
        consumed_or_spilled_amount_does_not_refill_without_pour_or_refill_action: true

    light_state:
      states:
        - off
        - on
        - dim
        - bright
      rules:
        light_intensity_change_requires_switch_or_environment_trigger: true

    water_state:
      states:
        - still
        - rippling
        - flowing
        - splashing
        - bubbling
      rules:
        state_must_match_physical_or_environment_trigger: true

  interaction_vocabulary:
    allowed_ids:
      - look_at
      - approach
      - touch
      - point_at
      - pick_up
      - hold
      - carry
      - give
      - receive
      - share
      - place
      - store
      - retrieve
      - open
      - close
      - push
      - pull
      - roll
      - bounce
      - gently_throw
      - catch
      - stack
      - sort
      - count
      - pour
      - stir
      - eat
      - drink
      - wear
      - remove
      - sit_on
      - climb
      - slide
      - swing
      - press
      - turn
      - wash
      - clean
      - dry
      - decorate
      - draw_on_if_allowed
      - build_with
      - play_with
      - stand_on
      - walk_on
      - enter
      - exit
    interaction_record:
      required_fields:
        - interaction_id
        - character_id
        - asset_id
        - interaction_point_id
        - start_state
        - end_state
        - persistence
    rules:
      asset_must_explicitly_allow_interaction: true
      interaction_must_match_mobility: true
      interaction_must_use_registered_point_when_required: true
      interaction_updates_character_and_asset_state_together: true

  interaction_safety:
    forbidden_encouragement:
      - unsafe_electricity_interaction
      - fire_interaction
      - sharp_object_interaction
      - dangerous_height_access
      - traffic_play
      - hazardous_chemical_interaction
      - unsafe_machinery_operation
    rules:
      every_interaction_must_be_suitable_for_ages_3_to_6: true
      restricted_environment_asset_allows_observe_only: true
      story_required_hazard_must_have_safe_distance_and_clear_guidance: true
      climbing_requires_explicit_child_safe_asset_approval: true

  environment_state_vocabulary:
    weather:
      states:
        - clear
        - sunny
        - partly_cloudy
        - cloudy
        - light_rain
        - medium_rain_story_approved
        - after_rain
        - light_snow_if_location_allows
        - breezy
      rules:
        severe_weather_requires_explicit_story_and_safety_approval: true
        state_must_be_approved_by_location: true
    ground_condition:
      states:
        - dry
        - slightly_wet
        - wet
        - muddy
        - sandy
        - snowy
    room_condition:
      states:
        - tidy
        - slightly_messy
        - messy
        - decorated
        - activity_in_progress
        - cleaned
    time_of_day:
      states:
        - early_morning
        - morning
        - midday
        - afternoon
        - late_afternoon
        - evening
        - night
    event_variant:
      states:
        - normal
        - birthday
        - celebration
        - learning_activity
        - arts_and_crafts
        - music_activity
        - cleanup_time
        - meal_time
        - bedtime
    rules:
      environment_state_is_temporary_scene_state: true
      environment_state_must_not_redesign_canonical_location: true
      state_persists_until_explicit_transition: true

  ownership_vocabulary:
    - character_owned
    - shared
    - location_owned
    - borrowed
    - temporarily_assigned
    - unowned

  uniqueness_policy:
    field: unique
    allowed_values: [true, false]
    rules:
      unique_true_allows_exactly_one_canonical_instance: true
      unique_false_requires_instance_ids_when_multiple_present: true
      unique_story_asset_must_never_duplicate_accidentally: true

  default_location_schema:
    fields:
      - default_location
      - default_zone
      - default_storage
    rules:
      movable_asset_may_leave_default_position: true
      changed_position_persists_until_explicit_move: true
      asset_must_not_teleport_back_to_default: true

  storage_relationships:
    allowed:
      - stored_in
      - stored_on
      - stored_under
      - stored_beside
    required_fields:
      - asset_id
      - relationship
      - storage_asset_id
    rules:
      storage_asset_must_exist: true
      stored_asset_must_not_remain_at_previous_position: true
      retrieve_clears_storage_relationship: true

  spatial_relationships:
    allowed:
      - inside
      - on_top_of
      - underneath
      - beside
      - behind
      - in_front_of
      - near
      - attached_to
      - hanging_from
    required_fields:
      - subject_id
      - relationship
      - reference_id
    rules:
      relationship_must_match_world_geometry: true
      fixed_relationship_persists_across_camera_angles: true

  interaction_point_types:
    - sit_point
    - pickup_point
    - dropoff_point
    - door_handle
    - button
    - shelf_reach
    - slide_top
    - slide_bottom
    - swing_seat
    - table_position
    - entry_threshold
    - exit_threshold
    - stand_point

  scene_selection_schema:
    required_fields:
      - location_id
      - zone_id
      - required_assets
      - asset_states
      - environment_states
    optional_fields:
      - landmarks
      - interaction_points
      - entrances
      - exits
      - spatial_relationships
    validation_sequence:
      - validate_location_id
      - validate_zone_id
      - validate_asset_ids
      - validate_asset_states
      - validate_environment_states
      - validate_interactions
      - validate_safety
      - lock_for_continuity
    rules:
      use_ids_instead_of_redefining_assets: true
      selected_asset_must_belong_to_or_be_allowed_in_location: true

  custom_extension:
    allow_new_asset: true
    allow_new_state: true
    requirements:
      - explicit_definition
      - unique_id
      - story_reason
      - reuse_existing_category_when_possible
      - child_safety_review
    rules:
      do_not_duplicate_existing_asset: true
      do_not_recreate_existing_visual_design: true
      new_state_requires_transition_and_compatibility_definition: true

  continuity_rules:
    state_change_persists_until_valid_transition: true
    position_change_persists_until_valid_movement: true
    examples:
      muddy_asset:
        transition: clean_to_muddy
        persists_until: [wash, clean]
      open_door:
        transition: closed_to_open
        persists_until: [close]
    rules:
      no_unexplained_state_reset: true
      no_unexplained_asset_teleportation: true
      storage_change_updates_previous_location: true
      ownership_change_requires_give_receive_or_assignment: true
      unique_asset_count_remains_one: true

  ai_continuity_rules:
    lock_for_each_asset:
      - asset_id
      - reference
      - state_dimensions
      - current_location
      - current_zone
      - storage_relationship
      - spatial_relationships
      - ownership
      - instance_count
    errors:
      - unregistered_location
      - unregistered_zone
      - unregistered_asset
      - unsupported_asset_state
      - unsupported_interaction
      - duplicated_unique_asset
      - missing_fixed_landmark
      - moved_fixed_asset
      - unexplained_asset_reset
      - unexplained_asset_teleportation
      - visual_identity_drift

  forbidden_behavior:
    - episode_redefines_canonical_location
    - scene_recreates_existing_asset
    - unregistered_location_id
    - unregistered_zone_id
    - unregistered_asset_id
    - unsupported_asset_state
    - unsupported_interaction
    - unsafe_child_interaction
    - fixed_asset_moved
    - unique_asset_duplicated
    - unexplained_state_reset
    - unexplained_asset_teleportation
    - unapproved_environment_variant
    - asset_visual_identity_drift
    - dangerous_or_disturbing_damage_state

  quality_control:
    enforcement: required_before_scene_generation_and_after_every_asset_transition
    checks:
      location_exists: true
      zone_exists: true
      asset_exists: true
      reference_exists: true
      allowed_asset_state: true
      allowed_interaction: true
      interaction_is_child_safe: true
      correct_mobility: true
      correct_ownership: true
      unique_asset_not_duplicated: true
      state_transition_valid: true
      storage_relationship_valid: true
      environment_state_valid: true
      no_unexplained_asset_reset: true
      no_unexplained_asset_teleportation: true
    rejection_conditions:
      - selected_location_zone_or_asset_id_does_not_exist
      - canonical_reference_is_missing
      - asset_state_or_interaction_is_not_allowed
      - interaction_is_not_child_safe
      - mobility_or_ownership_is_violated
      - unique_asset_is_duplicated
      - state_position_or_storage_changes_without_valid_transition
