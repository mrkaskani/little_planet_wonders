positive_prompt: |-
  Polished cinematic preschool storybook animation in the approved kindergarten
  cottage garden at calm blue night.

  Preserve Riri and Yoyo's exact approved version-two identities. Riri is the
  same small friendly dog with the identical facial shape, eyes, muzzle, ears,
  markings, body proportions, colors, and clothing. Yoyo is the same small
  friendly penguin with the identical head shape, eyes, beak, markings, body
  proportions, colors, and clothing.

  Preserve the exact approved evening garden location: the stone cottage,
  steep blue-gray roof, arched entrance, curved flagstone path, fence, trees,
  flowers, warm porch light, and cool moonlit environment. Keep character
  scale, ground contact, screen direction, architecture, background geometry,
  lighting direction, shadows, materials, and color treatment stable.

  Begin with a calm medium-wide two-character composition. Riri stands naturally
  beside Yoyo on the path. Both characters have sufficient space around their
  heads and bodies for natural movement. Their eyes, mouths, muzzle, beak, and
  jawlines remain clearly visible.

  From 0.0 to 0.8 seconds, both characters settle naturally with subtle breathing
  and blinking. From 0.8 to 4.08 seconds, Riri warmly says, "Hi, Yoyo! Look at
  the warm light." Only Riri articulates the speech. Riri gradually turns her
  eyes and muzzle toward the warm porch light and makes one small, gentle,
  readable paw gesture. Yoyo listens with a softly closed beak and stable feet.

  From 4.08 to 4.75 seconds, both characters pause naturally. Riri's mouth rests
  closed. Yoyo prepares to respond without sudden body movement.

  From 4.75 to 6.59 seconds, Yoyo asks, "Is that our garden light?" Only Yoyo's
  beak moves in accurate synchronization with the speech. Yoyo initially turns
  slightly toward Riri, then naturally returns his head and gaze toward the warm
  light. Riri listens with a closed resting mouth.

  From 6.59 to 7.1 seconds, hold a natural conversational pause. Both mouths are
  closed. Maintain gentle breathing and eye behavior.

  From 7.1 to 10.78 seconds, Riri calmly answers, "Yes. It helps us see the
  path." Only Riri articulates this sentence. Yoyo remains a closed-beak,
  attentive listener looking toward the warm light.

  At exactly 8 seconds, gently bring the camera's visual emphasis onto Yoyo's
  penguin face. Show Yoyo looking toward the warm light with a soft expression
  of curiosity and understanding. Riri's voice may continue, but Yoyo must not
  appear to be speaking. Keep the camera movement smooth and preserve spatial
  direction.

  At 10 seconds, transition the camera emphasis toward Riri's dog face. Both of
  Riri's front paws must already be fully on the ground at 10 seconds and remain
  firmly grounded. Riri completes the final words with restrained, accurate
  mouth motion, then closes her mouth into a soft reassuring smile.

  From 10.78 to 12 seconds, hold the Riri-focused closing composition. Riri's
  front paws remain grounded. Yoyo remains a stable closed-beak listener. Finish
  with gentle breathing, one natural blink, and a calm storybook-night mood.

  Maintain continuous motion between every internal five-second Wan window.
  Carry head direction, gaze, facial expression, body pose, gesture trajectory,
  camera movement, and background state naturally across the 5-second and
  10-second boundaries. Use restrained natural acting and stable temporal
  coherence.

