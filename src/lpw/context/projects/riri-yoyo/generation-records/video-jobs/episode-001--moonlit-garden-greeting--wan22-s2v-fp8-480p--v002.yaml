  face, melted features, asymmetrical eyes, lip jitter, jaw distortion, unstable
  mouth, frozen speaking mouth, listener lip-sync, both characters speaking,
  Yoyo speaking during Riri's dialogue, Riri speaking during Yoyo's dialogue,
  music-driven mouth movement, random mouth movement, excessive gesture,
  frantic movement, sudden pose change, sudden head snap, camera shake, abrupt
  unmotivated camera jump, inconsistent lens, inconsistent framing, background
  warping, changing cottage geometry, changing path geometry, moving fence,
  random objects, disappearing objects, lighting flicker, exposure pumping,
  changing time of day, harsh shadows, oversaturation, VAE burn, temporal
  flicker, motion discontinuity, blurry face, obscured eyes, obscured mouth,
