positive_prompt: |-
  Polished cinematic preschool storybook animation in the approved warm pink
  kindergarten play space in soft morning light. Preserve the approved V2 Riri
  and Yoyo identities exactly. Riri is the plush pale-pink puppy with blue chest,
  paw, and tail accents and stays screen-left. Yoyo is the plush black-and-white
  penguin with violet-blue eyes and a small gold beak and stays screen-right.

  Preserve the same large teal-curtain window, exposed pale wooden walking lane,
  circular rug, shelves, cushions, teal-trim playhouse, room geometry, character
  scale, ground contact, materials, perspective, light direction, and soft
  shadows throughout. Keep both full characters readable with safe motion room
  around their heads and limbs. Use a stable preschool eye-level camera and
  smooth motivated camera motion. Exactly one sunny-yellow flat foam circle and
  exactly one sky-blue flat foam square may appear, and only when discovered.
  Continue the incoming pose, gaze, expression, mouth state, gesture trajectory,
  prop ownership, camera motion, lighting, and background without a reset. Use
  restrained natural acting, accurate vocal-driven articulation, stable temporal
  coherence, and a calm child-safe tone.

window_prompts:
  - window_id: window-001
    positive_prompt: >-
      Begin from the approved reference beside the large window. Riri and Yoyo
      walk naturally side by side across the unobstructed wooden floor toward
      the rug. Use alternating toddler steps, believable foot contact, soft ear
      and tail bounce for Riri, a gentle Yoyo waddle, and a very slow forward
      camera track. Neither shape is visible. Both mouths remain naturally at
      rest during the instrumental opening.
  - window_id: window-002
    positive_prompt: >-
      Continue the same unbroken side-by-side walk from the exact incoming step
      phase. They cross the remaining wooden floor and approach the near edge of
      the circular rug without arriving early. Preserve foot contact, screen
      positions, walking rhythm, body scale, and the very slow forward track.
      Neither shape is visible and there is no unprompted mouth motion.
  - window_id: window-003
    positive_prompt: >-
      For the first 0.8 seconds, complete the walk and arrive at the near edge
      of the rug. Then Yoyo on screen-right notices exactly one sunny-yellow flat
      foam circle, bends naturally, reaches with one flipper, and begins lifting
      it. Yoyo's beak alone articulates the vocal line. Riri watches warmly on
      screen-left with a closed resting mouth. Use a gentle push toward Yoyo.
  - window_id: window-004
    positive_prompt: >-
      Continue Yoyo's solo through the first 1.36 seconds. Yoyo indicates the
      circle's round edge and holds it upright at the lower belly, then closes
      the beak. Riri then discovers exactly one sky-blue flat foam square, lowers
      one front paw toward its four equal sides, and begins lifting it while
      Riri's mouth alone articulates the new solo. Yoyo listens and retains the
      same yellow circle. Shift camera emphasis smoothly toward Riri.
  - window_id: window-005
    positive_prompt: >-
      Riri completes the square solo through the first 1.78 seconds, lifting the
      same blue square upright while Yoyo listens with a closed beak and retains
      the yellow circle. Then settle smoothly into a wide symmetrical locked
      two-shot. BOTH characters sing "Let's put them together, they happily say"
      in synchrony, make shared eye contact, bounce subtly, and move their two
      separately held shapes toward the center. Neither is a soloist.
  - window_id: window-006
    positive_prompt: >-
      Continue the stable wide two-shot. BOTH characters sing "Sharing our shapes
      is the best way to play" together on the same beats and make a clear
      cooperative handoff gesture. Keep both shapes separate, fully visible, and
      away from their faces. At 4.46 seconds the lyric ends; place the blue square
      and yellow circle neatly side by side on the rug and begin preparing for a
      high-five without completing the contact in this window.
  - window_id: window-007
    positive_prompt: >-
      Continue the prepared celebration pose. Riri on screen-left raises exactly
      one front paw and Yoyo on screen-right raises exactly one flipper. Animate
      one clean approach, one gentle paw-to-flipper high-five contact, one tiny
      happy bounce, and a calm held ending through the musical cadence. Mouth and
      beak remain relaxed after the lyric with no silent chatter. Keep both shapes
      stable side by side on the rug and settle the camera gently.

