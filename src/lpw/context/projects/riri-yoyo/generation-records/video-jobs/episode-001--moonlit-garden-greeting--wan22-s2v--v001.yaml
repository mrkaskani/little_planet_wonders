  restrained natural breathing, blinking, listening reactions, and readable
  speech-driven mouth motion only for the named active speaker. Maintain stable
  geometry, coherent shadows, temporal continuity, and soft cinematic movement.

global_negative_prompt: >-
  identity drift, face change, body-proportion change, costume change, color
  change, duplicate character, extra character, missing character, merged bodies,
  floating feet or paws, sliding ground contact, deformed paws, deformed flippers,
  extra limbs, missing limbs, random objects, changing cottage geometry, changing
  path geometry, lighting flicker, exposure pumping, abrupt camera jump, warped
  background, excessive motion, frantic acting, adult drama, listener lip-sync,
  both characters speaking simultaneously, random mouth movement, frozen face,
  lip jitter, jaw distortion, text, subtitles, logo, watermark, collage, split
  screen, music-driven motion, sound-effect-driven mouth movement

