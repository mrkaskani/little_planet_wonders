id: riri-yoyo-reference-registry
type: reference-registry-context
version: 1
status: approved-registry-with-open-location-and-character-v2-reviews

metadata:
  project_id: riri-yoyo
  phase: preproduction
  purpose: canonical-versioned-reference-inventory-and-conditioning-authority
  asset_conventions: asset-conventions.yaml
  view_requirements: reference-views.yaml

status_semantics:
  planned: requirement-exists-but-no-file-has-been-created
  candidate: file-exists-but-is-not-approved-authority
  technical-review: objective-format-and-structure-review-in-progress
  creative-review: visual-or-audible-identity-review-in-progress
  approved: eligible-only-for-recorded-allowed-modes
  rejected: never-use
  deprecated: historical-record-only

authority_rules:
  - approved-yaml-remains-canonical-for-textual-identity-and-policy
  - approved-reference-controls-only-the-visible-or-audible-properties-it-declares
  - character-design-sheet-is-review-only-and-never-a-generation-frame
  - one-coherent-approved-frame-is-required-for-identity-critical-i2v-and-all-s2v
  - file-existence-generation-or-technical-pass-never-implies-creative-approval
  - every-replacement-retains-history-and-requires-a-new-version-and-hash

reference_schema:
  required_fields:
    - id
    - entity-id
    - kind
    - version
    - status
    - authority
    - path
    - expected-path
    - sha256
    - allowed-modes
    - forbidden-modes
    - aspect-ratio
    - pixel-dimensions
    - framing
    - starting-pose-or-state
    - movement-space
    - known-limitations
    - replaces
  path_rule: path-is-null-until-file-exists
  hash_rule: sha256-is-required-when-path-is-not-null

