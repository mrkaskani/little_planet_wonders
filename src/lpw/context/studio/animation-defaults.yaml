id: animation-defaults
type: studio-context
version: 1

technical:
  frame_rate: 24
  aspect_ratio: "16:9"

merge_policy:
  scalar: override
  dictionary: recursive_merge
  lists:
    constraints: append_unique
    forbidden: append_unique
    characters: merge_by_id
    props: merge_by_id
    references: append_unique
  immutable:
    - project.id
    - technical.frame_rate
    - technical.aspect_ratio

constraints:
  - preserve approved character identity
  - preserve approved location geometry
  - preserve child-safe visual and motion direction
  - keep action and expressions clear for preschool viewers
