scene_state:
  scene_id: rooftop-confrontation

  opening:
    environment:
      location: rooftop
      time_of_day: night
      weather: heavy-rain
      ground_condition: wet
      primary_light_direction: camera-right
      primary_light_color: cold-cyan
      secondary_light_color: muted-burgundy

    characters:
      roxana:
        wardrobe: roxana-primary
        hair_condition: wet
        injury: cut-on-right-hand
        position: rooftop-east
        looking_direction: camera-left
        emotional_state: uncertain
        visible: false
      shakiba:
        wardrobe: shakiba-primary
        hair_condition: wet
        injury: none
        position: rooftop-west
        looking_direction: camera-right
        emotional_state: guarded
        visible: false

    props:
      black-data-device:
        owner: shakiba
        holder: shakiba
        condition: active
        visibility: visible
        screen_position: shakiba-right-hand
      weapon:
        owner: roxana
        holder: null
        condition: secured
        visibility: hidden
        screen_position: roxana-right-holster

  expected_end:
    environment:
      location: rooftop
      time_of_day: night
      weather: heavy-rain
      ground_condition: wet
      primary_light_direction: camera-right
      primary_light_color: cold-cyan
      secondary_light_color: muted-burgundy

    characters:
      roxana:
        wardrobe: roxana-primary
        hair_condition: wet
        injury: cut-on-right-hand
        position: rooftop-east
        looking_direction: camera-left
        emotional_state: confrontational
        visible: true
      shakiba:
        wardrobe: shakiba-primary
        hair_condition: wet
        injury: none
        position: rooftop-west
        looking_direction: camera-right
        emotional_state: fearful-but-determined
        visible: true

    props:
      black-data-device:
        owner: shakiba
        holder: shakiba
        condition: active
        visibility: visible
        screen_position: shakiba-right-hand
      weapon:
        owner: roxana
        holder: null
        condition: secured
        visibility: hidden
        screen_position: roxana-right-holster

  global_rules:
    - black-data-device-must-remain-in-shakiba-right-hand
    - roxana-weapon-must-remain-holstered
    - rain-must-continue-throughout-the-scene
    - light-direction-must-not-reverse
    - roxana-must-remain-on-screen-right
    - shakiba-must-remain-on-screen-left
