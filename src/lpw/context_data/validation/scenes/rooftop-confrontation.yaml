scene_validation:
  scene_id: rooftop-confrontation
  scene_rules:
    expected_width: 1280
    expected_height: 720
    expected_fps: 24
    expected_duration_seconds: 17
    duration_tolerance_seconds: 0.50
    required_semantic_checks:
      - rain-continuity
      - cyan-light-direction
      - burgundy-fill-light
      - rooftop-layout
      - roxana-screen-right
      - shakiba-screen-left
      - device-remains-with-shakiba
      - weapon-remains-holstered
  shots:
    shot-001:
      expected_duration_seconds: 5
      audio_required: true
      semantic_checks:
        - no-visible-characters
        - rooftop-layout
        - rain-continuity
        - slow-camera-push-in
        - no-architecture-warping
    shot-002:
      expected_duration_seconds: 4
      audio_required: true
      semantic_checks:
        - roxana-identity
        - roxana-black-hair
        - roxana-burgundy-jacket
        - roxana-screen-right
        - roxana-looking-camera-left
        - correct-persian-dialogue
        - correct-roxana-voice
        - accurate-lip-synchronization
        - no-extra-character
    shot-003:
      expected_duration_seconds: 3
      audio_required: true
      semantic_checks:
        - shakiba-identity
        - shakiba-dark-blue-coat
        - shakiba-screen-left
        - device-in-right-hand
        - device-design-consistency
        - no-speaking-mouth-motion
        - controlled-eye-movement
        - controlled-hand-movement
    shot-004:
      expected_duration_seconds: 5
      audio_required: true
      semantic_checks:
        - shakiba-identity
        - shakiba-dark-blue-coat
        - shakiba-screen-left
        - device-in-right-hand
        - correct-persian-dialogue
        - correct-shakiba-voice
        - accurate-lip-synchronization
        - restrained-emotion
        - very-slow-camera-push-in
