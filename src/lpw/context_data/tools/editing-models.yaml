models:
  # Runtime artifacts are installed and managed outside this repository.
  download_policy: never
  artifact_policy: externally-managed

  visual_analyzer:
    enabled: false
    provider: local
    transport: http-json
    model: allenai/Molmo2-8B
    endpoint: null
    purpose:
      - temporal_analysis
      - action_detection
      - continuity_extraction
      - visual_defect_detection

  audiovisual_analyzer:
    enabled: false
    provider: local
    transport: http-json
    model: Qwen/Qwen3-Omni-30B-A3B-Thinking
    endpoint: null
    purpose:
      - dialogue_analysis
      - music_analysis
      - ambience_analysis
      - sound_event_detection
      - audio_video_synchronization

  audio_captioner:
    enabled: false
    provider: local
    transport: http-json
    model: Qwen/Qwen3-Omni-30B-A3B-Captioner
    endpoint: null
    purpose:
      - detailed_audio_description

  editing_planner:
    enabled: false
    provider: local
    transport: http-json
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
    endpoint: null
    output_schema: tools/schemas/edit-decision-list.schema.json
    purpose:
      - take_selection
      - trim_selection
      - shot_ordering
      - audio_timeline
      - continuity_repair
      - edit_decision_list

  video_generator:
    enabled: false
    provider: local
    transport: comfyui
    model: wan-2.2
    endpoint: null
    purpose:
      - missing_shot_generation

  editing_executor:
    enabled: true
    provider: local
    transport: subprocess
    engine: ffmpeg
    purpose:
      - edit_decision_list_execution

  # Optional lower-memory profile. These services remain externally managed and
  # disabled until an operator configures local endpoints.
  lightweight_visual_analyzer:
    enabled: false
    provider: local
    transport: http-json
    model: allenai/Molmo2-4B
    endpoint: null
    purpose:
      - temporal_analysis
      - action_detection
      - continuity_extraction

  lightweight_editing_planner:
    enabled: false
    provider: local
    transport: http-json
    model: Qwen/Qwen3-4B-Instruct-2507
    endpoint: null
    output_schema: tools/schemas/edit-decision-list.schema.json
    purpose:
      - take_selection
      - trim_selection
      - edit_decision_list

  lightweight_transcriber:
    enabled: false
    provider: local
    transport: http-json
    model: whisper
    endpoint: null
    purpose:
      - dialogue_transcription
      - dialogue_timing

  lightweight_audio_classifier:
    enabled: false
    provider: local
    transport: http-json
    model: clap
    endpoint: null
    purpose:
      - music_classification
      - ambience_classification
      - sound_event_detection
