tools:
  voice-cosyvoice:
    kind: voice
    provider: cosyvoice
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8001"
      endpoint: "/generate"
      timeout_seconds: 300
      response_output_field: output_path
      defaults:
        language: fa
        sample_rate: 24000
        format: wav

  keyframe-qwen:
    kind: image
    provider: qwen-image
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8002"
      endpoint: "/generate"
      timeout_seconds: 600
      response_output_field: output_path
      defaults:
        width: 1280
        height: 720
        format: png

  wan22-comfyui:
    kind: video
    provider: comfyui
    enabled: false
    transport: comfyui
    settings:
      download_weights: false
      allow_animation: false
      supported_modes:
        - t2v
        - i2v
        - ti2v
        - s2v
      base_url: "http://127.0.0.1:8188"
      prompt_endpoint: "/prompt"
      history_endpoint: "/history/{prompt_id}"
      poll_interval_seconds: 2
      timeout_seconds: 3600
      shared_input_directory: /Users/oldowl/ComfyUI/input
      output_directory: /Users/oldowl/ComfyUI/output

  ambience-generator:
    kind: ambience
    provider: audio-generator
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8003"
      endpoint: "/generate-ambience"
      timeout_seconds: 600
      response_output_field: output_path

  sound-effect-generator:
    kind: sound-effect
    provider: audio-generator
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8003"
      endpoint: "/generate-sound-effect"
      timeout_seconds: 300
      response_output_field: output_path

  music-generator:
    kind: music
    provider: music-generator
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8004"
      endpoint: "/generate"
      timeout_seconds: 900
      response_output_field: output_path

  latent-sync:
    kind: lip-sync
    provider: latentsync
    enabled: false
    transport: http-json
    settings:
      base_url: "http://127.0.0.1:8005"
      endpoint: "/lip-sync"
      timeout_seconds: 1800
      response_output_field: output_path

  ffmpeg:
    kind: editor
    provider: ffmpeg
    enabled: true
    transport: subprocess
    settings:
      executable: ffmpeg
      probe_executable: ffprobe
      video_codec: libx264
      audio_codec: aac
      pixel_format: yuv420p
      audio_sample_rate: 48000
      audio_channels: 2
