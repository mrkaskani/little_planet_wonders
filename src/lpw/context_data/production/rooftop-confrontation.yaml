production:
  scene_id: rooftop-confrontation
  output_directory: renders/rooftop-confrontation

  stages:
    dialogue:
      enabled: true
      tool: voice-cosyvoice
      generate_when_missing: true

    keyframes:
      enabled: true
      tool: keyframe-qwen
      generate_when_missing: true

    video:
      enabled: true
      tool: wan22-comfyui
      workflow_by_mode:
        t2v: wan-t2v
        i2v: wan-i2v
        ti2v: wan-ti2v
        s2v: wan-s2v

    lip_sync:
      enabled: false
      tool: latent-sync
      apply_to_modes:
        - i2v
        - ti2v

    editing:
      enabled: true
      tool: ffmpeg
      normalize_clips: true
      include_dialogue_audio: true
      output_file: rooftop-confrontation-final.mp4

  audio:
    ambience:
      enabled: true
      tool: ambience-generator
      prompt: >
        Continuous rainy rooftop ambience at night. Moderate rain,
        distant city traffic, subtle wind around metal structures,
        no thunder, no voices, cinematic stereo perspective.
      start_seconds: 0
      duration_seconds: 17
      volume: 0.25

    sound_effects:
      - id: rooftop-door-metal-rattle
        enabled: true
        tool: sound-effect-generator
        prompt: >
          A short subtle metal rooftop door rattle caused by wind.
        start_seconds: 2.5
        duration_seconds: 1.2
        volume: 0.35

      - id: device-grip
        enabled: true
        tool: sound-effect-generator
        prompt: >
          Quiet hand tightening around a small metal electronic
          device, subtle wet glove and metal contact.
        start_seconds: 10.2
        duration_seconds: 0.8
        volume: 0.45

    music:
      enabled: true
      tool: music-generator
      prompt: >
        Restrained cinematic tension music with soft low strings,
        subtle electronic texture and sparse pulse. No vocals, no
        strong percussion, unresolved ending.
      start_seconds: 0
      duration_seconds: 17
      volume: 0.18
