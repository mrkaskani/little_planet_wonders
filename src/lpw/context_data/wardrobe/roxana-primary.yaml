wardrobe:
  id: roxana-primary
  character_id: roxana
  name: Roxana Primary Rooftop Wardrobe

  items:
    - id: burgundy-jacket
      type: jacket
      visual_identity:
        color: deep-burgundy
        material: waterproof-fabric
        fit: fitted
        length: waist-length
        distinctive_features:
          - black-collar
          - silver-front-zipper
          - narrow-black-cuffs

    - id: black-shirt
      type: shirt
      visual_identity:
        color: matte-black
        material: cotton
        fit: fitted

    - id: dark-trousers
      type: trousers
      visual_identity:
        color: charcoal
        material: tactical-fabric
        fit: straight

    - id: black-boots
      type: footwear
      visual_identity:
        color: black
        material: leather
        height: ankle

  accessories:
    - id: right-side-holster
      position: right-hip
      contains: weapon

  scene_adjustments:
    wetness: medium
    dirt: low
    damage: none

  continuity_rules:
    preserve:
      - burgundy-jacket-color
      - black-collar
      - silver-front-zipper
      - right-side-holster
      - charcoal-trousers
      - black-boots
    forbidden_changes:
      - jacket-color-change
      - jacket-disappearing
      - holster-moving-to-left-side
      - footwear-change
      - unexplained-clothing-damage
