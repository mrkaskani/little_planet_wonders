[project]
name = "little-planet-wonders"
version = "0.1.0"
description = "Context-aware cinematic shot, audio, and edit planning MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
little-planet-wonders = "little_planet_wonders.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["little_planet_wonders"]
