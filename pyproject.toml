[project]
name = "lpw"
version = "0.1.0"
description = "Context-aware cinematic shot, audio, and edit planning MCP server"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.9,<3",
    "mcp[cli]>=2.0.0,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
lpw = "lpw.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/lpw"]
